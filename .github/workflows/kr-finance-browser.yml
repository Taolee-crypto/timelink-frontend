name: Korean finance browser integration
on:
  push:
    branches: [main]
    paths: ['public/admin.html','public/admin-kr-finance.*','scripts/test-kr-finance-browser.cjs','.github/workflows/kr-finance-browser.yml']
  pull_request:
    paths: ['public/admin.html','public/admin-kr-finance.*','scripts/test-kr-finance-browser.cjs','.github/workflows/kr-finance-browser.yml']
permissions:
  contents: read
jobs:
  kr-finance-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --ignore-scripts playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-kr-finance-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kr-finance-fixture-browser
          path: test-results/
          if-no-files-found: ignore
