name: V5 contribution admin browser validation
on:
  pull_request:
    paths: ['public/contribution-policy.*','public/admin.html','public/reward-policy.html','scripts/test-reward-policy-retirement.cjs','.github/workflows/v5-contribution-admin-ui.yml']
  push:
    branches: [main]
    paths: ['public/contribution-policy.*','public/admin.html','public/reward-policy.html','scripts/test-reward-policy-retirement.cjs','.github/workflows/v5-contribution-admin-ui.yml']
permissions:
  contents: read
concurrency:
  group: contribution-admin-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  contribution-admin:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify original reward controls and retired proposal
        run: node scripts/test-reward-policy-retirement.cjs
      - run: node scripts/check-inline-js.cjs
