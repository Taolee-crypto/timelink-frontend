name: V5 contribution admin browser validation
on:
  pull_request:
    paths: ['public/contribution-policy.*','public/admin.html','public/reward-policy.html','scripts/test-contribution-policy-ui.cjs','.github/workflows/v5-contribution-admin-ui.yml']
  push:
    branches: [main]
    paths: ['public/contribution-policy.*','scripts/test-contribution-policy-ui.cjs','.github/workflows/v5-contribution-admin-ui.yml']
permissions:
  contents: read
concurrency:
  group: contribution-admin-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  contribution-admin:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Taolee-crypto/timelink-backend
          ref: e68c734c862d3ba93253a37e369589e64f61c35f
          path: .contribution-test-backend
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
        working-directory: .contribution-test-backend
      - name: Install pinned browser driver only
        timeout-minutes: 2
        run: npm install --no-save --ignore-scripts playwright@1.51.1
      - name: Verify preinstalled Chrome
        run: |
          test -x /usr/bin/google-chrome
          /usr/bin/google-chrome --version
      - name: Verify contribution admin in Chrome
        timeout-minutes: 2
        run: node scripts/test-contribution-policy-ui.cjs
        env:
          TL_CONTRIBUTION_BACKEND_ROOT: .contribution-test-backend
          TL_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v5-contribution-admin-browser
          path: test-results/
          if-no-files-found: ignore
