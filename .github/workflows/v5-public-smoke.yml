name: V5 Public Smoke
on:
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * *'
jobs:
  public-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/audit-v5-navigation.mjs
      - run: node scripts/smoke-v5-public.mjs
