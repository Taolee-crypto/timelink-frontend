name: Sales manager and store browser integration
on:
  push:
    branches: [main]
    paths: ['public/sales-manager.*','public/sales-channel-bind.js','public/cafe-channel.html','public/cafe-world.html','public/cafe-studio.html','scripts/test-sales-browser.cjs','.github/workflows/sales-browser.yml']
  pull_request:
    paths: ['public/sales-manager.*','public/sales-channel-bind.js','public/cafe-channel.html','public/cafe-world.html','public/cafe-studio.html','scripts/test-sales-browser.cjs','.github/workflows/sales-browser.yml']
permissions:
  contents: read
jobs:
  sales-store-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --ignore-scripts playwright esbuild hono
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-sales-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sales-store-fixture-browser
          path: test-results/
          if-no-files-found: ignore
