name: Sales manager and store browser integration
on:
  push:
    branches: [main]
    paths: ['public/sales-manager.*','public/sales-channel-bind.js','public/cafe-channel.html','public/cafe-world.html','public/cafe-studio.html','scripts/test-sales-browser.cjs','.github/workflows/sales-browser.yml']
  pull_request:
    paths: ['public/sales-manager.*','public/sales-channel-bind.js','public/cafe-channel.html','public/cafe-world.html','public/cafe-studio.html','scripts/test-sales-browser.cjs','.github/workflows/sales-browser.yml']
permissions:
  contents: read
jobs:
  sales-store-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      TL_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned browser driver and test dependencies
        timeout-minutes: 2
        run: npm install --no-save --ignore-scripts playwright@1.51.1 esbuild hono
      - name: Verify preinstalled Chrome
        run: |
          test -x "$TL_CHROMIUM_EXECUTABLE"
          "$TL_CHROMIUM_EXECUTABLE" --version
      - run: node scripts/test-sales-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sales-store-fixture-browser
          path: test-results/
          if-no-files-found: ignore
