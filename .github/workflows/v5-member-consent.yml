name: V5 member registration consent UI
on:
  pull_request:
    paths:
      - 'public/signup.html'
      - 'scripts/test-v5-signup-consent-ui.cjs'
      - '.github/workflows/v5-member-consent.yml'
  push:
    branches: [main]
    paths:
      - 'public/signup.html'
      - 'scripts/test-v5-signup-consent-ui.cjs'
      - '.github/workflows/v5-member-consent.yml'
permissions:
  contents: read
jobs:
  signup-consent:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check test syntax
        run: node --check scripts/test-v5-signup-consent-ui.cjs
      - name: Verify mandatory legal consent in registration and email verification
        run: node scripts/test-v5-signup-consent-ui.cjs
