name: V5 audible-time metering regression
on:
  pull_request:
    paths:
      - 'public/tl3-v5-player.js'
      - 'scripts/test-v5-tl3-audible-meter.cjs'
      - '.github/workflows/v5-tl3-audible-meter.yml'
  push:
    branches: [main]
    paths:
      - 'public/tl3-v5-player.js'
      - 'scripts/test-v5-tl3-audible-meter.cjs'
      - '.github/workflows/v5-tl3-audible-meter.yml'
permissions:
  contents: read
jobs:
  audible-meter:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check protected playback
        run: node --check public/tl3-v5-player.js && node --check scripts/test-v5-tl3-audible-meter.cjs
      - name: Verify actual audible seconds on V5 end and seek
        run: node scripts/test-v5-tl3-audible-meter.cjs
