name: Wallet V5 contracts
on:
  push:
    paths:
      - 'public/wallet.html'
      - 'public/renewal/wallet.js'
      - 'scripts/test-v5-wallet-contracts.cjs'
      - '.github/workflows/wallet-v5-contracts.yml'
  pull_request:
    paths:
      - 'public/wallet.html'
      - 'public/renewal/wallet.js'
      - 'scripts/test-v5-wallet-contracts.cjs'
      - '.github/workflows/wallet-v5-contracts.yml'
jobs:
  wallet-contracts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-v5-wallet-contracts.cjs
      - run: node scripts/test-wallet-history-safe-atoms.cjs
