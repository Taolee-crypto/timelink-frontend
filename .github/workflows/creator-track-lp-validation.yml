name: Creator and Track LP Enhanced validation

on:
  pull_request:
    branches: [main]
    paths:
      - "public/creator.html"
      - "public/track.html"
      - "public/tl3.js"
      - "public/tl3-audio-lp-enhanced.js"
      - "public/tl3-lp-worklet.js"
      - "scripts/validate-creator-track-lp.py"
      - ".github/workflows/creator-track-lp-validation.yml"
  push:
    branches: [main]
    paths:
      - "public/creator.html"
      - "public/track.html"
      - "public/tl3.js"
      - "public/tl3-audio-lp-enhanced.js"
      - "public/tl3-lp-worklet.js"
      - "scripts/validate-creator-track-lp.py"
      - ".github/workflows/creator-track-lp-validation.yml"

jobs:
  creator-track-lp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate current Creator and Track files
        run: python scripts/validate-creator-track-lp.py
