name: Install Shared Place Fireworks Videos
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/install-fireworks.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg and ffprobe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Download and optimize the two Pexels MP4 assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/media
          download() {
            local id="$1" filename="$2" output="$3"
            local url="https://videos.pexels.com/video-files/${id}/${filename}"
            echo "Downloading Pexels video ${id}"
            curl -fL --retry 3 --connect-timeout 15 --max-time 240 -A 'Mozilla/5.0' "$url" -o "/tmp/${id}.mp4"
            ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=nw=1 "/tmp/${id}.mp4" | grep -q codec_name
            ffmpeg -hide_banner -loglevel error -y -i "/tmp/${id}.mp4" -t 5 -an -vf 'scale=640:-2' -c:v libx264 -preset fast -crf 29 -movflags +faststart "public/media/${output}"
            test -s "public/media/${output}"
          }
          download 963206 963206-hd_720_1280_30fps.mp4 timelink-fireworks-first.mp4
          download 5451399 5451399-hd_1920_1080_24fps.mp4 timelink-fireworks-double.mp4
      - name: Commit fireworks MP4 assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/media/timelink-fireworks-first.mp4 public/media/timelink-fireworks-double.mp4
          if ! git diff --cached --quiet; then
            git commit -m "assets: add fireworks videos for Share Place lucky draws"
            git push
          fi
