name: Install Shared Place Fireworks Videos
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/install-fireworks.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and optimize licensed Pexels fireworks videos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/media
          download() {
            local id="$1" output="$2"
            curl -fLsS --retry 3 --max-time 120 -A 'Mozilla/5.0' "https://www.pexels.com/video/${id}/download/" -o "/tmp/fireworks-${id}.mp4"
            ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 "/tmp/fireworks-${id}.mp4" >/dev/null
            ffmpeg -hide_banner -loglevel error -y -ss 0 -i "/tmp/fireworks-${id}.mp4" -t 5 -an -vf 'scale=640:-2' -c:v libx264 -preset fast -crf 29 -movflags +faststart "public/media/${output}"
            test -s "public/media/${output}"
          }
          download 963206 timelink-fireworks-first.mp4
          download 5451399 timelink-fireworks-double.mp4
      - name: Commit prepared media
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/media/timelink-fireworks-first.mp4 public/media/timelink-fireworks-double.mp4
          if ! git diff --cached --quiet; then
            git commit -m "assets: install licensed fireworks clips for luck draws"
            git push
          fi
