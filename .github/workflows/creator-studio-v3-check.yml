name: TL3 Creator and Track validation

on:
  pull_request:
    branches: [main]
    paths:
      - "public/creator-studio.html"
      - "public/track.html"
      - "public/tl3.js"
      - "public/tl3-lp.js"
      - "public/tl3-manufacture.js"
      - ".github/workflows/creator-studio-v3-check.yml"
  push:
    branches: [main]
    paths:
      - "public/creator-studio.html"
      - "public/track.html"
      - "public/tl3.js"
      - "public/tl3-lp.js"
      - "public/tl3-manufacture.js"
      - ".github/workflows/creator-studio-v3-check.yml"

jobs:
  tl3-lp-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check TL3 JavaScript syntax
        run: |
          node --check public/tl3.js
          node --check public/tl3-lp.js
          node --check public/tl3-manufacture.js
      - name: Check Creator and Track inline JavaScript
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess, tempfile

          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.inline = []
                  self.active = False
                  self.parts = []
              def handle_starttag(self, tag, attrs):
                  if tag == "script" and not any(k.lower() == "src" for k, _ in attrs):
                      self.active = True
                      self.parts = []
              def handle_data(self, data):
                  if self.active:
                      self.parts.append(data)
              def handle_endtag(self, tag):
                  if tag == "script" and self.active:
                      self.inline.append("".join(self.parts))
                      self.active = False

          for page in ("public/creator-studio.html", "public/track.html"):
              parser = Scripts()
              parser.feed(Path(page).read_text(encoding="utf-8"))
              for source in parser.inline:
                  if not source.strip():
                      continue
                  with tempfile.NamedTemporaryFile("w", suffix=".js", encoding="utf-8") as f:
                      f.write(source)
                      f.flush()
                      subprocess.run(["node", "--check", f.name], check=True)
              print(f"Validated inline scripts: {page}")

          creator = Path("public/creator-studio.html").read_text(encoding="utf-8")
          track = Path("public/track.html").read_text(encoding="utf-8")
          manufacture = Path("public/tl3-manufacture.js").read_text(encoding="utf-8")
          player = Path("public/tl3.js").read_text(encoding="utf-8")
          assert "lp-v1-runtime" in creator
          assert "TL3_LP_FLAC.encode" not in creator
          assert "lp_opus_b64" not in manufacture
          assert "lp-v1-runtime" in player or "realtime vinyl DSP" in player
          assert "/tl3-lp.js" in track
          assert "segment/confirm/" in player
          assert "genSid()" in player
          print("Validated LP metadata-only publishing, realtime Track DSP and TL3 segment sessions.")
          PY
