name: Time purchase checkout
on:
  pull_request:
  push:
    branches: [main]
jobs:
  time-checkout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check public/tl-time-luck.js
      - run: node scripts/test-time-luck.cjs
      - run: node scripts/test-store-payment-checkout.cjs
      - run: node --check public/store-music-player-v5.js
      - run: node scripts/test-store-music-v5.cjs
