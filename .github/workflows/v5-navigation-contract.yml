name: V5 Navigation Contract
on:
  push:
    branches: [main]
    paths: ['public/**', 'scripts/audit-v5-navigation.mjs', '.github/workflows/v5-navigation-contract.yml']
  pull_request:
    paths: ['public/**', 'scripts/audit-v5-navigation.mjs', '.github/workflows/v5-navigation-contract.yml']
  workflow_dispatch:
jobs:
  navigation-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/audit-v5-navigation.mjs
