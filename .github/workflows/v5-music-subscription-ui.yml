name: V5 music subscription browser validation
on:
  pull_request:
    paths: ['public/music-subscriptions.*','public/wallet.html','public/payment-success.html','public/payment-fail.html','scripts/test-music-subscriptions-ui.cjs','.github/workflows/v5-music-subscription-ui.yml']
  push:
    branches: [main]
    paths: ['public/music-subscriptions.*','public/payment-success.html','public/payment-fail.html','scripts/test-music-subscriptions-ui.cjs','.github/workflows/v5-music-subscription-ui.yml']
permissions:
  contents: read
concurrency:
  group: music-subscription-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  music-subscription-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Taolee-crypto/timelink-backend
          ref: 48deadb1928a6e317b36a9531f4ca99b2e23e440
          path: .music-test-backend
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
        working-directory: .music-test-backend
      - name: Install pinned browser driver only
        timeout-minutes: 2
        run: npm install --no-save --ignore-scripts playwright@1.51.1
      - name: Verify preinstalled Chrome
        run: |
          test -x /usr/bin/google-chrome
          /usr/bin/google-chrome --version
      - name: Verify music subscriptions in Chrome
        timeout-minutes: 2
        run: node scripts/test-music-subscriptions-ui.cjs
        env:
          TL_MUSIC_BACKEND_ROOT: .music-test-backend
          TL_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v5-music-subscription-browser
          path: test-results/
          if-no-files-found: ignore
