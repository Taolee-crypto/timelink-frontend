name: V5 work ledger integrity
on:
  pull_request:
  push:
    branches: [main]
jobs:
  ledger-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-v5-work-ledger.mjs
