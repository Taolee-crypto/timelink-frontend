name: V5 work ledger integrity
on:
  pull_request:
  push:
    branches: [main]
jobs:
  ledger-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-v5-work-ledger.mjs
      - run: node scripts/test-v5-shareplace-retired-count.cjs
      - run: node scripts/test-wallet-history-safe-atoms.cjs
      - run: node scripts/test-member-staff-ui.cjs
      - run: node scripts/test-poc-proof-ui.cjs
      - run: node scripts/test-v5-referral-ui.cjs
      - run: node scripts/test-legal-policy-alignment.cjs
      - run: node scripts/test-profit-safety-ui.cjs
      - run: node scripts/test-v5-tlc-mining-split-ui.cjs
      - run: node scripts/test-v5-dashboard-private-inventory.cjs
      - run: node scripts/test-v5-admin-infra-ui.cjs
      - run: node scripts/test-v5-common-infra-pages.cjs
      - run: node scripts/test-v5-dashboard-wallet-truth.cjs
      - run: node scripts/test-v5-share-market-layout-footer.cjs
      - run: node scripts/test-v5-share-market-track-entry.cjs
      - run: node scripts/test-v5-share-market-wallet-visible.cjs
      - run: node scripts/test-v5-share-market-safe-actions.cjs
      - run: node scripts/test-v5-track-secure-stream-lyrics.cjs
      - run: node scripts/test-v5-track-rights-editor.cjs
      - run: node scripts/test-v5-track-wallet-settlement.cjs
      - run: node scripts/test-v5-track-social-ui.cjs
      - run: node scripts/test-v5-creator-existing-intake.cjs
