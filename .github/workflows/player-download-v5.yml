name: Player download V5 official release contract
on:
  pull_request:
    paths:
      - 'public/download.html'
      - 'scripts/test-player-download-v5.cjs'
      - '.github/workflows/player-download-v5.yml'
  push:
    branches: [main]
    paths:
      - 'public/download.html'
      - 'scripts/test-player-download-v5.cjs'
      - '.github/workflows/player-download-v5.yml'
permissions:
  contents: read
jobs:
  download-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-player-download-v5.cjs
      - run: node scripts/check-inline-js.cjs
      - run: node scripts/audit-v5-navigation.mjs
