name: Frontend inline JavaScript syntax
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check-inline-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check inline scripts in public HTML
        run: node scripts/check-inline-js.cjs
