name: Frontend renewal regression
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  renewal-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/check-inline-js.cjs
      - run: node scripts/test-admin-finance-ui.cjs
      - run: node scripts/test-certificate-fee-ui.cjs
      - run: node scripts/test-creator-music-gate.cjs
      - run: node scripts/test-creator-spotify.cjs
      - run: node scripts/test-creator-contributor-form.cjs
      - run: node scripts/audit-v5-navigation.mjs
      - run: node scripts/test-v5-release-acceptance.cjs
      - run: node scripts/test-my-works-menu-dedup.cjs
      - run: node scripts/test-renewal-host.cjs
      - run: node scripts/test-score-retired.cjs
      - run: node scripts/test-tl3-v5-numeric-resolve.cjs
      - run: node scripts/test-cafe-space.cjs
      - run: node scripts/test-member-staff-ui.cjs
      - run: node scripts/test-cafe-decor-world.cjs
      - run: node scripts/test-tilo-personal-listener-billing.cjs
      - run: node scripts/test-radio-screen.cjs
      - run: node scripts/test-tilo-operations-ui.cjs
      - run: node scripts/test-tilo-empty-country-recovery.cjs
      - run: node scripts/test-tilo-three-page-contract.cjs
      - run: node scripts/test-dj-center-ui.cjs
      - run: node scripts/test-creator-earnings-ui.cjs
      - run: node scripts/check-renewal-assets.cjs
