name: V5 purchased TL legal maturity admin UI
on:
  pull_request:
    paths:
      - 'public/admin-tlp-maturity.html'
      - 'public/admin.html'
      - 'scripts/test-admin-tlp-maturity-ui.cjs'
      - '.github/workflows/v5-tlp-admin-ui.yml'
  push:
    branches: [main]
    paths:
      - 'public/admin-tlp-maturity.html'
      - 'public/admin.html'
      - 'scripts/test-admin-tlp-maturity-ui.cjs'
      - '.github/workflows/v5-tlp-admin-ui.yml'
permissions:
  contents: read
jobs:
  tlp-maturity-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser test syntax
        run: node --check scripts/test-admin-tlp-maturity-ui.cjs
      - name: Verify TL_P maturity admin controls and default-off response
        run: node scripts/test-admin-tlp-maturity-ui.cjs
