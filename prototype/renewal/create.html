<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TimeLink | 자산 등록 시제품</title>
<style>
:root{color-scheme:dark;--bg:#07111f;--panel:#0d1b2a;--raised:#13263a;--line:#24384d;--text:#f3f7fc;--muted:#a9b8c8;--blue:#2f8fff;--cyan:#55d6e8;--violet:#a78bfa;--amber:#f4b44b;--teal:#36c7b2}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 70% -10%,#15304a 0,transparent 42%),var(--bg);color:var(--text);font:15px/1.55 Inter,system-ui,-apple-system,"Noto Sans KR",sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer}.shell{max-width:1180px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:4px 0 20px}.brand{font-weight:800;letter-spacing:.08em}.brand span{color:var(--cyan)}.tag{font-size:12px;color:#ffd68a;border:1px solid #765b2c;border-radius:30px;padding:5px 10px}
.hero{padding:32px 0 22px}.eyebrow{color:var(--cyan);font-size:12px;font-weight:700;letter-spacing:.14em}.hero h1{font-size:clamp(26px,4vw,38px);margin:8px 0}.hero p{color:var(--muted);margin:0;max-width:760px}
.layout{display:grid;grid-template-columns:245px minmax(0,1fr);gap:22px;align-items:start}.steps,.work{background:rgba(13,27,42,.94);border:1px solid var(--line);border-radius:18px}.steps{padding:14px;position:sticky;top:16px}.step{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:transparent;color:var(--muted);border:0;border-radius:12px;padding:13px 10px;margin:2px 0}.step.active{background:#17304a;color:white}.step.done .num{background:#1d705e;color:#d8fff3}.num{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#203247;color:#c2d1df;font-size:12px;flex:none}.step small{display:block;font-size:11px;color:var(--muted)}.work{padding:clamp(18px,3vw,30px);min-height:600px}.work h2{font-size:23px;margin:0 0 6px}.sub{color:var(--muted);margin:0 0 24px}.family-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.family{background:var(--raised);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:left;color:var(--text);min-height:150px}.family.selected{outline:2px solid var(--accent);border-color:var(--accent)}.family .symbol{font-size:24px;margin-bottom:12px}.family strong{display:block}.family small{color:var(--muted)}.f3{--accent:var(--blue)}.f4{--accent:var(--violet)}.fd{--accent:var(--amber)}.fj{--accent:var(--teal)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:13px;color:#d4dfeb}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:10px;background:#091624;color:var(--text);padding:12px;outline:none}.field textarea{min-height:100px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--blue)}.drop{border:1px dashed #47627d;border-radius:14px;padding:30px;text-align:center;background:#0a1928}.drop strong{display:block;margin-bottom:5px}.drop p{color:var(--muted);font-size:13px;margin:0}.drop input{margin-top:14px;max-width:100%}.note{border:1px solid #5e4b2a;background:#241e13;color:#f4d9a3;padding:13px 15px;border-radius:12px;font-size:13px;margin-top:18px}.choice{display:flex;gap:10px;align-items:flex-start;background:var(--raised);border:1px solid var(--line);padding:14px;border-radius:12px;margin:10px 0}.choice input{margin-top:5px;accent-color:var(--blue)}.choice span{display:block;color:var(--muted);font-size:13px}.actions{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);margin-top:28px;padding-top:20px}.btn{border:1px solid var(--line);border-radius:10px;padding:11px 18px;background:#172b40;color:var(--text);font-weight:650}.btn.primary{background:var(--blue);border-color:var(--blue);color:white}.btn:disabled{opacity:.35;cursor:not-allowed}.preview{background:#091624;border:1px solid var(--line);border-radius:14px;padding:18px}.preview .cover{width:100%;aspect-ratio:16/7;background:linear-gradient(120deg,#1b3a58,#13263a);border-radius:10px;display:grid;place-items:center;font-size:42px;margin-bottom:16px}.muted{color:var(--muted)}.pill{display:inline-block;border:1px solid var(--line);border-radius:30px;padding:4px 9px;color:var(--muted);font-size:12px;margin-right:5px}.success{font-size:42px;color:#5fe0b5}.footer{color:#708399;font-size:12px;text-align:center;padding:24px}
@media(max-width:800px){.layout{grid-template-columns:1fr}.steps{position:static;display:flex;overflow:auto;padding:8px}.step{min-width:125px;flex-direction:column;align-items:flex-start;gap:5px}.step small{display:none}.family-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.shell{padding:16px}.fields{grid-template-columns:1fr}.field.full{grid-column:auto}.work{min-height:0}.family{min-height:130px;padding:12px}.hero{padding:24px 0 18px}}
</style>
</head>
<body>
<div class="shell">
<header class="top"><div class="brand">TIME<span>LINK</span></div><div class="tag">DESIGN PREVIEW · NON-PRODUCTION</div></header>
<section class="hero"><div class="eyebrow">CREATOR WORKSPACE / ASSET REGISTRATION</div><h1>당신의 창작물을 TimeLink 자산으로</h1><p>오디오·비디오·문서·이미지를 하나의 공통 흐름으로 등록합니다. 자산 종류에 따라 검증과 미리보기는 달라지지만, 권리와 보관 및 출시 과정은 일관되게 관리합니다.</p></section>
<div class="layout">
<nav class="steps" aria-label="등록 단계">
<button class="step active" data-step="0"><span class="num">1</span><span>자산 종류<small>Family</small></span></button>
<button class="step" data-step="1"><span class="num">2</span><span>파일 선택<small>Source file</small></span></button>
<button class="step" data-step="2"><span class="num">3</span><span>정보·권리<small>Metadata & rights</small></span></button>
<button class="step" data-step="3"><span class="num">4</span><span>보관·출시<small>Storage & release</small></span></button>
<button class="step" data-step="4"><span class="num">5</span><span>검토·등록<small>Review</small></span></button>
</nav>
<main class="work"><div id="panel"></div><div class="actions"><button class="btn" id="back">이전</button><button class="btn primary" id="next">다음 단계</button></div></main>
</div>
<div class="footer">이 페이지는 화면 흐름 검토용 정적 시제품입니다. 실제 파일 업로드·인증·결제·보호 암호화·SharePlace 등록·POC/TLC 처리를 수행하지 않습니다.</div>
</div>
<script>
const families=[
{id:'tl3',name:'TL3 오디오',desc:'음악 · 음성 · 사운드',icon:'♫',cls:'f3',formats:'오디오 파일'},
{id:'tl4',name:'TL4 비디오',desc:'영상 · 영화 · 비디오',icon:'▶',cls:'f4',formats:'비디오 파일'},
{id:'tld',name:'TLD 문서',desc:'PDF · 전자책 · 문서',icon:'▤',cls:'fd',formats:'문서 파일'},
{id:'tlj',name:'TLJ 이미지',desc:'사진 · 그림 · 시각 작품',icon:'▧',cls:'fj',formats:'이미지 파일'}
];
let current=0, family='tl3', fileName='선택된 파일 없음';
const data={title:'',description:'',creator:'',storage:'Local Agent (사용자 PC)',release:'private'};
const panel=document.getElementById('panel');
function familyObj(){return families.find(x=>x.id===family)}
function render(){
document.querySelectorAll('.step').forEach((b,i)=>{b.classList.toggle('active',i===current);b.classList.toggle('done',i<current);b.querySelector('.num').textContent=i<current?'✓':i+1});
document.getElementById('back').disabled=current===0;
document.getElementById('next').textContent=current===4?'시제품 완료':'다음 단계';
const f=familyObj();
if(current===0){panel.innerHTML='<h2>어떤 자산을 등록하시겠습니까?</h2><p class="sub">네 가지 자산 유형은 같은 중요도와 공통 등록 절차를 가집니다.</p><div class="family-grid">'+families.map(x=>'<button class="family '+x.cls+' '+(x.id===family?'selected':'')+'" data-family="'+x.id+'"><div class="symbol">'+x.icon+'</div><strong>'+x.name+'</strong><small>'+x.desc+'</small></button>').join('')+'</div><div class="note">자산 종류와 이용·판매 방식은 별개입니다. 먼저 파일의 유형을 선택하고, 출시 정책은 뒤 단계에서 결정합니다.</div>'}
if(current===1){panel.innerHTML='<h2>원본 파일 선택</h2><p class="sub">'+f.name+' · '+f.formats+'</p><div class="drop"><strong>파일을 선택하거나 이 영역으로 끌어오세요</strong><p>이 시제품은 파일 이름만 화면에 표시하며 실제 업로드나 서버 전송을 하지 않습니다.</p><input id="file" type="file" accept="*/*"></div><div class="note">실제 서비스에서는 파일 서명·MIME·확장자·크기 및 해당 자산의 기술 정보를 서버에서 검증해야 합니다. 허용 형식과 용량 한도는 실제 처리 인프라 확인 후 확정합니다.</div><p class="muted" id="filename">'+fileName+'</p>'}
if(current===2){let extra=family==='tl3'?'아티스트 · 작곡 · 작사 · 앨범':family==='tl4'?'감독 · 출연진 · 제작 정보':family==='tld'?'저자 · 출판사 · 판본 · 언어':'작가 · 촬영자 · 작품 설명 · 대체 텍스트';panel.innerHTML='<h2>작품 정보와 권리 선언</h2><p class="sub">공통 정보와 '+f.name+'에 맞는 상세 정보를 입력합니다.</p><div class="fields"><div class="field full"><label>작품 제목 *</label><input id="title" placeholder="작품의 제목" value="'+esc(data.title)+'"></div><div class="field"><label>창작자 / 권리자</label><input id="creator" placeholder="표시할 창작자" value="'+esc(data.creator)+'"></div><div class="field"><label>가족별 상세 정보</label><input placeholder="'+extra+'"></div><div class="field full"><label>작품 설명</label><textarea id="description" placeholder="작품에 관한 설명">'+esc(data.description)+'</textarea></div></div><div class="choice"><input type="checkbox" id="rights"><div><b>권리 보유 및 이용 허락 확인</b><span>본 작품을 등록하고 선택한 방식으로 제공할 권한이 있음을 확인합니다. 타인의 저작물·샘플·출연·이미지 등이 포함된 경우 필요한 허락을 확보했음을 확인합니다.</span></div></div><div class="note">체크박스는 권리 선언 접수일 뿐, 저작권 검증 완료를 의미하지 않습니다. 실제 서비스에서는 선언 버전·계정·시각과 증빙 검토 상태를 별도로 기록합니다.</div>'}
if(current===3){panel.innerHTML='<h2>보관 위치와 출시 방식</h2><p class="sub">현재 연결되어 사용 가능한 보관 수단과 서버가 지원하는 정책만 실제 서비스에 노출해야 합니다.</p><div class="field"><label>보관 위치 (시제품 선택)</label><select id="storage"><option>Local Agent (사용자 PC)</option><option>Google Drive</option><option>OneDrive</option><option>서버 저장소 (사용 가능 여부 확인 필요)</option></select></div><h3 style="font-size:16px;margin:24px 0 8px">출시·이용 방식</h3><label class="choice"><input type="radio" name="release" value="private" checked><div><b>비공개 보관</b><span>창작자만 관리하는 상태. 공개 등록을 진행하지 않습니다.</span></div></label><label class="choice"><input type="radio" name="release" value="free"><div><b>무료 공개</b><span>무료 공개가 해당 자산 유형에서 지원되는 경우에만 선택할 수 있습니다.</span></div></label><label class="choice"><input type="radio" name="release" value="paid"><div><b>유료 / 시간 기반 이용</b><span>과금 단위·가격·정산 정책이 확정되고 서버가 지원하는 경우에만 활성화합니다.</span></div></label><div class="note">TL3 외 가족의 과금 단위는 아직 별도 결정이 필요합니다. 이 시제품은 가격을 임의로 정하거나 실제 결제를 수행하지 않습니다. TL·TLC·POC의 기존 회계·채굴 규칙도 변경하지 않습니다.</div>'}
if(current===4){panel.innerHTML='<div class="success">✓</div><h2>등록 전 최종 검토</h2><p class="sub">아래는 입력한 내용을 요약한 시제품 화면입니다. 실제 등록은 실행되지 않습니다.</p><div class="preview"><div class="cover">'+f.icon+'</div><span class="pill">'+f.name+'</span><span class="pill">미리보기 데이터</span><h2 style="margin-top:14px">'+esc(data.title||'제목 미입력')+'</h2><p class="muted">'+esc(data.creator||'창작자 미입력')+'</p><p>'+esc(data.description||'작품 설명이 입력되지 않았습니다.')+'</p><hr style="border:0;border-top:1px solid var(--line);margin:16px 0"><p class="muted">파일: '+esc(fileName)+'</p><p class="muted">보관 위치: '+esc(data.storage)+'</p><p class="muted">출시 방식: '+({private:'비공개 보관',free:'무료 공개',paid:'유료 / 시간 기반 이용'}[data.release])+'</p></div><div class="note">실제 등록에서는 서버가 파일 검증, 권리 상태, 보호 컨테이너, 저장 객체, 자산 ID 및 SharePlace 게시 결과를 확인한 후 성공을 표시해야 합니다. 현재는 어떤 API도 호출하지 않습니다.</div>'}
document.getElementById('next').disabled=false;
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.addEventListener('click',e=>{const b=e.target.closest('[data-family]');if(b){family=b.dataset.family;render()}});
document.addEventListener('change',e=>{if(e.target.id==='file'){fileName=e.target.files?.[0]?.name||'선택된 파일 없음';const n=document.getElementById('filename');if(n)n.textContent=fileName}if(e.target.name==='release')data.release=e.target.value;if(e.target.id==='storage')data.storage=e.target.value});
document.getElementById('back').addEventListener('click',()=>{if(current>0){save();current--;render()}});
document.getElementById('next').addEventListener('click',()=>{if(current===2&&!document.getElementById('rights')?.checked){alert('권리 선언 확인을 체크해 주세요.');return}save();if(current<4){current++;render()}else{alert('시제품 확인이 끝났습니다. 실제 자산 등록은 수행하지 않았습니다.')}})
function save(){['title','creator','description'].forEach(id=>{const el=document.getElementById(id);if(el)data[id]=el.value});const st=document.getElementById('storage');if(st)data.storage=st.value;const rel=document.querySelector('input[name="release"]:checked');if(rel)data.release=rel.value}
render();
</script>
</body>
</html>
