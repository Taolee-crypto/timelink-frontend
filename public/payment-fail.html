<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>결제 실패 - TimeLink</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#08080F;color:#fff;font-family:'Noto Sans KR',sans-serif;
  min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
.card{background:#0D0D1A;border:1px solid rgba(248,113,133,.3);border-radius:20px;padding:40px;max-width:400px;width:100%}
.icon{font-size:56px;margin-bottom:16px}
.title{font-size:22px;font-weight:800;color:#F87185;margin-bottom:8px}
.sub{font-size:14px;color:rgba(255,255,255,.5);margin-bottom:24px;line-height:1.6}
.btn{padding:13px 28px;border-radius:10px;border:none;background:linear-gradient(135deg,#0071E3,#7C3AED);
  color:#fff;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="/apple-theme.css">
<link rel="stylesheet" href="/dropdown-fix.css"><!-- SELECT_FIX_V1 -->

<link rel="stylesheet" href="/apple-theme.css?v=global-20261015" data-tl-global-theme="2026.10">
<style>
:root{--accent:#8B5CF6;--accent-hover:#A78BFA;--card:#1A1A1A;--bd:rgba(255,255,255,.1);--t1:#F5F5F7;--t2:rgba(245,245,247,.65)}
body{background:radial-gradient(ellipse at 50% 0%,rgba(139,92,246,.1),transparent 65%),#0A0A0A;color:#F5F5F7;font-family:'Pretendard','Inter',sans-serif}
.card{background:#17171B;border-color:rgba(251,113,133,.28);padding:36px 28px}
.btn{background:linear-gradient(135deg,#9B75FA,#7042D8)}
@media(max-width:480px){body{padding:14px}.card{padding:28px 20px;border-radius:16px}.title{font-size:20px}.sub{font-size:13px}}
</style>
</head>
<body>
<div class="card">

  <div class="title">결제 실패</div>

  <a href="shareplace.html" class="btn">돌아가기</a>
</div>
<script>
var p = new URLSearchParams(location.search);
var code = p.get('code');
var msg  = p.get('message');
if(msg) document.getElementById('errMsg').textContent = decodeURIComponent(msg);
</script>
