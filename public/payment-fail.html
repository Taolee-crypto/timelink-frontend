<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Payment Failed — TimeLink</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#08080F;color:#fff;font-family:'DM Sans','Pretendard',sans-serif;
  min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
.card{background:#0D0D1A;border:1px solid rgba(248,113,133,.3);border-radius:20px;padding:40px;max-width:400px;width:100%}
.icon{font-size:56px;margin-bottom:16px}
.title{font-size:22px;font-weight:800;color:#F87185;margin-bottom:8px}
.sub{font-size:14px;color:rgba(255,255,255,.5);margin-bottom:24px;line-height:1.6}
.btn{padding:13px 28px;border-radius:10px;border:none;background:linear-gradient(135deg,#8B5CF6,#7C3AED);
  color:#fff;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="/apple-theme.css">
<link rel="stylesheet" href="/dropdown-fix.css"><!-- SELECT_FIX_V1 -->

<link rel="stylesheet" href="/apple-theme.css?v=global-20261014" data-tl-global-theme="2026.10">
<style id="timelink-global-payment">
:root{--bg:#09090d;--card:#14131b;--bd:rgba(255,255,255,.09);--purple:#9b7bff;--gold:#f5b84b;--text:#f5f4fa;--muted:#a4a2b2;--fn:'DM Sans','Pretendard',sans-serif;--display:'Manrope','Pretendard',sans-serif}
body{background:radial-gradient(ellipse 80% 60% at 50% -10%,rgba(139,108,240,.14),transparent 70%),var(--bg);color:var(--text);font-family:var(--fn)}
.card{background:linear-gradient(155deg,#17151f,#121118);border:1px solid var(--bd);border-radius:20px;box-shadow:0 24px 80px rgba(0,0,0,.35)}
.title{font-family:var(--display);letter-spacing:-.035em;color:var(--gold)}
.btn{background:linear-gradient(120deg,#c1aaff,#9270f4);color:#100d19}
</style>
</head>
<body>
<div class="card">
  <div class="icon">❌</div>
  <div class="title">Payment Failed</div>
  <div class="sub" id="errMsg">Your payment was cancelled or could not be completed.</div>
  <a href="shareplace.html" class="btn">Back to SharePlace</a>
</div>
<script>
var p = new URLSearchParams(location.search);
var code = p.get('code');
var msg  = p.get('message');
if(msg) document.getElementById('errMsg').textContent = decodeURIComponent(msg);
</script>
</body>
</html>
