<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><script src="/renewal/renewal.js?v=20261024r1"></script><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cafe World | TimeLink</title>
<link rel="stylesheet" href="/apple-theme.css?v=restore-apple-20261020">
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0a0a0e;color:#f5f5f7;font-family:Inter,Pretendard,"Noto Sans KR",sans-serif}
.world-wrap{max-width:1280px;margin:0 auto;padding:34px 34px 70px}.world-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:28px}.eyebrow{font-size:11px;letter-spacing:.18em;color:#a78bfa;font-weight:800}.world-head h1{font-size:34px;letter-spacing:-.04em;margin:9px 0}.world-head p{color:#9693a3;margin:0;line-height:1.6}.world-count{color:#f5c16c;font-size:13px;white-space:nowrap}
.world-head{position:relative;isolation:isolate;min-height:190px;padding:30px;border:1px solid #302a3b;border-radius:20px;overflow:hidden;background:linear-gradient(90deg,rgba(10,10,14,.96) 0%,rgba(10,10,14,.78) 48%,rgba(10,10,14,.28) 100%),url('https://images.unsplash.com/photo-1554118811-1e0d58224f24?auto=format&fit=crop&w=1800&q=85') center 48%/cover no-repeat;box-shadow:0 18px 48px rgba(0,0,0,.22)}.world-head>div{position:relative;z-index:1}.world-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}.cafe-card{border:1px solid #292632;background:#15141b;border-radius:16px;overflow:hidden;cursor:pointer;transition:.2s}.cafe-card:hover{transform:translateY(-3px);border-color:#7959c9}.cafe-cover{height:170px;background:linear-gradient(135deg,rgba(20,16,28,.22),rgba(10,10,14,.52)),url('https://images.unsplash.com/photo-1445116572660-236099ec97a0?auto=format&fit=crop&w=1000&q=82') center/cover no-repeat;display:grid;place-items:center;color:#a78bfa;font-size:42px;overflow:hidden}.cafe-cover img{width:100%;height:100%;object-fit:cover}.cafe-body{padding:17px}.cafe-name{font-size:17px;font-weight:800}.cafe-meta{font-size:12px;color:#aaa5b7;margin-top:7px}.cafe-desc{font-size:13px;color:#c2bfca;line-height:1.55;margin:12px 0;min-height:40px}.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{font-size:10px;padding:5px 8px;border-radius:20px;background:#242033;color:#c7b7ff}.empty,.error{padding:60px 20px;text-align:center;border:1px dashed #393444;border-radius:16px;color:#aaa5b7;grid-column:1/-1}.refresh{border:1px solid #494253;background:#191720;color:#eee;border-radius:9px;padding:10px 14px;cursor:pointer}
@media(max-width:700px){.world-wrap{padding:28px 16px}.world-head{align-items:start;flex-direction:column}.world-head h1{font-size:28px}}
.world-tools{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin:0 0 20px}.world-tools input,.world-tools select{width:100%;padding:13px 14px;border:1px solid #494253;border-radius:11px;background:#191720;color:#fff;font:inherit}.world-tools label{display:block;font-size:12px;color:#bcb6cb;margin-bottom:6px}.cafe-card{display:block;text-decoration:none;color:inherit}.world-info{color:#aaa5b7;margin-bottom:16px;font-size:13px}@media(max-width:700px){.world-tools{grid-template-columns:1fr}}</style>

<link rel="stylesheet" href="/renewal/renewal.css?v=20261024r1"></head>
<body>
<main class="world-wrap">
<header class="world-head"><div><div class="eyebrow">TIMELINK · COMMUNICATION</div><h1 data-en="Cafe World" data-ko="카페월드">카페월드</h1><p data-en="Discover cafes connected to TimeLink broadcast channels." data-ko="타임링크 방송 채널과 연결된 카페를 둘러보세요.">타임링크 방송 채널과 연결된 카페를 둘러보세요.</p></div><div><span class="world-count" id="count">—</span> <button class="refresh" onclick="loadWorld()" data-en="Refresh" data-ko="새로고침">새로고침</button></div></header>
<div class="world-tools"><div><label id="searchLabel" for="worldSearch">카페 검색</label><input id="worldSearch" type="search" placeholder="카페명 · 도시 · 주소" autocomplete="off"></div><div><label id="countryLabel" for="countryFilter">국가</label><select id="countryFilter"></select></div><div><label id="regionLabel" for="regionFilter">도시·지역</label><select id="regionFilter"></select></div></div><div id="worldInfo" class="world-info" aria-live="polite"></div><section id="grid" class="world-grid"><div class="empty" data-en="Loading Cafe World…" data-ko="카페월드를 불러오는 중입니다…">카페월드를 불러오는 중입니다…</div></section>
</main>
<script>
const API='https://api.timelink.digital';
const L={
ko:['카페 검색','카페명 · 도시 · 주소','국가','도시·지역','전체 국가','전체 지역','검색 결과','등록된 카페가 없습니다.','검색 조건에 맞는 카페가 없습니다.','채널','곡','새로고침','카페월드','전 세계 카페를 찾아보세요.'],
en:['Search cafes','Cafe, city or address','Country','City / Region','All countries','All regions','Results','No cafes yet.','No cafes match your search.','CHANNEL','TRACKS','Refresh','Cafe World','Discover cafes around the world.'],
ja:['カフェ検索','店名・都市・住所','国','都市・地域','すべての国','すべての地域','検索結果','カフェはまだありません。','該当するカフェがありません。','チャンネル','曲','更新','カフェワールド','世界中のカフェを探しましょう。'],
zh:['搜索咖啡馆','名称、城市或地址','国家','城市／地区','所有国家','所有地区','搜索结果','暂无咖啡馆。','没有符合条件的咖啡馆。','频道','曲目','刷新','咖啡世界','发现世界各地的咖啡馆。'],
th:['ค้นหาคาเฟ่','ชื่อ เมือง หรือที่อยู่','ประเทศ','เมือง / ภูมิภาค','ทุกประเทศ','ทุกพื้นที่','ผลการค้นหา','ยังไม่มีคาเฟ่','ไม่พบคาเฟ่ที่ตรงกัน','ช่อง','เพลง','รีเฟรช','โลกคาเฟ่','ค้นพบคาเฟ่ทั่วโลก'],
vi:['Tìm quán cà phê','Tên, thành phố hoặc địa chỉ','Quốc gia','Thành phố / Khu vực','Tất cả quốc gia','Tất cả khu vực','Kết quả','Chưa có quán cà phê.','Không tìm thấy quán phù hợp.','Kênh','Bài hát','Làm mới','Thế giới cà phê','Khám phá quán cà phê trên toàn thế giới.']};
const countryNames={KR:'대한민국',JP:'日本',US:'United States',CN:'中国',GB:'United Kingdom',TH:'ประเทศไทย',VN:'Việt Nam'};
let cafes=[],lang='ko',chosenCountry='',initialized=false;
const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function parse(v){try{const a=Array.isArray(v)?v:JSON.parse(v||'[]');return Array.isArray(a)?a:[];}catch{return [];}}
function language(v){const x=String(v||'').toLowerCase().split('-')[0];return L[x]?x:'en';}
function t(i){return L[lang][i];}
function region(c){return String(c.city||c.region||c.addr||'').split(/[,，]/)[0].trim();}
function localeCountry(){const saved=localStorage.getItem('tl_country');if(saved)return saved.toUpperCase();const locale=(navigator.language||'').split('-')[1];return (locale|| (lang==='ko'?'KR':lang==='ja'?'JP':lang==='zh'?'CN':lang==='th'?'TH':lang==='vi'?'VN':'')).toUpperCase();}
function applyLang(v){lang=language(v);document.documentElement.lang=lang;$('searchLabel').textContent=t(0);$('worldSearch').placeholder=t(1);$('countryLabel').textContent=t(2);$('regionLabel').textContent=t(3);document.querySelector('.world-head h1').textContent=t(12);document.querySelector('.world-head p').textContent=t(13);document.querySelector('.refresh').textContent=t(11);renderFilters();render();}
function renderFilters(){const cs=[...new Set(cafes.map(c=>String(c.country||'').toUpperCase()).filter(Boolean))].sort();const select=$('countryFilter');select.innerHTML='<option value="">'+esc(t(4))+'</option>'+cs.map(c=>'<option value="'+esc(c)+'">'+esc(countryNames[c]||c)+'</option>').join('');select.value=cs.includes(chosenCountry)?chosenCountry:'';const rs=[...new Set(cafes.filter(c=>!chosenCountry||String(c.country||'').toUpperCase()===chosenCountry).map(region).filter(Boolean))].sort((a,b)=>a.localeCompare(b));const prior=$('regionFilter').value;$('regionFilter').innerHTML='<option value="">'+esc(t(5))+'</option>'+rs.map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('');$('regionFilter').value=rs.includes(prior)?prior:'';}
function render(){const q=$('worldSearch').value.trim().toLocaleLowerCase(),reg=$('regionFilter').value;const filtered=cafes.filter(c=>(!chosenCountry||String(c.country||'').toUpperCase()===chosenCountry)&&(!reg||region(c)===reg)&&(!q||[c.name,c.addr,c.description,c.country,region(c)].some(x=>String(x||'').toLocaleLowerCase().includes(q))));$('count').textContent=cafes.length+' '+t(9);$('worldInfo').textContent=t(6)+': '+filtered.length+' / '+cafes.length;const grid=$('grid');if(!filtered.length){grid.innerHTML='<div class="empty">'+esc(cafes.length?t(8):t(7))+'</div>';return;}grid.innerHTML=filtered.map(c=>{const cover=parse(c.images)[0]||'',songs=parse(c.playlist).length;const href='/cafe-detail.html?id='+encodeURIComponent(c.channel_id);return '<a class="cafe-card" href="'+esc(href)+'"><div class="cafe-cover">'+(cover?'<img loading="lazy" src="'+esc(cover)+'" alt="'+esc(c.name)+'">':'<img loading="lazy" src="/images/renewal/cafe-interior-card.jpg" alt="카페 이미지 미등록 대표 사진"><small class="tl-cover-note">대표 이미지</small>')+'</div><div class="cafe-body"><div class="cafe-name">'+esc(c.name)+'</div><div class="cafe-meta">'+esc(countryNames[c.country]||c.country||'')+(c.addr?' · '+esc(c.addr):'')+'</div><p class="cafe-desc">'+esc(c.description||'TimeLink Cafe Channel')+'</p><div class="tags"><span class="tag">'+esc(t(9))+'</span><span class="tag">'+songs+' '+esc(t(10))+'</span></div></div></a>';}).join('');}
async function loadWorld(){const grid=$('grid');grid.innerHTML='<div class="empty">Loading…</div>';try{const r=await fetch(API+'/api/cafe/channels',{cache:'no-store'}),d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'Unable to load channels');cafes=d.channels||[];if(!initialized){const initial=localeCountry();chosenCountry=cafes.some(c=>String(c.country||'').toUpperCase()===initial)?initial:'';initialized=true;}renderFilters();render();}catch(e){grid.innerHTML='<div class="error">'+esc(e.message)+'</div>';}}
$('worldSearch').addEventListener('input',render);$('countryFilter').addEventListener('change',()=>{chosenCountry=$('countryFilter').value;$('regionFilter').value='';renderFilters();render();});$('regionFilter').addEventListener('change',render);
window.addEventListener('tl-language-changed',e=>applyLang(e.detail?.lang||localStorage.getItem('tl_lang')));
applyLang(localStorage.getItem('tl_lang')||navigator.language);loadWorld();
</script>
