<!doctype html>
<html lang="ko">
<head>

<title>Store World | TimeLink</title>
<link rel="stylesheet" href="/apple-theme.css?v=restore-apple-20261020">
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0a0a0e;color:#f5f5f7;font-family:Inter,Pretendard,"Noto Sans KR",sans-serif}
.world-wrap{max-width:1280px;margin:0 auto;padding:34px 34px 70px}.world-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:28px}.eyebrow{font-size:11px;letter-spacing:.18em;color:#a78bfa;font-weight:800}.world-head h1{font-size:34px;letter-spacing:-.04em;margin:9px 0}.world-head p{color:#9693a3;margin:0;line-height:1.6}.world-count{color:#f5c16c;font-size:13px;white-space:nowrap}
.world-head{position:relative;isolation:isolate;min-height:190px;padding:30px;border:1px solid #302a3b;border-radius:20px;overflow:hidden;background:linear-gradient(90deg,rgba(10,10,14,.96) 0%,rgba(10,10,14,.78) 48%,rgba(10,10,14,.28) 100%),url('/images/renewal/cafe-interior.jpg') center 48%/cover no-repeat;box-shadow:0 18px 48px rgba(0,0,0,.22)}.world-head>div{position:relative;z-index:1}.world-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}.cafe-card{border:1px solid #292632;background:#15141b;border-radius:16px;overflow:hidden;cursor:pointer;transition:.2s}.cafe-card:hover{transform:translateY(-3px);border-color:#7959c9}.cafe-cover{height:170px;background:linear-gradient(135deg,rgba(20,16,28,.22),rgba(10,10,14,.52)),url('https://images.unsplash.com/photo-1445116572660-236099ec97a0?auto=format&fit=crop&w=1000&q=82') center/cover no-repeat;display:grid;place-items:center;color:#a78bfa;font-size:42px;overflow:hidden}.cafe-cover img{width:100%;height:100%;object-fit:cover}.cafe-body{padding:17px}.cafe-name{font-size:17px;font-weight:800}.cafe-meta{font-size:12px;color:#aaa5b7;margin-top:7px}.cafe-desc{font-size:13px;color:#c2bfca;line-height:1.55;margin:12px 0;min-height:40px}.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{font-size:10px;padding:5px 8px;border-radius:20px;background:#242033;color:#c7b7ff}.empty,.error{padding:60px 20px;text-align:center;border:1px dashed #393444;border-radius:16px;color:#aaa5b7;grid-column:1/-1}.refresh{border:1px solid #494253;background:#191720;color:#eee;border-radius:9px;padding:10px 14px;cursor:pointer}
@media(max-width:700px){.world-wrap{padding:28px 16px}.world-head{align-items:start;flex-direction:column}.world-head h1{font-size:28px}}
.world-tools{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin:0 0 20px}.world-tools input,.world-tools select{width:100%;padding:13px 14px;border:1px solid #494253;border-radius:11px;background:#191720;color:#fff;font:inherit}.world-tools label{display:block;font-size:12px;color:#bcb6cb;margin-bottom:6px}.cafe-card{display:block;text-decoration:none;color:inherit}.world-info{color:#aaa5b7;margin-bottom:16px;font-size:13px}@media(max-width:700px){.world-tools{grid-template-columns:1fr}}.world-more{text-align:center;margin-top:24px}.world-more button{padding:12px 25px}
</style>

<body class="activity-page">
<main class="world-wrap">
<header class="world-head"><div><div class="eyebrow">TILO · STORE WORLD</div><h1 data-en="Store World" data-ko="스토어월드">스토어월드</h1><p data-en="Discover stores connected to TimeLink broadcast channels." data-ko="음악이 흐르는 상점, 그 공간의 이야기를 만나보세요.">음악이 흐르는 상점, 그 공간의 이야기를 만나보세요.</p></div><div><span class="world-count" id="count">—</span> <button class="refresh" onclick="loadWorld()" data-en="Refresh" data-ko="새로고침">새로고침</button></div></header><nav class="world-actions" aria-label="스토어월드 바로가기"><a href="/my-cafe.html">나의 카페</a><a href="/tilo-store-plans.html?source=store-world">매장 방송 이용권</a></nav>
<div class="world-tools"><div><label id="searchLabel" for="worldSearch">스토어 검색</label><input id="worldSearch" type="search" placeholder="스토어명 · 도시 · 주소" autocomplete="off"></div><div><label id="countryLabel" for="countryFilter">국가</label><select id="countryFilter"></select></div><div><label id="regionLabel" for="regionFilter">도시·지역</label><select id="regionFilter"></select></div></div><div id="worldInfo" class="world-info" aria-live="polite"></div><section id="grid" class="world-grid"><div class="empty" data-en="Loading Store World…" data-ko="스토어월드를 불러오는 중입니다…">스토어월드를 불러오는 중입니다…</div></section><div class="world-more"><button id="worldLoadMore" class="refresh" type="button" hidden>상점 더 보기</button></div>
</main>
<script>
const API='https://api.timelink.digital';
const L={
 ko:['스토어 검색','스토어명 · 도시 · 주소','국가','도시·지역','전체 국가','전체 지역','검색 결과','등록된 스토어가 없습니다.','검색 조건에 맞는 스토어가 없습니다.','채널','곡','새로고침','스토어월드','음악이 흐르는 상점, 그 공간의 이야기를 만나보세요.','상점 더 보기'],
 en:['Search stores','Store, city or address','Country','City / Region','All countries','All regions','Results','No stores yet.','No stores match your search.','CHANNEL','TRACKS','Refresh','Store World','Discover stores around the world.','Load more'],
 ja:['店舗検索','店名・都市・住所','国','都市・地域','すべての国','すべての地域','検索結果','店舗はまだありません。','該当する店舗がありません。','チャンネル','曲','更新','店舗ワールド','世界中の店舗を探しましょう。','さらに表示'],
 zh:['搜索商店','名称、城市或地址','国家','城市／地区','所有国家','所有地区','搜索结果','暂无商店。','没有符合条件的商店。','频道','曲目','刷新','咖啡世界','发现世界各地的商店。','加载更多'],
 th:['ค้นหาร้านค้า','ชื่อ เมือง หรือที่อยู่','ประเทศ','เมือง / ภูมิภาค','ทุกประเทศ','ทุกพื้นที่','ผลการค้นหา','ยังไม่มีร้านค้า','ไม่พบร้านค้าที่ตรงกัน','ช่อง','เพลง','รีเฟรช','โลกร้านค้า','ค้นพบร้านค้าทั่วโลก','ดูร้านเพิ่มเติม'],
 vi:['Tìm cửa hàng','Tên, thành phố hoặc địa chỉ','Quốc gia','Thành phố / Khu vực','Tất cả quốc gia','Tất cả khu vực','Kết quả','Chưa có cửa hàng.','Không tìm thấy quán phù hợp.','Kênh','Bài hát','Làm mới','Thế giới cà phê','Khám phá cửa hàng trên toàn thế giới.','Xem thêm']};
const countryNames={KR:'대한민국',JP:'日本',US:'United States',CN:'中国',GB:'United Kingdom',TH:'ประเทศไทย',VN:'Việt Nam'};
let stores=[],lang='ko',chosenCountry='',nextPage=1,total=0,hasMore=false,loadSeq=0,loading=false;
const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function parse(v){try{const a=Array.isArray(v)?v:JSON.parse(v||'[]');return Array.isArray(a)?a:[];}catch{return [];}}
function safePhoto(v){const s=String(v||'');if(/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(s))return s;try{const u=new URL(s,location.origin);if(u.protocol==='https:'||u.origin===location.origin)return u.href;}catch{}return '';}
function readProfile(value){try{const v=typeof value==='string'?JSON.parse(value||'{}'):value||{};return v&&typeof v==='object'&&!Array.isArray(v)?v:{};}catch{return {}}}
function language(v){const x=String(v||'').toLowerCase().split('-')[0];return L[x]?x:'en';}
function t(i){return L[lang][i];}
function region(c){return String(c.city||c.region||c.addr||'').split(/[,，]/)[0].trim();}
function applyLang(v){lang=language(v);document.documentElement.lang=lang;$('searchLabel').textContent=t(0);$('worldSearch').placeholder=t(1);$('countryLabel').textContent=t(2);$('regionLabel').textContent=t(3);document.querySelector('.world-head h1').textContent=t(12);document.querySelector('.world-head p').textContent=t(13);document.querySelector('.refresh').textContent=t(11);$('worldLoadMore').textContent=t(14);renderFilters();render();}
function renderFilters(){
 const countries=$('countryFilter'),prior=countries.value;
 const cs=[...new Set([...Object.keys(countryNames),...stores.map(c=>String(c.country||'').toUpperCase())])].filter(Boolean).sort();
 countries.innerHTML='<option value="">'+esc(t(4))+'</option>'+cs.map(c=>'<option value="'+esc(c)+'">'+esc(countryNames[c]||c)+'</option>').join('');
 countries.value=chosenCountry;
 const rs=[...new Set(stores.map(region).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
 const selected=$('regionFilter').value;$('regionFilter').innerHTML='<option value="">'+esc(t(5))+'</option>'+rs.map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('');
 $('regionFilter').value=rs.includes(selected)?selected:'';
}
function render(){
 const reg=$('regionFilter').value;
 const filtered=stores.filter(c=>!reg||region(c)===reg);
 $('count').textContent=total+' '+t(9);
 $('worldInfo').textContent=t(6)+': '+total+' · '+stores.length+'개 불러옴'+(reg?' · 선택 지역 '+filtered.length+'곳':'');
 const grid=$('grid');
 if(!filtered.length){grid.innerHTML='<div class="empty">'+esc(total?t(8):t(7))+'</div>';}
 else grid.innerHTML=filtered.map(c=>{
  const profile=readProfile(c.profile_json);
  const cover=safePhoto(parse(c.images)[0]||'');
  const href='/cafe-detail.html?id='+encodeURIComponent(c.channel_id);
  const tagline=typeof profile.tagline==='string'?profile.tagline.trim():'';
  const highlights=(Array.isArray(profile.amenities)?profile.amenities:[]).slice(0,3);
  const labels={wifi:'Wi-Fi',parking:'주차',pets:'반려동물',takeout:'포장',terrace:'테라스',outlets:'콘센트',accessible:'접근성',delivery:'배달'};
  return '<a class="cafe-card" href="'+esc(href)+'"><div class="cafe-cover">'+(cover?'<img loading="lazy" src="'+esc(cover)+'" alt="'+esc(c.name)+'">':'<img loading="lazy" src="/images/renewal/cafe-interior-card.jpg" alt="대표 사진 미등록">')+'</div><div class="cafe-body"><div class="cafe-name">'+esc(c.name)+'</div><div class="cafe-meta">'+esc(countryNames[c.country]||c.country||'')+(c.addr?' · '+esc(c.addr):'')+'</div><p class="cafe-desc">'+esc(tagline||c.description||'매장을 소개합니다.')+'</p><div class="tags"><span class="tag">개별 상점</span>'+highlights.filter(x=>labels[x]).map(x=>'<span class="tag">'+esc(labels[x])+'</span>').join('')+'</div></div></a>';
 }).join('');
 $('worldLoadMore').hidden=!hasMore;$('worldLoadMore').disabled=loading;
}
async function loadWorld(reset=true){
 if(!reset&&(!hasMore||loading))return;
 const sequence=++loadSeq;
 if(reset){stores=[];nextPage=1;hasMore=false;total=0;}
 loading=true;
 const grid=$('grid');
 if(reset)grid.innerHTML='<div class="empty">Loading…</div>';
 $('worldLoadMore').disabled=true;
 try{
  const q=new URLSearchParams({kind:'all',page:String(nextPage),q:$('worldSearch').value.trim(),country:chosenCountry});
  const r=await fetch(API+'/api/sales/world?'+q,{cache:'no-store'}),d=await r.json();
  if(sequence!==loadSeq)return;
  if(!r.ok||!d.ok||!Array.isArray(d.channels))throw Error(d.error||'Unable to load stores');
  const seen=new Set(stores.map(x=>x.channel_id));
  for(const c of d.channels){if(c&&c.channel_id&&!seen.has(c.channel_id)){stores.push(c);seen.add(c.channel_id);}}
  total=Number(d.total||0);nextPage=Number(d.page||1)+1;hasMore=d.has_more===true;
  renderFilters();render();
 }catch(error){if(sequence===loadSeq){grid.innerHTML='<div class="error">'+esc(error.message)+'</div>';$('worldInfo').textContent='서버 연결을 확인해주세요.'}}
 finally{if(sequence===loadSeq){loading=false;$('worldLoadMore').disabled=false;}}
}
let searchTimer;
$('worldSearch').addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>loadWorld(true),280)});
$('countryFilter').addEventListener('change',()=>{chosenCountry=$('countryFilter').value;$('regionFilter').value='';loadWorld(true);});
$('regionFilter').addEventListener('change',render);
$('worldLoadMore').addEventListener('click',()=>loadWorld(false));
window.addEventListener('tl-language-changed',e=>applyLang(e.detail?.lang||localStorage.getItem('tl_lang')));
applyLang(localStorage.getItem('tl_lang')||navigator.language);loadWorld();
</script>
