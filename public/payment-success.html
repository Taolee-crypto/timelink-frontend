<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><script src="/renewal/renewal.js?v=20261024r2"></script>
<title>결제 완료 - TimeLink</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#08080F;color:#fff;font-family:'Noto Sans KR',sans-serif;
  min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
.card{background:#0D0D1A;border:1px solid rgba(100,210,255,.3);border-radius:20px;padding:40px;max-width:400px;width:100%}
.icon{font-size:56px;margin-bottom:16px}
.title{font-size:22px;font-weight:800;color:#64D2FF;margin-bottom:8px}
.sub{font-size:14px;color:rgba(255,255,255,.5);margin-bottom:24px;line-height:1.6}
.btn{padding:13px 28px;border-radius:10px;border:none;background:linear-gradient(135deg,#0071E3,#7C3AED);
  color:#fff;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="/apple-theme.css">
<link rel="stylesheet" href="/dropdown-fix.css"><!-- SELECT_FIX_V1 -->

<link rel="stylesheet" href="/apple-theme.css?v=restore-apple-20261020" data-tl-global-theme="2026.10-apple">
<style>
:root{--accent:#8B5CF6;--accent-hover:#A78BFA;--card:#1A1A1A;--bd:rgba(255,255,255,.1);--t1:#F5F5F7;--t2:rgba(245,245,247,.65)}
body{background:radial-gradient(ellipse at 50% 0%,rgba(139,92,246,.13),transparent 65%),#0A0A0A;color:#F5F5F7;font-family:'Pretendard','Inter',sans-serif}
.card{background:#17171B;border-color:rgba(139,92,246,.3);padding:36px 28px}
.title{color:#C4B5FD}.btn{background:linear-gradient(135deg,#9B75FA,#7042D8)}
@media(max-width:480px){body{padding:14px}.card{padding:28px 20px;border-radius:16px}.title{font-size:20px}.sub{font-size:13px}}
</style>
  <link rel="stylesheet" href="/wallet-design-system.css?v=20261020">
<link rel="stylesheet" href="/renewal/renewal.css?v=20261024r2"></head>
<body>
<div class="card">
  <div class="icon" id="icon">⏳</div>
  <div class="title" id="title">결제 처리 중...</div>
  <div class="sub" id="msg">잠시만 기다려주세요</div>
  <a href="shareplace.html" class="btn" id="homeBtn" style="display:none">SharePlace로 이동</a>
</div>
<script>
var API = 'https://api.timelink.digital';
var p = new URLSearchParams(location.search);
var paymentKey = p.get('paymentKey');
var orderId    = p.get('orderId');
var amount     = p.get('amount');

function setUI(icon, title, msg, showBtn){
  document.getElementById('icon').textContent  = icon;
  document.getElementById('title').textContent = title;
  document.getElementById('msg').textContent   = msg;
  if(showBtn) document.getElementById('homeBtn').style.display = 'inline-block';
}

async function confirmPayment(){
  if(!paymentKey || !orderId || !amount){
    setUI('❌','파라미터 오류','결제 정보가 없습니다.',true);
    return;
  }

  var token = localStorage.getItem('tl_token') || '';
  if(!token){
    // 토큰 없으면 shareplace로 파라미터 전달
    location.href = (orderId && orderId.startsWith('v5promo_') ? 'dashboard.html' : 'shareplace.html') + '?paymentKey=' + encodeURIComponent(paymentKey)
      + '&orderId=' + encodeURIComponent(orderId)
      + '&amount=' + encodeURIComponent(amount);
    return;
  }

  try {
    var r = await fetch(API + (orderId.startsWith('v5promo_') ? '/api/payment/v5/premium/toss/confirm' : '/api/payment/toss/confirm'), {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + token
      },
      body: JSON.stringify({
        paymentKey: paymentKey,
        orderId:    orderId,
        amount:     parseInt(amount)
      })
    });
    var d = await r.json();

    if(!r.ok){
      setUI('❌','결제 처리 실패', d.error || '오류가 발생했습니다.', true);
      return;
    }

    if(orderId.startsWith('v5promo_')){setUI('🎉','홍보 결제 완료','토스 테스트 결제 승인 완료 · 홍보 편성 대기 · 주문번호 '+orderId,true);document.getElementById('homeBtn').href='dashboard.html';document.getElementById('homeBtn').textContent='대시보드로 이동';return;}
    // 성공 - localStorage 잔액 업데이트
    try {
      var user = JSON.parse(localStorage.getItem('tl_user') || '{}');
      user.tl   = d.tl_balance;
      user.tl_p = d.tl_p;
      localStorage.setItem('tl_user', JSON.stringify(user));
    } catch(e){}

    var paidTL = Number(d.total_tl || 0) - Number(d.bonus_tl || 0);
    var msg = 'TL_P +' + paidTL.toLocaleString('ko-KR') + ' TL (유료 충전분)';
    if(Number(d.bonus_tl)>0) msg += ' · TL_B +' + Number(d.bonus_tl).toLocaleString('ko-KR') + ' TL (보너스)';
    msg += ' · 전체 잔액 ' + Number(d.tl_balance||0).toLocaleString('ko-KR') + ' TL';
    setUI('🎉', '결제 완료!', msg, false);

    // 3초 후 자동 이동
    setTimeout(function(){ location.href = 'shareplace.html'; }, 3000);

  } catch(e) {
    setUI('❌','네트워크 오류', e.message, true);
  }
}

confirmPayment();
</script>
  <script src="/sidebar.js?v=restore-apple-20261020"></script>
  <script src="/i18n.js?v=20261015"></script>
<script src="/_shared/footer.js" defer></script>
</body>
</html>
