<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Payment Complete — TimeLink</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#08080F;color:#fff;font-family:'DM Sans','Pretendard',sans-serif;
  min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
.card{background:#0D0D1A;border:1px solid rgba(245,166,35,.3);border-radius:20px;padding:40px;max-width:400px;width:100%}
.icon{font-size:56px;margin-bottom:16px}
.title{font-size:22px;font-weight:800;color:#F5A623;margin-bottom:8px}
.sub{font-size:14px;color:rgba(255,255,255,.5);margin-bottom:24px;line-height:1.6}
.btn{padding:13px 28px;border-radius:10px;border:none;background:linear-gradient(135deg,#8B5CF6,#7C3AED);
  color:#fff;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="/apple-theme.css">
<link rel="stylesheet" href="/dropdown-fix.css"><!-- SELECT_FIX_V1 -->

<link rel="stylesheet" href="/apple-theme.css?v=global-20261014" data-tl-global-theme="2026.10">
<style id="timelink-global-payment">
:root{--bg:#09090d;--card:#14131b;--bd:rgba(255,255,255,.09);--purple:#9b7bff;--gold:#f5b84b;--text:#f5f4fa;--muted:#a4a2b2;--fn:'DM Sans','Pretendard',sans-serif;--display:'Manrope','Pretendard',sans-serif}
body{background:radial-gradient(ellipse 80% 60% at 50% -10%,rgba(139,108,240,.14),transparent 70%),var(--bg);color:var(--text);font-family:var(--fn)}
.card{background:linear-gradient(155deg,#17151f,#121118);border:1px solid var(--bd);border-radius:20px;box-shadow:0 24px 80px rgba(0,0,0,.35)}
.title{font-family:var(--display);letter-spacing:-.035em;color:var(--gold)}
.btn{background:linear-gradient(120deg,#c1aaff,#9270f4);color:#100d19}
</style>
</head>
<body>
<div class="card">
  <div class="icon" id="icon">⏳</div>
  <div class="title" id="title">Processing payment…</div>
  <div class="sub" id="msg">Please wait while we confirm your payment.</div>
  <a href="shareplace.html" class="btn" id="homeBtn" style="display:none">Go to SharePlace</a>
</div>
<script>
var API = 'https://api.timelink.digital';
var p = new URLSearchParams(location.search);
var paymentKey = p.get('paymentKey');
var orderId    = p.get('orderId');
var amount     = p.get('amount');

function setUI(icon, title, msg, showBtn){
  document.getElementById('icon').textContent  = icon;
  document.getElementById('title').textContent = title;
  document.getElementById('msg').textContent   = msg;
  if(showBtn) document.getElementById('homeBtn').style.display = 'inline-block';
}

async function confirmPayment(){
  if(!paymentKey || !orderId || !amount){
    setUI('❌','Invalid payment details','Payment information is missing.',true);
    return;
  }

  var token = localStorage.getItem('tl_token') || '';
  if(!token){
    // 토큰 없으면 shareplace로 파라미터 전달
    location.href = 'shareplace.html?paymentKey=' + encodeURIComponent(paymentKey)
      + '&orderId=' + encodeURIComponent(orderId)
      + '&amount=' + encodeURIComponent(amount);
    return;
  }

  try {
    var r = await fetch(API + '/api/payment/toss/confirm', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + token
      },
      body: JSON.stringify({
        paymentKey: paymentKey,
        orderId:    orderId,
        amount:     parseInt(amount)
      })
    });
    var d = await r.json();

    if(!r.ok){
      setUI('❌','Payment could not be completed', d.error || 'An error occurred.', true);
      return;
    }

    // 성공 - localStorage 잔액 업데이트
    try {
      var user = JSON.parse(localStorage.getItem('tl_user') || '{}');
      user.tl   = d.tl_balance;
      user.tl_p = d.tl_p;
      localStorage.setItem('tl_user', JSON.stringify(user));
    } catch(e){}

    var msg = '+' + d.total_tl.toLocaleString() + ' TL added successfully';
    if(d.bonus_tl > 0) msg += ' (including a bonus of +' + d.bonus_tl.toLocaleString() + ' TL)';
    setUI('🎉', 'Payment Complete!', msg, false);

    // 3초 후 자동 이동
    setTimeout(function(){ location.href = 'shareplace.html'; }, 3000);

  } catch(e) {
    setUI('❌','Network Error', e.message, true);
  }
}

confirmPayment();
</script>
</body>
</html>
