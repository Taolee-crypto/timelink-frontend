<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>차량 채널 | TimeLink</title><link rel="stylesheet" href="/apple-theme.css"><link rel="stylesheet" href="/wallet-design-system.css"><style>main{max-width:960px;margin:32px auto;padding:20px}section{margin-top:20px;padding:24px;border:1px solid #45404d;border-radius:16px}#photo{width:100%;max-height:480px;object-fit:cover;border-radius:16px}label{display:block;margin:14px 0}input,textarea,select{display:block;width:100%;padding:12px;margin:6px 0}button{padding:10px 16px;cursor:pointer}#description{white-space:pre-wrap}</style></head><body><main><a href="/my-car-world.html">← 마이카월드</a><p id="status" role="status">차량 정보를 불러오는 중입니다…</p><section id="vehicle" hidden><img id="photo" alt="등록된 차량 사진" hidden><h1 id="name"></h1><p id="meta"></p><p id="description"></p><h2>차량 매매 정보</h2><p id="sale"></p><p id="contact"></p><a href="/radio.html">인카 라디오 듣기</a></section><section id="owner" hidden><h2>내 차량 사진·매매 정보 관리</h2><p>판매 정보와 연락 방법은 이 페이지 방문자에게 공개됩니다.</p><label>차량 사진 (JPG·PNG·WebP, 최대 4MB)<input id="photoInput" type="file" accept="image/jpeg,image/png,image/webp"></label><button id="upload" type="button">사진 저장</button><form id="listingForm"><label>판매 상태<select id="saleStatus"><option value="none">판매하지 않음</option><option value="sale">판매 중</option><option value="sold">판매 완료</option></select></label><label>가격<input id="price" type="number" min="0" step="1" required></label><label>통화<select id="currency"><option>KRW</option><option>USD</option><option>JPY</option><option>CNY</option><option>THB</option><option>VND</option></select></label><label>연식<input id="year" type="number" min="1950" required></label><label>주행거리(km)<input id="mileage" type="number" min="0" step="1" required></label><label>차량 설명<textarea id="saleDescription" maxlength="3000"></textarea></label><label>공개 연락 방법<input id="saleContact" maxlength="200"></label><button>판매 정보 저장</button></form></section></main><script>
const API='https://api.timelink.digital',id=new URLSearchParams(location.search).get('id'),$=n=>document.getElementById(n),base=API+'/api/incar/channels/'+encodeURIComponent(id||'');
const auth=()=>({Authorization:'Bearer '+(localStorage.getItem('tl_token')||'')});
async function load(){try{if(!id)throw Error('차량 채널을 선택해 주세요.');const r=await fetch(base,{headers:auth(),cache:'no-store'}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'차량 조회 실패');const c=d.channel,l=d.listing||{};$('vehicle').hidden=false;$('name').textContent=c.name;$('meta').textContent=[c.car_type,c.drive_region,c.owner_name].filter(Boolean).join(' · ');$('description').textContent=c.description||'';$('sale').textContent=l.sale_status==='sale'?[Number(l.price).toLocaleString()+' '+l.currency,l.model_year+'년',Number(l.mileage_km).toLocaleString()+' km',l.description].join(' · '):l.sale_status==='sold'?'판매 완료':'판매 중인 차량이 아닙니다.';$('contact').textContent=l.sale_status==='sale'?(l.contact||''):'';$('photo').hidden=!l.has_photo;if(l.has_photo)$('photo').src=base+'/photo?v='+Date.now();$('owner').hidden=!d.can_edit;if(d.can_edit){$('saleStatus').value=l.sale_status||'none';$('price').value=l.price||0;$('currency').value=l.currency||'KRW';$('year').value=l.model_year||new Date().getFullYear();$('mileage').value=l.mileage_km||0;$('saleDescription').value=l.description||'';$('saleContact').value=l.contact||'';}$('status').textContent='';}catch(e){$('status').textContent=e.message;}}
$('listingForm').onsubmit=async e=>{e.preventDefault();const button=e.submitter;button.disabled=true;try{const r=await fetch(base+'/listing',{method:'POST',headers:{...auth(),'Content-Type':'application/json'},body:JSON.stringify({sale_status:$('saleStatus').value,price:Number($('price').value),currency:$('currency').value,model_year:Number($('year').value),mileage_km:Number($('mileage').value),description:$('saleDescription').value,contact:$('saleContact').value})}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'저장 실패');await load();$('status').textContent='판매 정보를 저장했습니다.';}catch(err){$('status').textContent=err.message;}finally{button.disabled=false;}};
$('upload').onclick=async()=>{if(!$('photoInput').files[0])return;$('upload').disabled=true;try{const form=new FormData();form.append('photo',$('photoInput').files[0]);const r=await fetch(base+'/photo',{method:'POST',headers:auth(),body:form}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'사진 저장 실패');await load();$('status').textContent='차량 사진을 저장했습니다.';}catch(e){$('status').textContent=e.message;}finally{$('upload').disabled=false;}};load();
</script><script src="/channel-community.js" defer></script><script src="/_shared/topbar-v2.js"></script><script src="/sidebar.js"></script><script src="/i18n.js"></script><script src="/_shared/footer.js" defer></script></body></html>
