<!doctype html><html lang="ko"><head><meta charset="utf-8"><script src="/renewal/renewal.js?v=20261024r1"></script><meta name="viewport" content="width=device-width,initial-scale=1"><title>내 프로필 — TimeLink</title><link rel="stylesheet" href="/apple-theme.css"><style>body{background:#09090d;color:#f5f5f7;font-family:system-ui,sans-serif}.wrap{max-width:720px;margin:50px auto;padding:24px}.panel{padding:28px;background:#15151b;border:1px solid #30303b;border-radius:18px}label{display:block;margin:18px 0 8px}input,textarea{box-sizing:border-box;width:100%;padding:13px;background:#23232c;color:white;border:1px solid #4a4a57;border-radius:9px}button{margin-top:22px;padding:13px 22px;background:#0071e3;border:0;border-radius:9px;color:white;font-weight:700}a{color:#64d2ff}small{color:#b7b7c4}</style><link rel="stylesheet" href="/renewal/renewal.css?v=20261024r1"></head><body><main class="wrap"><h1>내 프로필</h1><p>회원 공통 프로필은 대시보드와 DJ센터에서 함께 사용합니다.</p><div class="panel"><label for="name">표시 이름</label><input id="name" maxlength="80"><label for="email">가입 이메일 (읽기 전용)</label><input id="email" readonly><label for="bio">자기소개</label><textarea id="bio" maxlength="1000" rows="5"></textarea><p><small>DJ 방송 활동명과 방송 편성 정보는 DJ센터에서 별도로 수정합니다. 사진 파일 업로드는 아직 지원하지 않습니다.</small></p><button id="save">프로필 저장</button><p id="status" role="status"></p><p><a href="/dashboard.html">대시보드로</a> · <a href="/dj-center.html">DJ센터로</a></p></div></main><script>const API='https://api.timelink.digital',token=localStorage.getItem('tl_token');if(!token)location.replace('/login.html');const status=document.getElementById('status');async function request(method,body){const r=await fetch(API+'/api/dj-cafe/member-profile',{method,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'요청 실패');return d;}request('GET').then(d=>{document.getElementById('name').value=d.profile.display_name||'';document.getElementById('email').value=d.profile.email||'';document.getElementById('bio').value=d.profile.bio||'';}).catch(e=>status.textContent='프로필 조회 실패: '+e.message);document.getElementById('save').onclick=async()=>{status.textContent='저장 중...';try{await request('POST',{display_name:document.getElementById('name').value.trim(),bio:document.getElementById('bio').value.trim()});status.textContent='저장되었습니다.';}catch(e){status.textContent='저장 실패: '+e.message;}};</script><script src="/sidebar.js?v=member-profile-20261023"></script></body></html>
