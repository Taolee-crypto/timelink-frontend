<!doctype html><html lang="ko"><head><meta charset="utf-8"><script src="/renewal/renewal.js?v=20261024r2"></script><meta name="viewport" content="width=device-width,initial-scale=1"><title>내 정보 — TimeLink</title><link rel="stylesheet" href="/apple-theme.css"><style>body{background:#09090d;color:#f5f5f7;font-family:system-ui,sans-serif}.wrap{max-width:720px;margin:50px auto;padding:24px}.panel{padding:28px;background:#15151b;border:1px solid #30303b;border-radius:18px}label{display:block;margin:18px 0 8px}input,textarea{box-sizing:border-box;width:100%;padding:13px;background:#23232c;color:white;border:1px solid #4a4a57;border-radius:9px}button{margin-top:22px;padding:13px 22px;background:#0071e3;border:0;border-radius:9px;color:white;font-weight:700}a{color:#64d2ff}small{color:#b7b7c4}</style><link rel="stylesheet" href="/renewal/renewal.css?v=20261024r2"></head><body><main class="wrap"><header class="gate-account-intro"><p class="gate-kicker">MY INFORMATION</p><h1>내 정보</h1><p>나의 작품과 개설한 공간, 방송과 활동을 한곳에서 찾으세요.</p></header><nav class="gate-account-links" aria-label="나의 등록과 활동"><a href="/dashboard.html?tab=content">내 작품·등록 내역 <span>작품 관리 →</span></a><a href="/renewal/music.html">나의 음악 <span>음악 관리 →</span></a><a href="/my-cafe.html">나의 카페 <span>매장과 방송 →</span></a><a href="/my-car.html">나의 차 <span>차량과 방송 →</span></a><a href="/wallet.html">나의 지갑 <span>잔액과 이용 내역 →</span></a><a href="/dashboard.html?tab=settlement">정산 내역 <span>나의 정산 →</span></a><a href="/dashboard.html?tab=mining">기여와 활동 <span>활동 현황 →</span></a></nav><h2>회원 프로필</h2><p>표시 이름과 소개를 수정하세요.</p><div class="panel"><label for="name">표시 이름</label><input id="name" maxlength="80"><label for="email">가입 이메일 (읽기 전용)</label><input id="email" readonly><label for="bio">자기소개</label><textarea id="bio" maxlength="1000" rows="5"></textarea><p><small>사진 파일 업로드는 아직 지원하지 않습니다.</small></p><button id="save">프로필 저장</button><p id="status" role="status"></p><p><a href="/dashboard.html">대시보드로</a></p></div></main><script>const API='https://api.timelink.digital',token=localStorage.getItem('tl_token');if(!token)location.replace('/login.html');const status=document.getElementById('status');async function request(method,body){const r=await fetch(API+'/api/dj-cafe/member-profile',{method,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'요청 실패');return d;}request('GET').then(d=>{document.getElementById('name').value=d.profile.display_name||'';document.getElementById('email').value=d.profile.email||'';document.getElementById('bio').value=d.profile.bio||'';}).catch(e=>status.textContent='프로필 조회 실패: '+e.message);document.getElementById('save').onclick=async()=>{status.textContent='저장 중...';try{await request('POST',{display_name:document.getElementById('name').value.trim(),bio:document.getElementById('bio').value.trim()});status.textContent='저장되었습니다.';}catch(e){status.textContent='저장 실패: '+e.message;}};</script><script src="/sidebar.js?v=member-profile-20261023"></script></body></html>
