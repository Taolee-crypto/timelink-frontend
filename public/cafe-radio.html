<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TL 라이브 라디오 — TimeLink</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+KR:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070709;--bg2:#0C0C12;--bg3:#111118;
  --purple:#0071E3;--mint:#64D2FF;--cyan:#00E5FF;
  --amber:#F5A623;--green:#2ECC71;--red:#FF4757;
  --bd:rgba(255,255,255,.07);--bd2:rgba(255,255,255,.13);
  --t1:#fff;--t2:rgba(255,255,255,.6);--t3:rgba(255,255,255,.3);
  --fn:'Noto Sans KR',sans-serif;--fm:'JetBrains Mono',monospace;--fb:'Bebas Neue',cursive;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--fn);background:var(--bg);color:var(--t1);min-height:100vh}
body::before{content:'';position:fixed;inset:0;
  background:radial-gradient(ellipse 60% 40% at 80% 10%,rgba(255,71,87,.06),transparent 60%),
             radial-gradient(ellipse 50% 50% at 10% 80%,rgba(100,210,255,.05),transparent 60%);
  pointer-events:none;z-index:0}

.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh;position:relative;z-index:1}
.sidebar{background:#090D12;border-right:1px solid var(--bd);position:sticky;top:0;height:100vh;
  overflow-y:auto;display:flex;flex-direction:column;flex-shrink:0}
.sb-logo{padding:20px 16px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px;text-decoration:none}
.sb-logo-icon{width:30px;height:30px;background:linear-gradient(135deg,var(--red),#C41E3A);
  border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:#fff}
.sb-logo-text{font-family:var(--fb);font-size:16px;letter-spacing:.08em;color:var(--t1)}
.sb-nav{padding:10px 0;flex:1}
.sb-section{padding:12px 16px 4px;font-size:9px;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;color:var(--t3);font-family:var(--fm)}
.sb-link{display:flex;align-items:center;gap:9px;padding:9px 16px;text-decoration:none;color:var(--t2);
  font-size:12px;font-weight:500;transition:all .2s;cursor:pointer}
.sb-link:hover{color:var(--t1);background:rgba(255,255,255,.03)}
.sb-link.active{color:var(--red);background:rgba(255,71,87,.08)}

.main{overflow-y:auto;padding:0}
.topbar{display:flex;align-items:center;gap:14px;padding:18px 32px;border-bottom:1px solid var(--bd);
  background:rgba(7,7,9,.85);backdrop-filter:blur(20px);position:sticky;top:0;z-index:100;flex-wrap:wrap}
.tb-title{font-family:var(--fb);font-size:22px;letter-spacing:.06em;color:var(--red)}
.tb-live{display:flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;
  background:rgba(255,71,87,.15);border:1px solid rgba(255,71,87,.3);font-size:11px;
  font-family:var(--fm);color:var(--red);font-weight:700;letter-spacing:.1em}
.tb-live-dot{width:7px;height:7px;border-radius:50%;background:var(--red);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
.tb-user{margin-left:auto;font-size:12px;color:var(--t3);font-family:var(--fm)}
.tb-back{padding:6px 14px;border-radius:8px;border:1px solid var(--bd);color:var(--t3);
  font-size:12px;text-decoration:none;transition:all .2s;cursor:pointer}
.tb-back:hover{color:var(--t1);border-color:var(--bd2)}

.content{padding:32px;max-width:1200px;margin:0 auto}

/* 헤더 */
.hero{text-align:center;margin-bottom:32px;padding:20px}
.hero-title{font-family:var(--fb);font-size:42px;letter-spacing:.06em;margin-bottom:8px;
  background:linear-gradient(135deg,#fff 30%,var(--red));-webkit-background-clip:text;
  -webkit-text-fill-color:transparent;background-clip:text}
.hero-sub{font-size:14px;color:var(--t2);line-height:1.6}

/* DJ 카드 그리드 */
.dj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;margin-bottom:24px}
.dj-card{background:rgba(255,255,255,.025);border:1px solid var(--bd);border-radius:16px;
  padding:20px;transition:all .3s;position:relative;overflow:hidden}
.dj-card:hover{border-color:rgba(255,71,87,.3);transform:translateY(-3px);box-shadow:0 12px 32px rgba(0,0,0,.4)}
.dj-card.live{border-color:rgba(255,71,87,.4);background:rgba(255,71,87,.03)}
.dj-card.contract{border-color:rgba(46,204,113,.4);background:rgba(46,204,113,.03)}

.dj-top{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.dj-avatar{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--purple),var(--mint));
  display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;overflow:hidden;position:relative;border:2px solid var(--bd2)}
.dj-avatar img{width:100%;height:100%;object-fit:cover}
.dj-avatar.live::after{content:'';position:absolute;top:-2px;right:-2px;width:14px;height:14px;
  border-radius:50%;background:var(--red);border:2px solid var(--bg);animation:pulse 1.2s infinite}
.dj-info{flex:1;min-width:0}
.dj-name{font-size:16px;font-weight:800;margin-bottom:3px}
.dj-bio{font-size:12px;color:var(--t3);line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dj-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.dj-tag{padding:2px 8px;border-radius:10px;background:rgba(100,210,255,.1);border:1px solid rgba(100,210,255,.2);
  font-size:10px;color:var(--mint);font-family:var(--fm)}

.dj-now{background:rgba(0,0,0,.3);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:14px}
.dj-now-label{font-size:9px;color:var(--red);font-family:var(--fm);letter-spacing:.1em;margin-bottom:4px}
.dj-now-title{font-size:14px;font-weight:700;margin-bottom:2px}
.dj-now-artist{font-size:12px;color:var(--t3)}
.dj-wave{display:flex;align-items:center;gap:2px;height:16px;margin-top:8px}
.dj-wave span{width:3px;border-radius:2px;background:var(--red);opacity:.6;animation:wave 1.2s infinite}
.dj-wave span:nth-child(1){height:6px;animation-delay:0s}
.dj-wave span:nth-child(2){height:12px;animation-delay:.1s}
.dj-wave span:nth-child(3){height:16px;animation-delay:.2s}
.dj-wave span:nth-child(4){height:10px;animation-delay:.15s}
.dj-wave span:nth-child(5){height:14px;animation-delay:.05s}
@keyframes wave{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}

.dj-stats{display:flex;gap:14px;margin-bottom:14px;font-size:11px;font-family:var(--fm);color:var(--t3)}
.dj-stats strong{color:var(--t1)}

.dj-actions{display:flex;gap:8px;flex-wrap:wrap}
.dj-btn{flex:1;padding:10px 14px;border-radius:10px;border:none;font-size:12px;font-weight:700;
  cursor:pointer;transition:all .2s;font-family:var(--fn);display:flex;align-items:center;justify-content:center;gap:5px}
.dj-btn-preview{background:rgba(255,255,255,.05);border:1px solid var(--bd2);color:var(--t2)}
.dj-btn-preview:hover{background:rgba(255,255,255,.08);color:var(--t1)}
.dj-btn-listen{background:linear-gradient(135deg,var(--purple),var(--mint));color:#fff}
.dj-btn-listen:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,113,227,.4)}
.dj-btn-contract{background:linear-gradient(135deg,var(--green),#27AE60);color:#fff}
.dj-btn-contract:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(46,204,113,.4)}
.dj-btn-contract.on{background:linear-gradient(135deg,var(--red),#C41E3A)}
.dj-btn-contract.on:hover{box-shadow:0 4px 16px rgba(255,71,87,.4)}

/* 재생 바 */
.player-bar{position:fixed;bottom:0;left:220px;right:0;z-index:200;background:rgba(7,7,9,.98);
  border-top:1px solid var(--bd2);backdrop-filter:blur(20px);padding:14px 24px;
  display:none;align-items:center;gap:16px}
.player-bar.show{display:flex}
.pb-cover{width:48px;height:48px;border-radius:8px;background:rgba(255,255,255,.06);
  display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;overflow:hidden}
.pb-info{flex:1;min-width:0}
.pb-title{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pb-sub{font-size:11px;color:var(--t3);margin-top:2px;font-family:var(--fm)}
.pb-tl{font-size:12px;font-family:var(--fm);color:var(--mint);flex-shrink:0}
.pb-btn{width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;flex-shrink:0;
  background:var(--red);color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center;
  transition:all .2s}
.pb-btn:hover{transform:scale(1.1)}

/* 빈 상태 */
.empty{text-align:center;padding:80px 20px;color:var(--t3)}
.empty-icon{font-size:48px;margin-bottom:16px;opacity:.3}
.empty-title{font-size:16px;font-weight:700;color:var(--t2);margin-bottom:8px}
.empty-desc{font-size:13px;line-height:1.7;max-width:400px;margin:0 auto}

/* 로딩 */
.loading{text-align:center;padding:40px;color:var(--t3);font-family:var(--fm);font-size:13px}
.spinner{display:inline-block;width:20px;height:20px;border:2px solid rgba(255,255,255,.1);
  border-top-color:var(--mint);border-radius:50%;animation:sp .7s linear infinite;margin-right:8px;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}

/* 토스트 */
#toast-box{position:fixed;bottom:100px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.t{padding:12px 18px;border-radius:10px;font-size:13px;font-weight:600;backdrop-filter:blur(20px);
  border:1px solid var(--bd2);color:var(--t1);animation:tin .25s ease;max-width:320px;background:rgba(15,15,25,.95)}
.t.s{background:rgba(46,204,113,.15);color:var(--green);border-color:rgba(46,204,113,.35)}
.t.e{background:rgba(255,71,87,.15);color:var(--red);border-color:rgba(255,71,87,.35)}
.t.i{background:rgba(100,210,255,.12);color:var(--mint);border-color:rgba(100,210,255,.3)}
@keyframes tin{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}

@media(max-width:768px){
  .app{grid-template-columns:1fr}
  .sidebar{display:none}
  .content{padding:20px}
  .player-bar{left:0}
  .dj-grid{grid-template-columns:1fr}
}
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="/apple-theme.css">
</head>
<body>
<div id="toast-box"></div>

<div class="app">
  <!-- ══ 사이드바 ══ -->
  <aside class="sidebar">
    <a href="shareplace.html" class="sb-logo">
      <div class="sb-logo-icon">TL</div>
      <span class="sb-logo-text">RADIO</span>
    </a>
    <nav class="sb-nav">
      <div class="sb-section">메뉴</div>
      <a href="shareplace.html" class="sb-link">🏠 홈</a>
      <a href="radio.html" class="sb-link">📻 방송국</a>
      <a href="cafe-radio.html" class="sb-link active">🔴 라이브 라디오</a>
      <a href="incar.html" class="sb-link">🚗 인카방송</a>
      <a href="dj-center.html" class="sb-link">🎧 DJ 센터</a>
      <div class="sb-section">계정</div>
      <a href="dashboard.html" class="sb-link">📊 대시보드</a>
      <a href="wallet.html" class="sb-link">💰 지갑</a>
    </nav>
  </aside>

  <!-- ══ 메인 ══ -->
  <main class="main">
    <div class="topbar">
      <div class="tb-title">🔴 TL LIVE RADIO</div>
      <div class="tb-live" id="liveIndicator">
        <div class="tb-live-dot"></div>
        <span id="liveCount">LIVE 0</span>
      </div>
      <a href="radio.html" class="tb-back">← 방송국</a>
      <div class="tb-user" id="tbUser">--</div>
    </div>

    <div class="content">
      <!-- 히어로 -->
      <div class="hero">
        <div class="hero-title">🔴 LIVE RADIO</div>
        <div class="hero-sub">지금 방송 중인 DJ를 만나보세요<br>미리듣기 무료 · 청취 시 TL 차감</div>
      </div>

      <!-- DJ 목록 -->
      <div id="djGrid">
        <div class="loading"><span class="spinner"></span>라이브 DJ 로딩 중...</div>
      </div>
    </div>

</div>

<!-- 재생 바 -->
<div class="player-bar" id="playerBar">
  <div class="pb-cover" id="pbCover">🎵</div>
  <div class="pb-info">
    <div class="pb-title" id="pbTitle">--</div>
    <div class="pb-sub" id="pbSub">--</div>
  </div>
  <div class="pb-tl" id="pbTL">-- TL</div>
  <button class="pb-btn" onclick="stopPlay()">⏹</button>
</div>

<audio id="liveAudio" crossorigin="anonymous"></audio>

<script src="/tl3.js"></script>
<script>
var API = 'https://api.timelink.digital';
var _user = null, _token = null;
var _rates = { normal: 1.0, cafe: 0.5, preview: 0, dj_self: 0 };
var _liveDjs = [];
var _myContracts = [];      // 카페 주인 계약 목록
var _isCafeOwner = false;   // 카페 주인 여부
var _playing = null;        // 현재 재생 중인 DJ
var _preview = false;       // 미리듣기 여부
var _chargeTimer = null;
var _chargeStartedAt = 0;
var _audio = null;          // 오디오 객체
var _playingTrackId = null; // 현재 재생 중인 곡 ID
var _trackPolling = null;   // 곡 폴링 타이머

// ── 인증 ──
try {
  _user = JSON.parse(localStorage.getItem('tl_user') || 'null');
  _token = localStorage.getItem('tl_token') || '';
} catch(e) {}
document.getElementById('tbUser').textContent = (_user && (_user.username || _user.email)) || '비로그인';

// ── 유틸 ──
function g(id){ return document.getElementById(id); }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function toast(msg, t){
  t = t||'i';
  var el = document.createElement('div');
  el.className = 't '+t; el.textContent = msg;
  g('toast-box').prepend(el);
  setTimeout(function(){ el.remove(); }, 3200);
}

// ── 카페 주인 확인 ──
async function checkCafeOwner(){
  if(!_user || !_token) return false;
  try {
    var r = await fetch(API+'/api/cafe/channels?owner_id=' + _user.id, {
      headers:{'Authorization':'Bearer '+_token}
    });
    var d = await r.json();
    var channels = d.channels || [];
    // 내가 소유한 카페 채널이 있으면 카페 주인
    _isCafeOwner = channels.some(function(ch){
      return Number(ch.owner_id) === Number(_user.id);
    });
    return _isCafeOwner;
  } catch(e) { return false; }
}

// ── 계약 목록 로드 (카페 주인) ──
async function loadMyContracts(){
  if(!_isCafeOwner) return;
  try {
    var r = await fetch(API+'/api/dj-cafe/my-contracts', {
      headers:{'Authorization':'Bearer '+_token}
    });
    var d = await r.json();
    _myContracts = (d.contracts || []).filter(function(c){ return c.status === 'active'; });
  } catch(e) { _myContracts = []; }
}

// ── 요율 로드 ──
async function loadRates(){
  try {
    var r = await fetch(API+'/api/dj-cafe/rates');
    var d = await r.json();
    if(d.ok) _rates = d.rates;
  } catch(e) {}
}

// ── 라이브 DJ 목록 ──
async function loadLiveDjs(){
  try {
    var r = await fetch(API+'/api/dj-cafe/live-djs');
    var d = await r.json();
    _liveDjs = d.djs || [];
    renderDjs();
    var cnt = _liveDjs.length;
    g('liveCount').textContent = 'LIVE ' + cnt;
  } catch(e) {
    g('djGrid').innerHTML = '<div class="empty"><div class="empty-title">로드 실패</div></div>';
  }
}

// ── DJ 렌더 ──
function renderDjs(){
  if(!_liveDjs.length){
    g('djGrid').innerHTML =
      '<div class="empty">' +
        '<div class="empty-icon">📻</div>' +
        '<div class="empty-title">지금 라이브 중인 DJ가 없습니다</div>' +
        '<div class="empty-desc">DJ 센터에서 방송을 시작하면 여기에 표시됩니다.</div>' +
      '</div>';
    return;
  }

  g('djGrid').innerHTML = _liveDjs.map(function(dj){
    var isContract = _myContracts.some(function(c){ return Number(c.dj_id) === Number(dj.id); });
    var isPlaying = _playing && Number(_playing.id) === Number(dj.id);
    var cover = dj.avatar_url
      ? '<img src="'+esc(dj.avatar_url)+'" onerror="this.style.display=\'none\'">'
      : '🎧';
    var genres = [];
    try { genres = JSON.parse(dj.genres || '[]'); } catch(e) {}
    var tagsHtml = genres.slice(0,3).map(function(g){ return '<span class="dj-tag">'+esc(g)+'</span>'; }).join('');

    return '<div class="dj-card '+(isContract?'contract':'live')+'" id="dj-card-'+dj.id+'">' +
      '<div class="dj-top">' +
        '<div class="dj-avatar '+(dj.is_live?'live':'')+'">'+cover+'</div>' +
        '<div class="dj-info">' +
          '<div class="dj-name">'+esc(dj.dj_name||'DJ')+'</div>' +
          '<div class="dj-bio">'+esc(dj.bio||'소개 없음')+'</div>' +
          (tagsHtml?'<div class="dj-tags">'+tagsHtml+'</div>':'') +
        '</div>' +
      '</div>' +
      '<div class="dj-now">' +
        '<div class="dj-now-label">🎵 NOW PLAYING</div>' +
        '<div class="dj-now-title">'+esc(dj.current_track_id ? '재생 중' : '방송 준비 중')+'</div>' +
        '<div class="dj-now-artist">'+esc(dj.dj_name||'')+' 방송</div>' +
        '<div class="dj-wave"><span></span><span></span><span></span><span></span><span></span></div>' +
      '</div>' +
      '<div class="dj-stats">' +
        '👥 <strong>'+Number(dj.live_listener_count||0)+'</strong> 청취 · ' +
        '⭐ <strong>'+Number(dj.rating||0).toFixed(1)+'</strong>' +
      '</div>' +
      '<div class="dj-actions">' +
        '<button class="dj-btn dj-btn-preview" onclick="previewDj('+dj.id+')">▶ 미리듣기</button>' +
        (_user
          ? '<button class="dj-btn dj-btn-listen" onclick="listenDj('+dj.id+')">🎧 청취</button>'
          : '') +
        (_isCafeOwner
          ? (isContract
              ? '<button class="dj-btn dj-btn-contract on" onclick="cancelContract('+dj.id+')">🚪 계약 해지</button>'
              : '<button class="dj-btn dj-btn-contract" onclick="contractDj('+dj.id+')">🤝 계약 (×0.5)</button>'
            )
          : '') +
      '</div>' +
    '</div>';
  }).join('');
}

// ── 미리듣기 (30초 무료) ──
async function previewDj(djId){
  var dj = _liveDjs.find(function(d){ return Number(d.id) === Number(djId); });
  if(!dj) return;

  try {
    var r = await fetch(API+'/api/dj-cafe/live/'+djId+'/now');
    var d = await r.json();
    if(!d.ok || !d.current_track || !d.current_track.stream_url){
      toast('방송 준비 중입니다', 'i');
      return;
    }

    _preview = true;
    _playing = dj;
    _playingTrackId = d.current_track.id;

    playAudio(d.current_track.stream_url, true, d.current_track.elapsed_ms);

    g('playerBar').classList.add('show');
    g('pbTitle').textContent = d.current_track.title || dj.dj_name + ' 방송';
    g('pbSub').textContent = '미리듣기 30초 (무료)';
    g('pbTL').textContent = '무료';
    toast('▶ 미리듣기 30초 (무료)', 'i');

    var sec = 30;
    var t = setInterval(function(){
      sec--;
      if(sec <= 0 || !_preview){
        clearInterval(t);
        if(_preview){
          stopPlay();
          toast('미리듣기 종료. 🎧 청취 버튼으로 계속 들으세요', 'i');
        }
      } else {
        g('pbSub').textContent = '미리듣기 ' + sec + '초 남음';
      }
    }, 1000);

  } catch(e) {
    toast('미리듣기 실패: '+e.message, 'e');
  }
}

// ── 청취 (개인, ×1.0) ──
// ── 청취 (팝업 플레이어) ──
function listenDj(djId){
  if(!_user){ toast('로그인이 필요합니다', 'e'); return; }
  var dj = _liveDjs.find(function(d){ return Number(d.id) === Number(djId); });
  if(!dj) return;

  var isContracted = _myContracts.some(function(c){ return Number(c.dj_id) === Number(djId); });
  var role = isContracted ? 'cafe' : 'normal';

  sessionStorage.setItem('tl_player_args', JSON.stringify({dj_id: djId, role: role, ts: Date.now()}));
  var url = '/player-host?dj_id=' + djId + '&role=' + role;
  var w = window.open(url, 'tl_live_player',
    'width=380,height=660,menubar=no,toolbar=no,location=no,status=no,resizable=yes');
  if(!w){ toast('팝업이 차단되었습니다. 브라우저 설정을 확인하세요.', 'e'); return; }
  w.focus();

  toast('🎧 팝업 플레이어에서 재생 중', 's');
}
async function playDjTrack(djId, skipIfSame, role){
  try {
    var r = await fetch(API+'/api/dj-cafe/live/'+djId+'/now');
    var d = await r.json();
    if(!d.ok || !d.current_track || !d.current_track.stream_url){
      return;
    }
    var track = d.current_track;
    if(skipIfSame && _playingTrackId === track.id) return;

    _playingTrackId = track.id;
    playAudio(track.stream_url, false, track.elapsed_ms);

    // UI 업데이트
    g('pbTitle').textContent = track.title || 'Unknown';
    g('pbSub').textContent = (track.artist || '') + ' · ' + (track.category || '');
  } catch(e) {
    console.warn('[cafe-radio] track 오류:', e);
  }
}

// ── 오디오 재생 ──
// ── 오디오 재생 (TL3 aware) ──
function playAudio(url, isPreview, startMs){
  stopAudio();
  _audio = new Audio();
  _audio.crossOrigin = 'anonymous';

  var _expectedUrl = url;

  var _attach = function(playableUrl){
    if(_expectedUrl !== url) { console.log('[skip] 곡 전환됨'); return; }
    _audio.src = playableUrl;
    _audio.load();
    if(startMs && startMs > 0 && startMs < 120000){
      try { _audio.currentTime = startMs / 1000; } catch(e) {}
    }
    return _audio.play();
  };

  var authHeaders = _token ? {'Authorization':'Bearer '+_token} : {};
  if(/trycloudflare\.com|127\.0\.0\.1|localhost|agent\.timelink\.digital/i.test(url)) authHeaders = {};

  if(window.TL3 && TL3.resolveUrl){
    TL3.resolveUrl(url, {fetchOptions:{headers:authHeaders}, fallbackDirect:false})
      .then(_attach)
      .then(function(){
        console.log('[cafe-radio] 재생(TL3):', url.slice(-30));
      })
      .catch(function(e){
        console.warn('[cafe-radio] TL3 재생 실패:', e && e.message);
        toast('재생 실패: ' + (e && e.message ? e.message : e), 'e');
      });
  } else {
    _attach(url).then(function(){
      console.log('[cafe-radio] 재생(plain):', url.slice(-20));
    }).catch(function(e){
      console.warn('[cafe-radio] 재생 실패:', e.message);
      toast('재생 실패: 브라우저 오디오 허용 필요', 'e');
    });
  }
}
function stopAudio(){
  if(_audio){ 
    try { _audio.pause(); } catch(e) {}
    _audio = null; 
  }
}

// ── 계약 (카페 주인, ×0.5) ──
async function contractDj(djId){
  if(!_isCafeOwner){ toast('카페 주인만 계약 가능합니다', 'e'); return; }
  if(!confirm('이 DJ와 계약하시겠습니까?\n\n카페 요율(×0.5)로 초당 차감됩니다.')) return;
  try {
    var myCafeId = _myContracts[0] ? _myContracts[0].cafe_channel_id : '';
    var r = await fetch(API+'/api/dj-cafe/apply', {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+_token},
      body: JSON.stringify({
        cafe_channel_id: myCafeId,
        dj_id: djId,
        message: '즉시 계약'
      })
    });
    var d = await r.json();
    if(!r.ok) throw new Error(d.error || '계약 실패');
    toast('✅ 계약 완료! 방송을 청취합니다', 's');
    await loadMyContracts();
    renderDjs();
    // 자동 재생 시작
    listenDj(djId);
  } catch(e) {
    toast('계약 실패: '+e.message, 'e');
  }
}

async function cancelContract(djId){
  if(!confirm('계약을 해지하시겠습니까?')) return;
  try {
    var c = _myContracts.find(function(x){ return Number(x.dj_id) === Number(djId); });
    if(c){
      await fetch(API+'/api/dj-cafe/contracts/'+c.id+'/end', {
        method:'POST',
        headers:{'Authorization':'Bearer '+_token}
      });
    }
    toast('계약 해지됨', 'i');
    stopPlay();
    await loadMyContracts();
    renderDjs();
  } catch(e) {
    toast('해지 실패: '+e.message, 'e');
  }
}

// ── 차감 시작 ──
function startCharging(djId, role){
  stopCharging();
  _chargeStartedAt = Date.now();
  _chargeTimer = setInterval(async function(){
    if(!_playing) return;
    try {
      var r = await fetch(API+'/api/dj-cafe/charge', {
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+_token},
        body: JSON.stringify({
          dj_id: djId,
          share_id: 'stream',
          seconds: 1,
          role: role
        })
      });
      var d = await r.json();
      if(d.ok){
        g('pbTL').textContent = Number(d.charged).toFixed(1) + ' TL/초';
      } else if(r.status === 402){
        toast('⚠️ TL 부족: ' + d.current + ' / ' + d.required, 'e');
        stopPlay();
      }
    } catch(e) {}
  }, 1000);
}

function stopCharging(){
  if(_chargeTimer){ clearInterval(_chargeTimer); _chargeTimer = null; }
}

function stopPlay(){
  stopCharging();
  stopAudio();
  if(_trackPolling){ clearInterval(_trackPolling); _trackPolling = null; }
  _playing = null;
  _preview = false;
  _playingTrackId = null;
  g('playerBar').classList.remove('show');
  renderDjs();
}

// ── 초기화 ──
async function init(){
  await loadRates();
  await checkCafeOwner();
  await loadMyContracts();
  await loadLiveDjs();
  // 30초마다 DJ 목록 갱신
  setInterval(loadLiveDjs, 30000);
  // 60초마다 계약 갱신
  if(_isCafeOwner) setInterval(loadMyContracts, 60000);
}

init();
</script>
