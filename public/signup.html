      <div class="checkbox-row" onclick="document.getElementById('agree1').click()">
        <input type="checkbox" id="agree1" onclick="event.stopPropagation()">
        <div class="checkbox-text" data-i18n-html="signup.consent.age.html"><strong>[필수]</strong> 만 14세 이상이며 <a href="terms.html" target="_blank" onclick="event.stopPropagation()">이용약관</a>에 동의합니다.</div>
      </div>

      <div class="checkbox-row" onclick="document.getElementById('agree2').click()">
        <input type="checkbox" id="agree2" onclick="event.stopPropagation()">
        <div class="checkbox-text" data-i18n-html="signup.consent.privacy.html"><strong>[필수]</strong> <a href="privacy.html" target="_blank" onclick="event.stopPropagation()">개인정보 처리방침</a>에 동의합니다.</div>
      </div>

      <div class="checkbox-row" onclick="document.getElementById('agree3').click()">
        <input type="checkbox" id="agree3" onclick="event.stopPropagation()">
        <div class="checkbox-text"><strong data-i18n="signup.optional">[선택]</strong> <span data-i18n="signup.consent.marketing">마케팅 정보 수신에 동의합니다.</span></div>
      </div>

      <section class="wizard-panel" data-wizard-panel="1">
      <div class="checkbox-row" onclick="document.getElementById('agree1').click()">
        <input type="checkbox" id="agree1" onclick="event.stopPropagation()">
        <div class="checkbox-text" data-i18n-html="signup.consent.age.html"><strong>[필수]</strong> 만 14세 이상이며 <a href="terms.html" target="_blank" onclick="event.stopPropagation()">이용약관</a>에 동의합니다.</div>
      </div>

      <div class="checkbox-row" onclick="document.getElementById('agree2').click()">
        <input type="checkbox" id="agree2" onclick="event.stopPropagation()">
        <div class="checkbox-text" data-i18n-html="signup.consent.privacy.html"><strong>[필수]</strong> <a href="privacy.html" target="_blank" onclick="event.stopPropagation()">개인정보 처리방침</a>에 동의합니다.</div>
      </div>

      <div class="checkbox-row" onclick="document.getElementById('agree3').click()">
        <input type="checkbox" id="agree3" onclick="event.stopPropagation()">
        <div class="checkbox-text"><strong data-i18n="signup.optional">[선택]</strong> <span data-i18n="signup.consent.marketing">마케팅 정보 수신에 동의합니다.</span></div>
      </div>

      </section>
      <div class="wizard-actions" id="wizardActions"><button type="button" class="wizard-back" id="wizardBack" hidden>이전</button><button type="button" class="btn-submit" id="wizardNext">다음 단계 →</button></div>
      <button class="btn-submit" id="submitBtn" onclick="doSignup()" hidden data-i18n="signup.button.start">가입하고 시작하기</button>

      <div class="form-footer"><span data-i18n="signup.have.account">이미 계정이 있으신가요?</span> <a href="login.html" data-i18n="signup.go.login">로그인</a></div>
    </div>

    <!-- 이메일 인증 -->
    <div class="verify-box signup-wizard" id="verifyBox"><div class="wizard-progress"><span class="wizard-dot done">✓</span><span class="wizard-line"></span><span class="wizard-dot done">✓</span><span class="wizard-line"></span><span class="wizard-dot active">3</span></div><p class="wizard-caption">3 / 3 · 이메일 인증</p>
      <div class="verify-icon">📧</div>
      <div class="verify-title" data-i18n="signup.verify.title">이메일 인증</div>
      <div class="verify-desc">
        <strong id="verifyEmail"></strong><span data-i18n="signup.verify.sent">로 인증 코드를 보냈습니다.</span><br>
        <span data-i18n="signup.verify.instruction">이메일에서 6자리 코드를 입력해주세요.</span>
      </div>
      <input type="text" class="verify-input" id="verifyCode" maxlength="6" placeholder="000000" data-i18n-placeholder="signup.verify.code.placeholder" inputmode="numeric">
      <button class="btn-submit" id="verifyBtn" onclick="doVerify()" data-i18n="signup.verify.complete">인증 완료</button>
      <div class="form-footer">
        <a href="#" onclick="resendCode();return false;" data-i18n="signup.verify.resend">코드 재발송</a>
      </div>
    </div>
  </div>

</div>

<script>
var API = 'https://api.timelink.digital';
var _signupData = null;

(function(){
  var currentStep=1, busy=false;
  var next=document.getElementById('wizardNext');
  var back=document.getElementById('wizardBack');
  var submit=document.getElementById('submitBtn');
  function step(n){
    currentStep=n;
    document.querySelectorAll('[data-wizard-panel]').forEach(function(panel){panel.hidden=Number(panel.dataset.wizardPanel)!==n;});
    document.querySelectorAll('[data-step-dot]').forEach(function(dot){var i=Number(dot.dataset.stepDot);dot.classList.toggle('active',i===n);dot.classList.toggle('done',i<n);dot.textContent=i<n?'✓':String(i);});
    document.getElementById('wizardCaption').textContent=n+' / 3 · '+(n===1?'약관 동의':'계정 정보');
    back.hidden=n===1;
    next.hidden=n===2;
    submit.hidden=n!==2;
    if(n===2)document.getElementById('email').focus();
  }
  next.addEventListener('click',function(){
    if(!document.getElementById('agree1').checked||!document.getElementById('agree2').checked){
      toast(signupText('signup.error.consent'),'error');return;
    }
    step(2);
  });
  back.addEventListener('click',function(){if(!busy)step(1);});
  document.querySelectorAll('.checkbox-row').forEach(function(row){
    row.removeAttribute('onclick');
    row.addEventListener('click',function(event){
      if(event.target.closest('a')||event.target.closest('input'))return;
      var box=row.querySelector('input[type=checkbox]');if(box)box.checked=!box.checked;
    });
  });
  step(1);
})();


function signupText(key){ return window.TLi18n ? window.TLi18n.t(key) : key; }

function toast(msg, t){
  t = t || 'info';
  var el = document.createElement('div');
  el.className = 'tl-toast ' + t;
  el.textContent = msg;
  document.getElementById('toast-box').prepend(el);
  setTimeout(function(){ el.remove(); }, 3200);
}

async function doSignup(){
  var email = document.getElementById('email').value.trim();
  var pw = document.getElementById('pw').value;
  var pw2 = document.getElementById('pw2').value;
  var username = document.getElementById('username').value.trim();
  var agree1 = document.getElementById('agree1').checked;
  var agree2 = document.getElementById('agree2').checked;
  var agree3 = document.getElementById('agree3').checked;

  if(!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ toast(signupText('signup.error.email'),'error'); return; }
  if(!pw || pw.length < 8){ toast(signupText('signup.error.password.length'),'error'); return; }
  if(pw !== pw2){ toast(signupText('signup.error.password.match'),'error'); return; }
  if(!username || username.length < 2){ toast(signupText('signup.error.nickname'),'error'); return; }
  if(!agree1 || !agree2){ toast(signupText('signup.error.consent'),'error'); return; }

  var btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.innerHTML = '<div class="spin"></div>';

  try{
    var r = await fetch(API + '/api/auth/signup', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({email: email, password: pw, username: username, marketing: agree3})
    });
    var d = await r.json();

    if(!r.ok || !d.ok){
      throw new Error((d && d.error) || signupText('signup.error.failed'));
    }

    _signupData = {email: email, password: pw, username: username};

    // 인증 화면으로 전환
    document.getElementById('formArea').style.display = 'none';
    document.getElementById('verifyBox').classList.add('show');
    document.getElementById('verifyEmail').textContent = email;
    document.getElementById('verifyCode').focus();
    toast(signupText('signup.toast.code.sent'),'success');
  }catch(err){
    toast((err && err.message) || signupText('signup.error.retry'),'error');
    btn.disabled = false;
    btn.textContent = signupText('signup.button.start');
  }
}

async function doVerify(){
  var code = document.getElementById('verifyCode').value.trim();
  if(!code || code.length !== 6){ toast(signupText('signup.error.code.six'),'error'); return; }

  var btn = document.getElementById('verifyBtn');
  btn.disabled = true;
  btn.innerHTML = '<div class="spin"></div>';

  try{
    var r = await fetch(API + '/api/auth/verify', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({email: _signupData.email, password: _signupData.password, username: _signupData.username, code: code})
    });
    var d = await r.json();

    if(!r.ok || !d.ok){
      throw new Error((d && d.error) || signupText('signup.error.verify.failed'));
    }

    // 자동 로그인
    var lr = await fetch(API + '/api/auth/login', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({email: _signupData.email, password: _signupData.password})
    });
    var ld = await lr.json();

    if(lr.ok && ld.token && ld.user){
      localStorage.setItem('tl_token', ld.token);
      localStorage.setItem('tl_user', JSON.stringify(ld.user));
      toast(signupText('signup.toast.complete'),'success');
      setTimeout(function(){ var rd=new URLSearchParams(location.search).get('redirect')||''; location.href=/^[a-z0-9_-]+\.html(?:\?[a-z0-9_=&%-]*)?$/i.test(rd)?rd:'shareplace.html'; }, 800);
    } else {
      toast(signupText('signup.toast.login'),'success');
      setTimeout(function(){ location.href = 'login.html'; }, 1000);
    }
  }catch(err){
    toast((err && err.message) || signupText('signup.error.code.invalid'),'error');
    btn.disabled = false;
    btn.textContent = signupText('signup.verify.complete');
  }
}

async function resendCode(){
  if(!_signupData) return;
  try{
    await fetch(API + '/api/auth/resend', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({email: _signupData.email})
    });
    toast(signupText('signup.toast.code.resent'),'success');
  }catch(e){
    toast(signupText('signup.error.resend'),'error');
  }
}

// 인증 코드 자동 입력 (6자리 입력 시)
document.getElementById('verifyCode').addEventListener('input', function(e){
  this.value = this.value.replace(/\D/g, '').slice(0, 6);
  if(this.value.length === 6) doVerify();
});
</script>

  function updateSignupTitle(){
    if(!window.TLi18n)return;
    document.title=window.TLi18n.t("signup.meta.title");
    var desc=document.querySelector('meta[name="description"]');
    if(desc)desc.content=window.TLi18n.t("signup.meta.description");
  }
  updateSignupTitle();
  window.addEventListener("tl-language-changed",updateSignupTitle);
})();
</script>
