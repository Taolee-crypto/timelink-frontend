<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SharePlace V3 | TimeLink</title><link rel="stylesheet" href="/apple-theme.css?v=light-20261020">
<style>
:root{color-scheme:dark;--bg:#080d19;--panel:#111a2b;--line:#26354c;--muted:#9aa9bd;--blue:#398bff;--cyan:#67d5e8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 10% 0%,#102b4d 0,transparent 42%),var(--bg);color:#f4f7fc;font:15px/1.6 -apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",sans-serif}nav{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 max(20px,calc((100% - 1100px)/2));gap:22px}.logo{font-weight:900;letter-spacing:.13em;color:#fff;text-decoration:none}.link{color:var(--muted);text-decoration:none;font-size:13px}main{max-width:1100px;margin:42px auto;padding:0 20px 80px}.eyebrow{font:700 10px ui-monospace,monospace;letter-spacing:.18em;color:var(--cyan)}h1{font-size:clamp(30px,5vw,46px);margin:10px 0}p{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-top:28px}.card{border:1px solid var(--line);background:linear-gradient(145deg,#142239,#0e1726);border-radius:16px;overflow:hidden;text-decoration:none;color:inherit;transition:transform .2s,border-color .2s}.card:hover{transform:translateY(-3px);border-color:#398bff}.cover{aspect-ratio:1.35;background:linear-gradient(135deg,#1b365b,#132033);display:grid;place-items:center;color:#80c9e7;font-size:34px}.cover img{width:100%;height:100%;object-fit:cover}.body{padding:15px}.title{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.artist{font-size:13px;color:var(--muted);margin-top:3px}.meta{font-size:11px;color:#8092aa;margin-top:12px;display:flex;gap:12px}.status{margin-top:20px;color:var(--muted);font-size:13px}
</style><style>
/* SharePlace V3 — global TimeLink */
:root{color-scheme:dark;--bg:#0A0A0A;--panel:#17171B;--line:rgba(255,255,255,.1);--muted:rgba(245,245,247,.62);--blue:#8B5CF6;--cyan:#A78BFA}
body{background:radial-gradient(ellipse at 10% 0%,rgba(139,92,246,.1),transparent 42%),#0A0A0A;color:#F5F5F7;font-family:'Pretendard','Inter',-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif}
nav{background:rgba(10,10,10,.9);border-color:var(--line);padding:0 22px;gap:16px;flex-wrap:wrap}
.logo{background:linear-gradient(120deg,#C4B5FD,#8B5CF6 65%,#F5A623);-webkit-background-clip:text;background-clip:text;color:transparent}
.link{color:var(--muted)}
main{max-width:1200px;margin:28px auto;padding:0 22px 70px}
.eyebrow{color:#C4B5FD}
.card{background:linear-gradient(145deg,rgba(139,92,246,.07),#17171B 58%);border-color:var(--line)}
.card:hover{border-color:#8B5CF6}
.cover{background:linear-gradient(135deg,#292039,#17171B);color:#C4B5FD}
.artist,.meta,.status{color:var(--muted)}
@media(max-width:640px){nav{height:auto;min-height:56px;padding:10px 14px;gap:10px}main{margin:18px auto;padding:0 12px 44px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{border-radius:13px}.body{padding:11px}.title{font-size:12px}.artist{font-size:11px}.meta{font-size:9px;gap:7px;flex-wrap:wrap}h1{font-size:29px}}
@media(max-width:380px){.grid{grid-template-columns:minmax(0,1fr)}}
@media(prefers-reduced-motion:reduce){.card{transition:none!important}}
</style>
</head><body>
<nav><a class="logo" href="/">TIMELINK</a><a class="link" href="/creator">Creator</a><a class="link" href="/shareplace.html">기존 SharePlace</a></nav>
<main><div class="eyebrow">TIME-LINK / MUSIC DISCOVERY</div><h1>SharePlace</h1><p>권리 검증과 발매 승인을 마친 창작자의 TL3 디지털 상품을 만난다.</p><div id="status" class="status">공개된 음악을 불러오는 중…</div><div id="grid" class="grid"></div></main>
<script>
(async function(){
 const API='https://api.timelink.digital',grid=document.getElementById('grid'),status=document.getElementById('status');
 try{
  const r=await fetch(API+'/api/v3/public/music/tracks?limit=50');const d=await r.json();
  if(!r.ok||!d.ok)throw new Error(d.error||'음악 목록을 불러오지 못했습니다.');
  grid.replaceChildren();
  for(const t of d.tracks||[]){
   const a=document.createElement('a');a.className='card';a.href='/track-v3.html?id='+encodeURIComponent(t.id);
   const cover=document.createElement('div');cover.className='cover';
   if(t.cover_url){const img=document.createElement('img');img.src=t.cover_url;img.alt='';cover.appendChild(img)}else cover.textContent='♪';
   const body=document.createElement('div');body.className='body';
   const title=document.createElement('div');title.className='title';title.textContent=t.display_title||'제목 없음';
   const artist=document.createElement('div');artist.className='artist';artist.textContent=t.artist||t.creator_name||'아티스트';
   const meta=document.createElement('div');meta.className='meta';meta.textContent=Number(t.price_tl||0).toLocaleString('ko-KR')+' TL   ·   ♥ '+Number(t.likes_count||0)+'   ·   댓글 '+Number(t.comments_count||0);
   body.append(title,artist,meta);a.append(cover,body);grid.appendChild(a);
  }
  status.textContent=d.tracks?.length?'TL3 발매 승인 음악 '+d.tracks.length+'곡':'아직 공개 승인된 TL3 발매가 없습니다.';
 }catch(e){status.textContent='불러오기 실패: '+e.message;}
})();
</script><script src="/sidebar.js?v=light-20261020"></script>
  <script src="/i18n.js?v=20261015"></script>
<script src="/_shared/footer.js" defer></script>
<script src="/tl-scenes.js?v=20261020e"></script>
</body></html>
