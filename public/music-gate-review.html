<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TILO · AI 음원 심사 운영자 검토</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#17283b;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}main{max-width:980px;margin:32px auto;padding:0 18px}h1{font-size:26px}p{line-height:1.6}.panel{background:#fff;border:1px solid #dce4ed;border-radius:14px;padding:22px;margin:16px 0;box-shadow:0 2px 9px #142c420a}button,input,textarea,select{font:inherit}button{background:#183d67;color:#fff;border:0;border-radius:8px;padding:11px 16px;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.secondary{background:#e9eef5;color:#193e65}input,textarea,select{border:1px solid #b9c7d7;border-radius:8px;padding:11px;width:100%}textarea{min-height:92px}label{display:block;font-weight:650;margin:12px 0 6px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row input{flex:1;min-width:220px}.entry{border-top:1px solid #e2e8f0;padding:15px 0;overflow-wrap:anywhere}.muted{color:#52677d}.warn{color:#8a450b}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f5f7fa;border-radius:8px;padding:12px;font-size:12px}#message{white-space:pre-wrap}a{color:#15548c}</style><link rel="stylesheet" href="/renewal/interface.css?v=20261026space1"></head>
<body><main><p><a href="/creator">← Creator</a></p><h1>AI 음원 심사 · 운영자 검토</h1>
<p class="muted">관리자 계정만 이용할 수 있습니다. 여기서 승인하는 것은 MP3 사전심사이며 저작권·공개·TL 보상 승인이 아닙니다.</p>
<section class="panel"><div class="row"><button id="load">검토 대기 목록 새로고침</button><input id="reviewId" placeholder="심사 번호(UUID)로 직접 조회" aria-label="심사 번호"><button class="secondary" id="lookup">조회</button></div><p id="message" role="status"></p></section>
<section class="panel"><h2>운영자 검토 대기</h2><div id="reviews">목록을 불러오려면 위 버튼을 누르세요.</div></section>
<section class="panel" id="detail" hidden><h2>심사 상세</h2><div id="summary"></div><details><summary>AI 근거 및 변경 이력 보기</summary><pre id="evidence"></pre><pre id="audit"></pre></details>
<label for="note">승인·반려 사유 (10자 이상, 필수)</label><textarea id="note" maxlength="2000" placeholder="실제 분석 근거와 운영자 판단을 기록하세요."></textarea>
<div class="row"><button id="approve">이 심사 승인</button><button id="reject" class="secondary">이 심사 반려</button></div>
<p class="warn">승인 후에도 권리자 검증과 공개·정산 절차는 별도로 진행됩니다.</p></section>
</main><script>
(function(){'use strict';
const API='https://api.timelink.digital/api/admin/v5/music-gate';
const $=id=>document.getElementById(id);let current=null,busy=false;
const token=()=>localStorage.getItem('tl_token')||'';
const msg=t=>{$('message').textContent=t;};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function request(path,method='GET',body){if(!token())throw Error('로그인이 필요합니다.');const r=await fetch(API+path,{method,headers:{Authorization:'Bearer '+token(),...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined,cache:'no-store'});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'요청 실패 ('+r.status+')');return j;}
async function load(){msg('검토 대기 목록을 확인하고 있습니다.');try{const j=await request('/reviews?status=review_required');const rows=j.reviews||[];$('reviews').innerHTML=rows.length?rows.map(r=>'<div class="entry"><b>'+esc(r.id)+'</b><p class="muted">회원 #'+esc(r.user_id)+' · '+esc(r.registration_mode)+' · '+esc(r.created_at)+'</p><button class="secondary" data-review="'+esc(r.id)+'">상세 검토</button></div>').join(''):'현재 검토 대기 심사가 없습니다.';msg(rows.length+'건의 운영자 검토 대기 심사');}catch(e){msg('목록 조회 실패: '+e.message);}}
async function show(id){if(!/^[a-f0-9-]{36}$/i.test(id)){msg('심사 번호를 확인하세요.');return;}msg('심사 내용을 조회하고 있습니다.');try{const j=await request('/reviews/'+encodeURIComponent(id));current=j.review;$('detail').hidden=false;$('summary').innerHTML='<p><b>심사 번호:</b> '+esc(current.id)+'</p><p><b>상태:</b> '+esc(current.status)+'</p><p><b>원본 SHA-256:</b> '+esc(current.source_sha256)+'</p><p><b>분석 오류:</b> '+esc(current.analysis_error||'없음')+'</p><p><b>검토 사유:</b> '+esc(current.reasons_json)+'</p>';$('evidence').textContent=current.evidence_json||'AI 근거 없음';$('audit').textContent=JSON.stringify(j.audit||[],null,2);$('approve').disabled=current.status!=='review_required';$('reject').disabled=current.status!=='review_required';msg('심사 상세를 불러왔습니다.');$('detail').scrollIntoView({behavior:'smooth',block:'start'});}catch(e){msg('상세 조회 실패: '+e.message);}}
async function decide(action){if(busy||!current||current.status!=='review_required')return;const note=$('note').value.trim();if(note.length<10){msg('승인·반려 사유를 10자 이상 입력하세요.');return;}const id=current.id,hash=current.source_sha256;if(!confirm('심사 '+id+'을(를) '+(action==='approve'?'승인':'반려')+'하시겠습니까?'))return;busy=true;$('approve').disabled=true;$('reject').disabled=true;try{await request('/reviews/'+encodeURIComponent(id)+'/decision','POST',{action,note,source_sha256:hash});msg('심사 '+id+' 처리 완료. 권리자 검증·공개·보상은 별도입니다.');await show(id);await load();}catch(e){msg('심사 처리 실패: '+e.message);$('approve').disabled=false;$('reject').disabled=false;}finally{busy=false;}}
$('load').addEventListener('click',load);$('lookup').addEventListener('click',()=>show($('reviewId').value.trim()));$('reviews').addEventListener('click',e=>{const b=e.target.closest('button[data-review]');if(b)show(b.dataset.review);});$('approve').addEventListener('click',()=>decide('approve'));$('reject').addEventListener('click',()=>decide('reject'));
if(!token())msg('먼저 관리자 계정으로 로그인하세요.');else{const params=new URLSearchParams(location.search),id=params.get('id');if(id)show(id);load();}
})();
</script></body></html>
