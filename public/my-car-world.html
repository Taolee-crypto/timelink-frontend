<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Car World | TimeLink</title>
<link rel="stylesheet" href="/apple-theme.css?v=light-20261020">
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0a0a0e;color:#f5f5f7;font-family:Inter,Pretendard,"Noto Sans KR",sans-serif}
.world-wrap{max-width:1280px;margin:0 auto;padding:34px 34px 70px}.world-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:28px}.eyebrow{font-size:11px;letter-spacing:.18em;color:#a78bfa;font-weight:800}.world-head h1{font-size:34px;letter-spacing:-.04em;margin:9px 0}.world-head p{color:#9693a3;margin:0;line-height:1.6}.world-count{color:#f5c16c;font-size:13px;white-space:nowrap}
.world-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}.car-card{border:1px solid #292632;background:#15141b;border-radius:16px;overflow:hidden;transition:.2s}.car-card:hover{transform:translateY(-3px);border-color:#7959c9}.car-visual{height:160px;background:radial-gradient(ellipse at 50% 100%,#44345f,#191720 70%);display:grid;place-items:center;font-size:58px}.car-body{padding:18px}.car-name{font-size:17px;font-weight:800}.car-meta{font-size:12px;color:#aaa5b7;margin-top:7px}.car-desc{font-size:13px;color:#c2bfca;line-height:1.55;margin:12px 0;min-height:40px}.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{font-size:10px;padding:5px 8px;border-radius:20px;background:#242033;color:#c7b7ff}.empty,.error{padding:60px 20px;text-align:center;border:1px dashed #393444;border-radius:16px;color:#aaa5b7;grid-column:1/-1}.refresh{border:1px solid #494253;background:#191720;color:#eee;border-radius:9px;padding:10px 14px;cursor:pointer}
@media(max-width:700px){.world-wrap{padding:28px 16px}.world-head{align-items:start;flex-direction:column}.world-head h1{font-size:28px}}
</style><script src="/_shared/topbar-v2.js?v=20261016b"></script>
</head>
<body>
<main class="world-wrap">
<header class="world-head"><div><div class="eyebrow">TIMELINK · COMMUNICATION</div><h1 data-en="My Car World" data-ko="마이카월드">마이카월드</h1><p data-en="Explore drivers, vehicles and their In-car broadcast channels." data-ko="운전자와 차량, 인카 방송 채널을 둘러보세요.">운전자와 차량, 인카 방송 채널을 둘러보세요.</p></div><div><span class="world-count" id="count">—</span> <button class="refresh" onclick="loadWorld()" data-en="Refresh" data-ko="새로고침">새로고침</button></div></header>
<section id="grid" class="world-grid"><div class="empty">마이카월드를 불러오는 중입니다…</div></section>
</main>
<script>
(function(){var lang=localStorage.getItem('tl_lang')||((navigator.language||'ko').toLowerCase().startsWith('ko')?'ko':'en');function apply(v){lang=String(v||'en').toLowerCase().startsWith('ko')?'ko':'en';document.documentElement.lang=lang;document.querySelectorAll('[data-en][data-ko]').forEach(function(n){n.textContent=n.getAttribute('data-'+lang);});}apply(lang);window.addEventListener('tl-language-changed',function(e){apply(e.detail&&e.detail.lang);});})();
var API='https://api.timelink.digital';
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
async function loadWorld(){var grid=document.getElementById('grid');grid.innerHTML='<div class="empty">Loading…</div>';try{var r=await fetch(API+'/api/incar/channels');var d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'Unable to load channels');var items=d.channels||[];document.getElementById('count').textContent=items.length+' CHANNELS';if(!items.length){grid.innerHTML='<div class="empty">아직 공개된 차량 채널이 없습니다.</div>';return;}grid.innerHTML=items.map(function(c){var songs=[];try{songs=Array.isArray(c.playlist)?c.playlist:JSON.parse(c.playlist||'[]');}catch(e){}return '<article class="car-card"><div class="car-visual">🚘</div><div class="car-body"><div class="car-name">'+esc(c.name)+'</div><div class="car-meta">'+esc(c.car_type||'Vehicle')+(c.drive_region?' · '+esc(c.drive_region):'')+'</div><p class="car-desc">'+esc(c.description||'TimeLink In-car Channel')+'</p><div class="tags"><span class="tag">IN-CAR CHANNEL</span><span class="tag">'+songs.length+' TRACKS</span><span class="tag">'+esc(c.theme||'city')+'</span></div></div></article>';}).join('');}catch(e){grid.innerHTML='<div class="error">'+esc(e.message)+'</div>';document.getElementById('count').textContent='—';}}
loadWorld();
</script>
<script src="/sidebar.js?v=light-20261020"></script><script src="/i18n.js?v=20261015-nav-event"></script>
<script src="/_shared/footer.js" defer></script>
</body></html>
