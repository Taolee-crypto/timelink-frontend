<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TLJ Viewer — Creator-rights Certificate · TimeLink</title>
<link rel="stylesheet" href="/dropdown-fix.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0f;--bg2:#111118;--bg3:#1a1a24;--gold:#FFD700;--purple:#8B5CF6;--mint:#F5A623;--t1:#fff;--t2:rgba(255,255,255,.7);--t3:rgba(255,255,255,.35);--bd:rgba(255,255,255,.08);--fn:'Pretendard',-apple-system,sans-serif}
@import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;900&display=swap');
body{background:var(--bg);color:var(--t1);font-family:var(--fn);min-height:100vh;padding:0}

.hdr{display:flex;align-items:center;gap:12px;padding:16px 24px;border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:100;background:rgba(10,10,15,.95);backdrop-filter:blur(20px)}
.hdr-logo{font-size:18px;font-weight:900;background:linear-gradient(135deg,var(--gold),#FFA500);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hdr-title{font-size:14px;color:var(--t3);margin-left:8px}

.wrap{max-width:1200px;margin:0 auto;padding:40px 24px}

/* 파일 로드 화면 */
.dropzone{max-width:600px;margin:80px auto;padding:60px 40px;background:linear-gradient(135deg,rgba(255,215,0,.04),rgba(139,92,246,.03));border:2px dashed rgba(255,215,0,.35);border-radius:24px;text-align:center;transition:all .2s;cursor:pointer}
.dropzone:hover,.dropzone.drag{border-color:var(--gold);background:linear-gradient(135deg,rgba(255,215,0,.08),rgba(139,92,246,.05));transform:scale(1.01)}
.dropzone-icon{font-size:64px;margin-bottom:16px}
.dropzone-title{font-size:20px;font-weight:700;margin-bottom:8px}
.dropzone-sub{font-size:13px;color:var(--t3);margin-bottom:24px}
.pick-btn{padding:14px 32px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--gold),#FFA500);color:#000;font-weight:700;font-size:14px;cursor:pointer;transition:transform .2s}
.pick-btn:hover{transform:translateY(-2px)}
.hidden-input{display:none}

/* 뷰어 화면 */
.viewer{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:start}
@media(max-width:900px){.viewer{grid-template-columns:1fr}}

.img-panel{background:var(--bg2);border:1px solid var(--bd);border-radius:20px;padding:20px;text-align:center;position:sticky;top:90px}
.img-panel img{max-width:100%;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.img-panel .badge{margin-top:16px;padding:8px 16px;display:inline-block;background:rgba(48,209,88,.15);border:1px solid rgba(48,209,88,.4);border-radius:20px;font-size:11px;font-weight:700;color:#30D158}

.meta-panel{display:flex;flex-direction:column;gap:20px}
.meta-card{background:linear-gradient(135deg,rgba(255,215,0,.06),rgba(255,159,10,.03));border:2px solid rgba(255,215,0,.3);border-radius:20px;padding:28px;position:relative;overflow:hidden}
.meta-card::before{content:'';position:absolute;top:-50px;right:-50px;width:200px;height:200px;background:radial-gradient(circle,rgba(255,215,0,.15),transparent);border-radius:50%}
.meta-hdr{display:flex;align-items:center;gap:12px;margin-bottom:20px;position:relative;z-index:1}
.meta-hdr-icon{font-size:36px}
.meta-hdr-text{font-size:11px;font-weight:700;color:var(--gold);letter-spacing:1.5px}
.meta-hdr-sub{font-size:10px;color:rgba(255,255,255,.5);margin-top:2px}
.verified-badge{margin-left:auto;padding:6px 14px;background:rgba(48,209,88,.15);border:1px solid rgba(48,209,88,.4);border-radius:20px;font-size:11px;font-weight:700;color:#30D158}

.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px;background:rgba(0,0,0,.25);border-radius:12px;margin-bottom:16px;position:relative;z-index:1}
.meta-item{display:flex;flex-direction:column;gap:4px}
.meta-lbl{font-size:10px;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.5px}
.meta-val{font-size:13px;font-weight:600;color:#fff;word-break:break-word}
.meta-val.mono{font-family:'SF Mono',monospace;font-size:12px;color:var(--gold)}

.hash-box{padding:10px 12px;background:rgba(0,0,0,.3);border-radius:8px;font-size:10px;font-family:monospace;color:rgba(255,255,255,.5);word-break:break-all;margin-bottom:16px;position:relative;z-index:1}

.actions{display:flex;gap:8px;position:relative;z-index:1}
.btn{flex:1;padding:14px;border-radius:12px;border:none;font-weight:700;font-size:13px;cursor:pointer;transition:all .2s}
.btn-primary{background:linear-gradient(135deg,var(--gold),#FFA500);color:#000}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(255,215,0,.3)}
.btn-outline{background:transparent;color:var(--gold);border:1px solid rgba(255,215,0,.4)}
.btn-outline:hover{background:rgba(255,215,0,.1)}

.song-info{background:var(--bg2);border:1px solid var(--bd);border-radius:16px;padding:20px}
.song-info h3{font-size:12px;color:var(--t3);letter-spacing:1px;text-transform:uppercase;margin-bottom:14px}
.song-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:13px}
.song-row:last-child{border-bottom:none}
.song-lbl{color:var(--t3)}
.song-val{color:#fff;font-weight:600;text-align:right;max-width:60%}

.loading{text-align:center;padding:60px;color:var(--t3)}
.error{padding:20px;background:rgba(255,69,58,.1);border:1px solid rgba(255,69,58,.3);border-radius:12px;color:#FF453A;font-size:13px;margin:20px 0}

.footer{text-align:center;padding:40px 0;color:var(--t3);font-size:11px}
</style>

<link rel="stylesheet" href="/apple-theme.css?v=global-20261014" data-tl-global-theme="2026.10">
<style id="timelink-global-tlj">
:root{--bg:#09090d;--bg2:#14131b;--bg3:#1b1924;--gold:#f5b84b;--purple:#9b7bff;--mint:#f5b84b;--t1:#f5f4fa;--t2:#a4a2b2;--t3:#777586;--bd:rgba(255,255,255,.09);--fn:'DM Sans','Pretendard',sans-serif}
body{background:radial-gradient(900px 560px at 15% 0%,rgba(139,108,240,.14),transparent 62%),var(--bg);color:var(--t1);font-family:var(--fn);letter-spacing:-.02em}
.hdr{background:rgba(9,9,13,.92);border-bottom-color:var(--bd)}
.hdr-logo{background:linear-gradient(135deg,#c1aaff,#9270f4 65%,#f5b84b);-webkit-background-clip:text}
.dropzone{background:linear-gradient(135deg,rgba(155,123,255,.06),rgba(245,184,75,.025));border-color:rgba(155,123,255,.35)}
.dropzone:hover,.dropzone.drag{border-color:var(--purple);background:rgba(155,123,255,.08)}
.pick-btn,.btn-primary{background:linear-gradient(120deg,#c1aaff,#9270f4);color:#100d19}
.meta-card{background:linear-gradient(145deg,rgba(155,123,255,.07),rgba(245,184,75,.035));border-color:rgba(155,123,255,.25)}
.meta-hdr-text,.meta-val.mono{color:#cbbaff}
.btn-outline{color:#cbbaff;border-color:rgba(155,123,255,.35)}
.song-info,.img-panel{background:var(--bg2);border-color:var(--bd)}
@media(max-width:600px){.wrap{padding:24px 14px}.dropzone{margin:34px auto;padding:38px 20px}.meta-card{padding:20px}.actions{flex-direction:column}}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-logo">🏅 TimeLink</div>
  <div class="hdr-title">TLJ Viewer · Creator-rights Certificate</div>
</header>

<main class="wrap">

  <!-- 파일 선택 화면 -->
  <div id="dropZone" class="dropzone">
    <div class="dropzone-icon">📄</div>
    <div class="dropzone-title">Open a TLJ file</div>
    <div class="dropzone-sub">Drag a .tlj file here or choose one below</div>
    <button class="pick-btn" onclick="document.getElementById('fileInput').click()">📂 Choose file</button>
    <input type="file" id="fileInput" class="hidden-input" accept=".tlj,application/octet-stream">
  </div>

  <!-- 뷰어 화면 -->
  <div id="viewer" style="display:none">
    <div id="viewerContent"></div>
  </div>

  <div class="footer">
    TimeLink Digital Asset System · TLJ v3 Container
  </div>
</main>

<script>
// ═══════════════════════════════════════════
// TLJ 파서 (cert3.ts / certj.ts와 동일 규칙)
// MAGIC(4) + VERSION(1) + HLEN(4, BE) + HEADER_JSON + IMAGE
// ═══════════════════════════════════════════
function parseTLJ(data) {
  const MAGIC = [0x54, 0x4C, 0x4E, 0x4B]; // "TLNK"
  if (data.length < 9) throw new Error('The file is too small.');
  for (let i = 0; i < 4; i++) {
    if (data[i] !== MAGIC[i]) throw new Error('This is not a valid TLJ file (MAGIC mismatch).');
  }
  if (data[4] !== 0x03) throw new Error('This is not a TLJ v3 file.');
  const hlen = (data[5] << 24) | (data[6] << 16) | (data[7] << 8) | data[8];
  if (9 + hlen > data.length) throw new Error('Invalid header length.');
  const headerStr = new TextDecoder('utf-8').decode(data.slice(9, 9 + hlen));
  let header;
  try { header = JSON.parse(headerStr); } catch(e) { throw new Error('Unable to parse the header JSON.'); }
  const imageOffset = 9 + hlen;
  const imageBytes = data.slice(imageOffset);
  return { header, imageBytes, imageOffset };
}

// ═══════════════════════════════════════════
// 파일 로드
// ═══════════════════════════════════════════
const dropZone = document.getElementById('dropZone');
const viewer = document.getElementById('viewer');
const fileInput = document.getElementById('fileInput');

fileInput.addEventListener('change', e => {
  if (e.target.files[0]) loadFile(e.target.files[0]);
});

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('drag');
  if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
});

async function loadFile(file) {
  try {
    const buf = new Uint8Array(await file.arrayBuffer());
    const { header, imageBytes } = parseTLJ(buf);

    // 이미지 → Blob URL
    let imgUrl = '';
    if (imageBytes.length > 0) {
      const blob = new Blob([imageBytes], { type: 'image/png' });
      imgUrl = URL.createObjectURL(blob);
    }

    renderViewer(header, imgUrl, file.name, imageBytes.length);
    dropZone.style.display = 'none';
    viewer.style.display = 'block';
  } catch(e) {
    alert('Unable to load TLJ file: ' + e.message);
  }
}

function escH(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderViewer(h, imgUrl, filename, imgSize) {
  const snap = h.snapshot || {};
  const issueDate = h.issued_at ? new Date(h.issued_at).toLocaleString('en-US') : '—';
  const hashShort = h.cert_hash ? String(h.cert_hash).slice(0, 32) + '...' : '—';
  const imgKB = Math.round(imgSize / 1024);

  const html = `
    <div class="viewer">
      <div class="img-panel">
        ${imgUrl ? `<img src="${imgUrl}" alt="Certificate image">` : '<div class="error">No image found</div>'}
        <div class="badge">✓ TLJ v3 · Image · ${imgKB} KB</div>
      </div>

      <div class="meta-panel">
        <div class="meta-card">
          <div class="meta-hdr">
            <div class="meta-hdr-icon">🏅</div>
            <div>
              <div class="meta-hdr-text">TIMELINK DIGITAL ASSET</div>
              <div class="meta-hdr-sub">Creator-rights Certificate</div>
            </div>
            <div class="verified-badge">✓ VERIFIED</div>
          </div>

          <div class="meta-grid">
            <div class="meta-item">
              <div class="meta-lbl">Certificate Number</div>
              <div class="meta-val mono">${escH(h.cert_no || '—')}</div>
            </div>
            <div class="meta-item">
              <div class="meta-lbl">Asset ID</div>
              <div class="meta-val mono">${escH(h.asset_id || '—')}</div>
            </div>
            <div class="meta-item">
              <div class="meta-lbl">Issue Date</div>
              <div class="meta-val">${issueDate}</div>
            </div>
            <div class="meta-item">
              <div class="meta-lbl">Issuer</div>
              <div class="meta-val">${escH(h.issuer || '—')}</div>
            </div>
          </div>

          <div class="hash-box">🔐 cert_hash: ${hashShort}</div>

          <div class="actions">
            <button class="btn btn-primary" onclick="verifyCert('${escH(h.cert_no||'')}')">🔍 Verify</button>
            <button class="btn btn-outline" onclick="shareCert('${escH(h.cert_no||'')}')">🔗 Share</button>
          </div>
        </div>

        <div class="song-info">
          <h3>📀 Track Information</h3>
          <div class="song-row"><span class="song-lbl">Title</span><span class="song-val">${escH(snap.title || h.title || '—')}</span></div>
          <div class="song-row"><span class="song-lbl">Artist</span><span class="song-val">${escH(snap.artist || h.artist || '—')}</span></div>
          <div class="song-row"><span class="song-lbl">Genre</span><span class="song-val">${escH(snap.genre || h.genre || '—')}</span></div>
          <div class="song-row"><span class="song-lbl">Composer</span><span class="song-val">${escH(snap.composer || '—')}</span></div>
          <div class="song-row"><span class="song-lbl">Lyricist</span><span class="song-val">${escH(snap.lyricist || '—')}</span></div>
          <div class="song-row"><span class="song-lbl">Producer</span><span class="song-val">${escH(snap.producer || '—')}</span></div>
          <div class="song-row"><span class="song-lbl">Duration</span><span class="song-val">${snap.duration_sec ? Math.floor(snap.duration_sec/60) + ':' + String(Math.floor(snap.duration_sec%60)).padStart(2,'0') : '—'}</span></div>
          <div class="song-row"><span class="song-lbl">File Name</span><span class="song-val">${escH(filename)}</span></div>
        </div>
      </div>
    </div>
  `;

  document.getElementById('viewerContent').innerHTML = html;
}

// 검증
async function verifyCert(certNo) {
  if (!certNo) { alert('Certificate number is missing.'); return; }
  try {
    const r = await fetch('https://api.timelink.digital/api/v1/certs/' + certNo + '/verify');
    const d = await r.json();
    if (d.valid) {
      alert('✅ Verification successful\\n\\nCertificate: ' + certNo + '\\nHash matched\\n\\nVerified at: ' + new Date().toLocaleString('en-US'));
    } else {
      alert('⚠️ Verification failed\\n' + (d.error || 'Hash mismatch.'));
    }
  } catch(e) {
    alert('Verification error: ' + e.message);
  }
}

// 공유
function shareCert(certNo) {
  const url = 'https://timelink.digital/cert/' + certNo;
  if (navigator.share) {
    navigator.share({ title: 'Creator-rights Certificate', text: certNo, url: url }).catch(() => {});
  } else {
    navigator.clipboard.writeText(url).then(() => alert('Link copied:\\n' + url)).catch(() => prompt('Certificate link:', url));
  }
}
</script>
<script src="/sidebar.js?v=global-20261014"></script>
</body>
</html>
