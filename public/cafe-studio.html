<script>(function(){var l=localStorage.getItem('tl_lang')||((navigator.language||'ko').toLowerCase().startsWith('ko')?'ko':'en');function apply(v){l=String(v||'en').toLowerCase().startsWith('ko')?'ko':'en';document.documentElement.lang=l;document.querySelectorAll('[data-en][data-ko]').forEach(function(n){n.textContent=n.getAttribute('data-'+l);});}apply(l);window.addEventListener('tl-language-changed',function(e){apply(e.detail&&e.detail.lang);});})();
(async function(){var token=localStorage.getItem('tl_token')||'',user=null;try{user=JSON.parse(localStorage.getItem('tl_user')||'null')}catch(e){}if(!token||!user){location.replace('login.html');return;}var el=document.getElementById('status');try{var r=await fetch('https://api.timelink.digital/api/cafe/my-channels',{headers:{Authorization:'Bearer '+token}});var d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'카페 채널 확인 실패');var c=(d.channels||[])[0];if(!c){location.replace('cafe-channel.html');return;}localStorage.setItem('tl_cafe_channels',JSON.stringify(d.channels));function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(x){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]})}el.innerHTML='<h2>'+esc(c.name)+'</h2><div class="muted">인증된 카페 채널 · '+esc(c.channel_id)+'</div><div class="meta"><div><small>LOCATION</small><strong>'+esc(c.addr||'—')+'</strong></div><div><small>STATUS</small><strong>'+esc(c.status||'active')+'</strong></div><div><small>PLAN</small><strong>'+esc(c.plan||'—')+'</strong></div></div>';}catch(e){el.innerHTML='<div class="muted">'+String(e.message||e)+'</div>';}})();</script><script src="/sidebar.js?v=light-20261020"></script><script src="/i18n.js?v=20261015-nav-event"></script><script src="/_shared/footer.js" defer></script>
