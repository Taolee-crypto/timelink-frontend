</head><body><main class="wrap"><header class="head"><div class="eyebrow">TIMELINK · TL BROADCAST</div><h1 data-en="My Cafe Channel" data-ko="나의 카페방송">나의 카페방송</h1><p class="muted" data-en="Your verified cafe channel and broadcast operations." data-ko="인증된 카페 채널과 방송 운영 공간입니다.">인증된 카페 채널과 방송 운영 공간입니다.</p></header><section class="status" id="status"><div class="muted">카페 채널 정보를 확인하고 있습니다…</div></section><section id="staffPanel" style="margin:0 0 20px;padding:22px;border:1px solid #383044;border-radius:17px;background:#17151b"><div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap"><div><div style="font-size:17px;font-weight:800">👥 직원 방송 권한 관리</div><div style="margin-top:6px;color:#aaa5b3;font-size:12px;line-height:1.5">직원은 개인 TimeLink 계정으로 참여합니다. 대표자가 승인한 직원만 카페 방송을 운영할 수 있습니다.</div></div><button onclick="issueCafeStaffInvite()" style="border:0;border-radius:10px;padding:11px 16px;background:linear-gradient(135deg,#9b75fa,#7042d8);color:#fff;font-weight:800">직원 초대 코드 발급</button></div><div id="staffInviteInfo" style="margin-top:14px"></div><div id="staffMemberList" style="margin-top:14px;color:#aaa5b3;font-size:13px">직원 현황을 불러오는 중…</div></section><section class="actions"><a class="action primary" href="radio.html"><div class="ico">📻</div><h3 data-en="Central Broadcast" data-ko="중앙 방송국">중앙 방송국</h3><p data-en="Select a broadcast source and music channel." data-ko="방송 소스와 음악 채널을 선택합니다.">방송 소스와 음악 채널을 선택합니다.</p></a><a class="action" href="dj-center.html"><div class="ico">🎧</div><h3 data-en="DJ Center" data-ko="DJ 센터">DJ 센터</h3><p data-en="Choose DJs and manage live sessions." data-ko="DJ를 선택하고 라이브 세션을 운영합니다.">DJ를 선택하고 라이브 세션을 운영합니다.</p></a><a class="action" href="cafe-radio.html"><div class="ico">🎛️</div><h3 data-en="Cafe Broadcast Operations" data-ko="카페 방송 운영">카페 방송 운영</h3><p data-en="Manage your cafe broadcast, DJ contracts and sessions." data-ko="카페 방송과 DJ 계약 및 세션을 관리합니다.">카페 방송과 DJ 계약 및 세션을 관리합니다.</p></a></section></main>
<script>(function(){var l=localStorage.getItem('tl_lang')||((navigator.language||'ko').toLowerCase().startsWith('ko')?'ko':'en');function apply(v){l=String(v||'en').toLowerCase().startsWith('ko')?'ko':'en';document.documentElement.lang=l;document.querySelectorAll('[data-en][data-ko]').forEach(function(n){n.textContent=n.getAttribute('data-'+l);});}apply(l);window.addEventListener('tl-language-changed',function(e){apply(e.detail&&e.detail.lang);});})();
(async function(){var token=localStorage.getItem('tl_token')||'',user=null;try{user=JSON.parse(localStorage.getItem('tl_user')||'null')}catch(e){}if(!token||!user){location.replace('login.html');return;}var el=document.getElementById('status');try{var r=await fetch('https://api.timelink.digital/api/cafe/my-channels',{headers:{Authorization:'Bearer '+token}});var d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'카페 채널 확인 실패');var c=(d.channels||[])[0];if(!c){location.replace('cafe-channel.html');return;}localStorage.setItem('tl_cafe_channels',JSON.stringify(d.channels));function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(x){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]})}el.innerHTML='<h2>'+esc(c.name)+'</h2><div class="muted">인증된 카페 채널 · '+esc(c.channel_id)+'</div><div class="meta"><div><small>LOCATION</small><strong>'+esc(c.addr||'—')+'</strong></div><div><small>STATUS</small><strong>'+esc(c.status||'active')+'</strong></div><div><small>PLAN</small><strong>'+esc(c.plan||'—')+'</strong></div></div>';}catch(e){el.innerHTML='<div class="muted">'+String(e.message||e)+'</div>';}})();</script><script>
(function(){
var API='https://api.timelink.digital',token=localStorage.getItem('tl_token')||'',channelId='';
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(x){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]})}
async function initStaff(){
 if(!token)return;
 try{var r=await fetch(API+'/api/cafe/my-channels',{headers:{Authorization:'Bearer '+token}}),d=await r.json();if(!r.ok||!d.ok||!d.channels||!d.channels.length)return;channelId=String(d.channels[0].channel_id||'');await loadStaff();}
 catch(e){document.getElementById('staffMemberList').textContent='직원 정보를 불러오지 못했습니다.';}
}
async function loadStaff(){
 if(!channelId)return;
 var r=await fetch(API+'/api/cafe/channels/'+encodeURIComponent(channelId)+'/staff',{headers:{Authorization:'Bearer '+token}}),d=await r.json();
 if(!r.ok||!d.ok)throw new Error(d.error||'직원 목록 조회 실패');
 var rows=d.staff||[],el=document.getElementById('staffMemberList');
 if(!rows.length){el.innerHTML='<div style="padding:14px;border:1px dashed #494052;border-radius:11px">아직 등록된 직원이 없습니다. 초대 코드를 발급해 직원에게 전달하세요.</div>';return;}
 el.innerHTML=rows.map(function(m){var pending=m.status==='pending',active=m.status==='active';return '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 2px;border-bottom:1px solid #302b38;flex-wrap:wrap"><div><strong style="color:#f5f5f7">'+esc(m.username||m.email||('회원 #'+m.user_id))+'</strong><div style="font-size:11px;color:#9995a3;margin-top:4px">'+esc(m.email||'')+' · '+(pending?'승인 대기':active?'방송 운영 승인':'권한 해제')+'</div></div><div style="display:flex;gap:7px">'+(pending?'<button onclick="approveCafeStaff('+Number(m.id)+')" style="padding:8px 12px;border:0;border-radius:8px;background:#8b5cf6;color:white;font-weight:700">승인</button>':'')+(active?'<button onclick="revokeCafeStaff('+Number(m.id)+')" style="padding:8px 12px;border:1px solid #51465f;border-radius:8px;background:transparent;color:#e5dff0">권한 해제</button>':'')+'</div></div>';}).join('');
}
window.issueCafeStaffInvite=async function(){var el=document.getElementById('staffInviteInfo');try{var r=await fetch(API+'/api/cafe/channels/'+encodeURIComponent(channelId)+'/staff/invites',{method:'POST',headers:{Authorization:'Bearer '+token}}),d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'초대 코드 발급 실패');var joinUrl=location.origin+'/cafe-staff.html?channel_id='+encodeURIComponent(channelId);el.innerHTML='<div style="padding:15px;border:1px solid #5a477d;border-radius:12px;background:#211a2b"><div style="font-size:11px;color:#c4b5fd;font-weight:800">직원 초대 코드 · 7일 유효 · 최대 10회</div><div style="font-size:26px;font-weight:900;letter-spacing:.18em;margin:8px 0;color:#fff">'+esc(d.invite_code)+'</div><div style="font-size:12px;color:#bcb4c8">채널 ID: '+esc(channelId)+'</div><div style="font-size:12px;color:#bcb4c8;word-break:break-all;margin-top:5px">'+esc(joinUrl)+'</div><button onclick="navigator.clipboard&&navigator.clipboard.writeText('+JSON.stringify(d.invite_code)+')" style="margin-top:11px;padding:8px 12px;border:1px solid #75608f;border-radius:8px;background:#302440;color:#fff">코드 복사</button></div>';}catch(e){el.textContent=e.message||'초대 코드 발급 실패';}};
window.approveCafeStaff=async function(id){try{var r=await fetch(API+'/api/cafe/channels/'+encodeURIComponent(channelId)+'/staff/'+id+'/approve',{method:'POST',headers:{Authorization:'Bearer '+token}}),d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'승인 실패');await loadStaff();}catch(e){alert(e.message||'승인 실패');}};
window.revokeCafeStaff=async function(id){if(!confirm('이 직원의 카페 방송 권한을 해제할까요?'))return;try{var r=await fetch(API+'/api/cafe/channels/'+encodeURIComponent(channelId)+'/staff/'+id,{method:'DELETE',headers:{Authorization:'Bearer '+token}}),d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'권한 해제 실패');await loadStaff();}catch(e){alert(e.message||'권한 해제 실패');}};
initStaff();
})();
</script><script src="/sidebar.js?v=restore-apple-20261020"></script><script src="/i18n.js?v=20261015-nav-event"></script><script src="/_shared/footer.js" defer></script>
