<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>카페 꾸미기 · TimeLink</title><script src="/renewal/renewal.js?v=20261026compact1"></script><link rel="stylesheet" href="/cafe/space.css?v=20261031decor"><script src="/cafe/decor.js?v=20261031" defer></script><script src="/cafe/space.js?v=20261031decor" defer></script></head><body class="cafe-space" data-cafe-editor><main><header class="cafe-top"><a href="/my-cafe.html">← 나의 카페</a><h1>카페 꾸미기</h1><a id="publicLink" hidden>내 카페 보기 ↗</a></header><div class="cafe-workspace"><article class="cafe-preview"><figure class="cafe-cover"><img id="cafeCover" src="/images/renewal/cafe-interior.jpg" alt="카페 소개용 대표 사진"><figcaption id="photoNote">소개용 이미지</figcaption></figure><div class="cafe-story"><h2 id="cafeName">나의 카페</h2><p class="cafe-location" id="cafeLocation"></p><p class="cafe-description" id="cafeDescription"></p></div><section class="cafe-listen"><h3>방송 듣기</h3><nav aria-label="방송 듣기"><a class="cafe-button primary" href="/radio.html?autojoin=1">중앙방송</a></nav></section><div class="cafe-album" id="cafeAlbum"></div><div id="cafeExtras"></div></article><form class="cafe-editor" id="cafeForm"><h2>내 카페의 모습</h2><fieldset id="editorFields" disabled style="border:0;margin:0;padding:0;min-width:0"><label id="cafeSelectLabel" hidden>카페 선택<select id="cafeSelect"></select></label><label>카페 이름<input id="nameInput" maxlength="100" required autocomplete="organization"></label><label>소개글<textarea id="descriptionInput" maxlength="1500" placeholder="우리 카페의 이야기를 적어주세요."></textarea></label><label>카페 사진<input id="photoInput" type="file" accept="image/jpeg,image/png,image/webp" multiple><small>최대 6장 · 첫 번째 사진이 대표 사진입니다.</small></label><div class="cafe-photos" id="photoEditor"></div><section class="cafe-extra-edit" id="decorEditor">
<h3>매장의 개성을 더하세요</h3>
<p class="cafe-editor-help">여기서 꾸민 모습이 카페 월드의 내 매장 페이지에 표시됩니다. 지점별로 독립 저장됩니다.</p>
<label>한 줄 소개<input id="decorTagline" maxlength="120" placeholder="커피 한 잔과 음악이 만드는 작은 쉼표"></label>
<label>공개 연락처<input id="decorPhone" maxlength="32" type="tel" placeholder="매장에 공개할 전화번호"></label>
<label>공개 홈페이지<input id="decorWebsite" maxlength="300" type="url" placeholder="https://example.com"></label>
<label>카페 색상 테마<select id="decorTheme"><option value="sand">따뜻한 샌드</option><option value="forest">차분한 포레스트</option><option value="plum">감성적인 플럼</option><option value="ocean">청량한 오션</option></select></label>
<h3>영업시간</h3><p class="cafe-editor-help">공개할 요일만 선택하세요. 시간은 실제 매장 영업시간을 입력하세요.</p>
<div class="decor-hours"><div class="decor-hour-row" data-day="mon"><label class="decor-hour-check"><input type="checkbox" data-hour-enabled> 월요일 표시</label><input type="time" data-hour-open value="09:00" aria-label="월요일 여는 시간"><span>~</span><input type="time" data-hour-close value="18:00" aria-label="월요일 닫는 시간"><label class="decor-hour-check"><input type="checkbox" data-hour-closed> 휴무</label></div><div class="decor-hour-row" data-day="tue"><label class="decor-hour-check"><input type="checkbox" data-hour-enabled> 화요일 표시</label><input type="time" data-hour-open value="09:00" aria-label="화요일 여는 시간"><span>~</span><input type="time" data-hour-close value="18:00" aria-label="화요일 닫는 시간"><label class="decor-hour-check"><input type="checkbox" data-hour-closed> 휴무</label></div><div class="decor-hour-row" data-day="wed"><label class="decor-hour-check"><input type="checkbox" data-hour-enabled> 수요일 표시</label><input type="time" data-hour-open value="09:00" aria-label="수요일 여는 시간"><span>~</span><input type="time" data-hour-close value="18:00" aria-label="수요일 닫는 시간"><label class="decor-hour-check"><input type="checkbox" data-hour-closed> 휴무</label></div><div class="decor-hour-row" data-day="thu"><label class="decor-hour-check"><input type="checkbox" data-hour-enabled> 목요일 표시</label><input type="time" data-hour-open value="09:00" aria-label="목요일 여는 시간"><span>~</span><input type="time" data-hour-close value="18:00" aria-label="목요일 닫는 시간"><label class="decor-hour-check"><input type="checkbox" data-hour-closed> 휴무</label></div><div class="decor-hour-row" data-day="fri"><label class="decor-hour-check"><input type="checkbox" data-hour-enabled> 금요일 표시</label><input type="time" data-hour-open value="09:00" aria-label="금요일 여는 시간"><span>~</span><input type="time" data-hour-close value="18:00" aria-label="금요일 닫는 시간"><label class="decor-hour-check"><input type="checkbox" data-hour-closed> 휴무</label></div><div class="decor-hour-row" data-day="sat"><label class="decor-hour-check"><input type="checkbox" data-hour-enabled> 토요일 표시</label><input type="time" data-hour-open value="09:00" aria-label="토요일 여는 시간"><span>~</span><input type="time" data-hour-close value="18:00" aria-label="토요일 닫는 시간"><label class="decor-hour-check"><input type="checkbox" data-hour-closed> 휴무</label></div><div class="decor-hour-row" data-day="sun"><label class="decor-hour-check"><input type="checkbox" data-hour-enabled> 일요일 표시</label><input type="time" data-hour-open value="09:00" aria-label="일요일 여는 시간"><span>~</span><input type="time" data-hour-close value="18:00" aria-label="일요일 닫는 시간"><label class="decor-hour-check"><input type="checkbox" data-hour-closed> 휴무</label></div></div>
<h3>매장 편의시설</h3>
<div class="decor-amenities"><label><input type="checkbox" data-amenity value="wifi"> 와이파이</label><label><input type="checkbox" data-amenity value="parking"> 주차</label><label><input type="checkbox" data-amenity value="pets"> 반려동물 동반</label><label><input type="checkbox" data-amenity value="takeout"> 포장</label><label><input type="checkbox" data-amenity value="terrace"> 테라스</label><label><input type="checkbox" data-amenity value="outlets"> 콘센트</label><label><input type="checkbox" data-amenity value="accessible"> 휠체어 접근</label><label><input type="checkbox" data-amenity value="delivery"> 배달</label></div>
<h3>대표 메뉴 소개</h3><p class="cafe-editor-help">최대 8개 · 가격은 안내용 문구이며 결제 금액과 무관합니다.</p>
<div id="decorMenuRows" class="decor-menu-rows"></div><button type="button" class="cafe-button" id="decorAddMenu">+ 대표 메뉴 추가</button>
</section><button class="cafe-button primary cafe-save" id="saveButton" type="submit">변경 저장</button></fieldset><p class="cafe-feedback" id="cafeFeedback" role="status" aria-live="polite">카페를 불러오는 중입니다.</p><a id="setupLink" class="cafe-button" href="/cafe-channel.html" hidden>카페 개설하기</a></form></div></main><script src="/sidebar.js?v=20261029-account-navigation-v2"></script></body></html>
