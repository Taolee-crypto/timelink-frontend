<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>카페 · TimeLink</title><script src="/renewal/renewal.js?v=20261026compact1"></script><link rel="stylesheet" href="/cafe/space.css?v=20261031decor"><script src="/cafe/decor.js?v=20261031"></script></head><body class="cafe-space"><main class="cafe-public"><header class="cafe-top"><a href="/cafe-world.html">← 스토어월드</a></header><p id="status" role="status">카페를 불러오는 중입니다.</p><article id="cafeContent" hidden><figure class="cafe-cover"><img id="cafeCover" src="/images/renewal/cafe-interior.jpg" alt="카페 소개용 대표 사진"><figcaption id="photoNote">소개용 이미지</figcaption></figure><div class="cafe-story"><h1 id="cafeName" style="font-size:26px;font-weight:550;letter-spacing:-.04em;margin:0 0 9px;overflow-wrap:anywhere"></h1><p class="cafe-location" id="cafeLocation"></p><p class="cafe-description" id="cafeDescription"></p></div><section class="cafe-listen"><h3>방송 듣기</h3><nav aria-label="방송 듣기"><a class="cafe-button primary" href="/radio.html?autojoin=1">중앙방송</a></nav></section><div class="cafe-album" id="cafeAlbum"></div><div id="cafeExtras"></div></article></main><script>
(async()=>{const $=id=>document.getElementById(id),id=new URLSearchParams(location.search).get('id');function safeImage(value){const s=String(value||'');if(/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(s))return s;try{const u=new URL(s,location.origin);return u.protocol==='https:'||u.origin===location.origin?u.href:''}catch{return ''}}try{if(!id)throw Error('카페를 선택해 주세요.');const r=await fetch((window.TL3_API_BASE||'https://api.timelink.digital')+'/api/cafe/channels/'+encodeURIComponent(id),{cache:'no-store'}),d=await r.json();if(!r.ok||!d.ok||!d.channel||d.channel.status!=='active')throw Error('카페를 불러오지 못했습니다.');const c=d.channel;let photos=[];try{photos=(Array.isArray(c.images)?c.images:JSON.parse(c.images||'[]')).map(safeImage).filter(Boolean).slice(0,6)}catch{}$('cafeName').textContent=c.name||'카페';document.title=(c.name||'카페')+' · TimeLink';$('cafeLocation').textContent=c.addr||'';$('cafeDescription').textContent=c.description||'';if(photos[0]){$('cafeCover').src=photos[0];$('cafeCover').alt='카페 대표 사진';$('photoNote').hidden=true}photos.slice(1).forEach(src=>{const img=new Image();img.src=src;img.alt='카페 사진';img.loading='lazy';$('cafeAlbum').append(img)});const profile=window.TiloCafeDecor?.read(c.profile_json)||{};window.TiloCafeDecor?.applyTheme(document.body,profile);window.TiloCafeDecor?.render($('cafeExtras'),profile);$('cafeContent').hidden=false;$('status').textContent=''}catch(error){$('status').textContent=error.message}})();
</script><script src="/channel-community.js" defer></script><script src="/sidebar.js?v=20261029-account-navigation-v2"></script></body></html>
