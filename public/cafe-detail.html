<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cafe | TimeLink</title>
<link rel="stylesheet" href="/apple-theme.css"><link rel="stylesheet" href="/wallet-design-system.css">
<style>body{background:#0a0a0e;color:#f5f5f7;font-family:Inter,Pretendard,"Noto Sans KR",sans-serif;margin:0}.detail{max-width:960px;margin:36px auto;padding:0 20px 80px}.back{color:#c3a9ff;text-decoration:none}.hero{margin-top:20px;min-height:230px;border-radius:18px;background:linear-gradient(135deg,#2b2537,#111116);overflow:hidden}.hero img{width:100%;height:320px;object-fit:cover}.panel{padding:25px;background:#17151d;border:1px solid #302a3b;border-radius:16px;margin-top:20px}.muted{color:#aaa5b7;line-height:1.7}.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}.photos img{width:100%;height:145px;object-fit:cover;border-radius:12px}h1{font-size:30px}h2{font-size:19px}.status{color:#e6c5ff}</style><script src="/_shared/topbar-v2.js"></script></head><body>
<main class="detail"><a class="back" href="/cafe-world.html" id="back">← 카페월드</a><div id="content" class="panel" aria-live="polite">카페 정보를 불러오는 중입니다…</div></main>
<script>
const API='https://api.timelink.digital';const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function parse(v){try{const a=Array.isArray(v)?v:JSON.parse(v||'[]');return Array.isArray(a)?a:[];}catch{return [];}}
const tr={ko:['← 카페월드','매장 정보','사진','방송 채널','등록된 방송 채널','채널 정보를 불러오지 못했습니다.'],en:['← Cafe World','About','Photos','Broadcast channel','Registered broadcast channel','Could not load cafe.'],ja:['← カフェワールド','店舗情報','写真','放送チャンネル','登録済みチャンネル','カフェを読み込めません。'],zh:['← 咖啡世界','店铺信息','照片','广播频道','已注册频道','无法加载咖啡馆。'],th:['← โลกคาเฟ่','ข้อมูลร้าน','รูปภาพ','ช่องออกอากาศ','ช่องที่ลงทะเบียน','ไม่สามารถโหลดคาเฟ่ได้'],vi:['← Thế giới cà phê','Thông tin quán','Hình ảnh','Kênh phát sóng','Kênh đã đăng ký','Không thể tải quán cà phê']};
let lang='ko',cafe=null;function apply(v){lang=String(v||'ko').toLowerCase().split('-')[0];if(!tr[lang])lang='en';document.documentElement.lang=lang;$('back').textContent=tr[lang][0];render();}
function render(){if(!cafe)return;const c=cafe,imgs=parse(c.images);$('content').outerHTML='<div id="content"><div class="hero">'+(imgs[0]?'<img src="'+esc(imgs[0])+'" alt="'+esc(c.name)+'">':'')+'</div><div class="panel"><h1>'+esc(c.name)+'</h1><p class="muted">'+esc(c.country||'')+' · '+esc(c.addr||'')+'</p><h2>'+tr[lang][1]+'</h2><p class="muted">'+esc(c.description||'')+'</p></div><div class="panel"><h2>'+tr[lang][3]+'</h2><p class="status">'+tr[lang][4]+'</p></div>'+(imgs.length?'<div class="panel"><h2>'+tr[lang][2]+'</h2><div class="photos">'+imgs.map(url=>'<img loading="lazy" src="'+esc(url)+'" alt="'+esc(c.name)+'">').join('')+'</div></div>':'')+'</div>';}
async function load(){const id=new URLSearchParams(location.search).get('id');if(!id){$('content').textContent=tr[lang][5];return;}try{const r=await fetch(API+'/api/cafe/channels/'+encodeURIComponent(id));const d=await r.json();if(!r.ok||!d.ok||!d.channel||d.channel.status!=='active')throw Error('Unavailable');cafe=d.channel;render();}catch(e){$('content').textContent=tr[lang][5];}}
window.addEventListener('tl-language-changed',e=>apply(e.detail?.lang||localStorage.getItem('tl_lang')));apply(localStorage.getItem('tl_lang')||navigator.language);load();
</script><script src="/sidebar.js"></script><script src="/i18n.js"></script><script src="/_shared/footer.js" defer></script><script src="/channel-community.js" defer></script></body></html>
