<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>커뮤니티 신고 검토 | TimeLink</title><link rel="stylesheet" href="/apple-theme.css"><link rel="stylesheet" href="/wallet-design-system.css"><style>main{max-width:960px;padding:24px;margin:auto}article{padding:24px;border:1px solid #45404d;border-radius:12px;margin:16px 0}button{padding:10px;margin-right:10px}</style></head><body><main><a href="/admin.html">← 관리자 콘솔</a><h1>커뮤니티 신고 검토</h1><p id="status" role="status"></p><div id="reports"></div></main><script>
const base='https://api.timelink.digital/api/v5/community/moderation/reports',headers=()=>({'Content-Type':'application/json',Authorization:'Bearer '+(localStorage.getItem('tl_adm_token')||localStorage.getItem('tl_token')||'')});
async function load(){const status=document.getElementById('status'),root=document.getElementById('reports');try{const r=await fetch(base,{headers:headers(),cache:'no-store'}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'조회 실패');root.replaceChildren();status.textContent=d.reports.length?'검토 대기 '+d.reports.length+'건':'검토 대기 신고가 없습니다.';for(const report of d.reports){const card=document.createElement('article'),label=document.createElement('h2'),body=document.createElement('p'),reason=document.createElement('p'),link=document.createElement('a');label.textContent=report.kind+' · '+report.channel_id;body.textContent=report.body;reason.textContent='신고 사유: '+report.reason;link.textContent='원문 페이지';link.href=(report.kind==='cafe'?'/cafe-detail.html':'/car-detail.html')+'?id='+encodeURIComponent(report.channel_id);card.append(label,body,reason,link);for(const [action,name] of [['hide','댓글 숨김'],['dismiss','신고 기각']]){const btn=document.createElement('button');btn.textContent=name;btn.onclick=async()=>{btn.disabled=true;try{const res=await fetch(base+'/'+encodeURIComponent(report.id),{method:'POST',headers:headers(),body:JSON.stringify({action})}),data=await res.json();if(!res.ok||!data.ok)throw Error(data.error||'처리 실패');await load();}catch(e){status.textContent=e.message;btn.disabled=false;}};card.append(btn);}root.append(card);}}catch(e){status.textContent=e.message;}}
load();
</script></body></html>
