<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>카페 직원 등록 | TimeLink</title><link rel="stylesheet" href="/apple-theme.css?v=restore-apple-20261020"><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0a0a0a;color:#f5f5f7;font-family:Pretendard,Inter,"Noto Sans KR",sans-serif;display:grid;place-items:center;padding:20px}.wrap{width:min(100%,540px)}.eyebrow{font-size:11px;color:#c4b5fd;font-weight:800;letter-spacing:.16em}.panel{margin-top:14px;padding:28px;border-radius:20px;border:1px solid #332b40;background:#17151c}.panel h1{font-size:26px;margin:0 0 9px}.muted{color:#aaa5b3;font-size:13px;line-height:1.6}.field{margin-top:19px}.field label{display:block;font-size:12px;color:#c7c2cf;margin-bottom:7px}.field input{width:100%;padding:14px;border-radius:11px;border:1px solid #494052;background:#0f0e12;color:#fff;font:inherit;font-size:15px;outline:none}.field input:focus{border-color:#8b5cf6}.btn{width:100%;margin-top:20px;padding:15px;border:0;border-radius:11px;background:linear-gradient(135deg,#9b75fa,#7042d8);color:#fff;font-size:15px;font-weight:800;cursor:pointer}.status{display:none;margin-top:18px;padding:14px;border:1px solid #40364f;border-radius:11px;background:#100e14;color:#d8d0e5;font-size:13px;line-height:1.6}.status.show{display:block}.back{display:inline-block;margin-top:17px;color:#b9a3ed;text-decoration:none;font-size:13px}@media(max-width:480px){.panel{padding:21px}}
</style></head><body><main class="wrap"><div class="eyebrow">TIMELINK · STAFF ACCESS</div><section class="panel"><h1>카페 직원으로 참여하기</h1><p class="muted">대표자에게 받은 카페 채널 ID와 초대 코드를 입력하세요. 요청 후 대표자가 승인하면 해당 카페 방송을 운영할 수 있습니다.</p><div class="field"><label for="channelId">카페 채널 ID</label><input id="channelId" autocomplete="off" placeholder="예: mycafe01"></div><div class="field"><label for="inviteCode">대표자 초대 코드 (8자리)</label><input id="inviteCode" maxlength="8" autocomplete="one-time-code" placeholder="ABCD2345" style="text-transform:uppercase;letter-spacing:.16em"></div><button class="btn" id="joinBtn" onclick="joinCafe()">직원 등록 요청</button><div class="status" id="status"></div><a class="back" href="cafe-access.html">← 카페 채널 안내로 돌아가기</a></section></main><script>
var API='https://api.timelink.digital';
(function(){var t=localStorage.getItem('tl_token')||'';if(!t){location.replace('login.html?redirect=cafe-staff.html');return;}var q=new URLSearchParams(location.search);if(q.get('channel_id'))document.getElementById('channelId').value=q.get('channel_id');})();
function show(msg){var e=document.getElementById('status');e.textContent=msg;e.classList.add('show');}
async function joinCafe(){var token=localStorage.getItem('tl_token')||'',channel=document.getElementById('channelId').value.trim().toLowerCase(),code=document.getElementById('inviteCode').value.trim().toUpperCase();if(!token){location.href='login.html?redirect=cafe-staff.html';return;}if(!channel||!/^[A-Z0-9]{8}$/.test(code)){show('채널 ID와 8자리 초대 코드를 정확히 입력해주세요.');return;}var btn=document.getElementById('joinBtn');btn.disabled=true;btn.textContent='요청 중…';try{var r=await fetch(API+'/api/cafe/staff/join',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({channel_id:channel,invite_code:code})});var d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'직원 등록 요청에 실패했습니다.');show(d.message||'대표자의 승인을 기다리고 있습니다.');if(d.staff_status==='active'){var a=document.createElement('a');a.href='cafe-radio.html?channel_id='+encodeURIComponent(channel);a.textContent='카페 방송 운영 열기';a.className='back';document.getElementById('status').appendChild(document.createElement('br'));document.getElementById('status').appendChild(a);}}catch(e){show(e.message||'요청에 실패했습니다.');}finally{btn.disabled=false;btn.textContent='직원 등록 요청';}}
document.getElementById('inviteCode').addEventListener('input',function(){this.value=this.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8);});
</script><script src="/i18n.js?v=20261015"></script></body></html>
