<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TILO 매장 방송 결제 완료</title></head><body style="background:#101827;color:#fff;font:16px system-ui;padding:32px"><main style="max-width:620px;margin:auto"><h1>매장 방송 시간 결제 확인</h1><p id="status">결제 승인 및 매장 방송 시간 충전 확인 중입니다…</p><a href="/tilo-store-plans.html" style="color:#f4ce73">매장 이용권으로 돌아가기</a></main><script>(async()=>{const el=document.getElementById('status');const q=new URLSearchParams(location.search),orderId=q.get('orderId'),paymentKey=q.get('paymentKey'),amount=Number(q.get('amount'));if(!orderId||!paymentKey||!Number.isSafeInteger(amount)||amount<=0){el.textContent='결제 정보가 올바르지 않습니다.';return}try{const token=localStorage.getItem('tl_token')||'';const r=await fetch('https://api.timelink.digital/api/payment/v5/commercial-time/toss/confirm',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({orderId,paymentKey,amount})});const data=await r.json();if(!r.ok||!data.ok)throw Error(data.error||'승인 실패');el.textContent='결제 승인 완료 · 매장 방송 시간 '+Number(data.seconds/3600).toLocaleString('ko-KR')+'시간 충전되었습니다.';history.replaceState(null,'',location.pathname)}catch(e){el.textContent='결제 확인이 완료되지 않았습니다. '+e.message+' · 결제 내역을 확인해 주세요.'}})();</script></body></html>
