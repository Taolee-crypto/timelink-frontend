<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TILO STORE · 매장 방송 결제 확인</title>
<style>body{margin:0;background:#0d1423;color:#f6f7fb;font:16px/1.8 system-ui,'Noto Sans KR',sans-serif}main{max-width:650px;margin:9vh auto;padding:32px;border:1px solid #42577e;border-radius:20px;background:#172239}h1{font-size:26px}a{color:#ffdb80}#status{font-size:18px}small{color:#bec8d9}</style></head>
<body><main><h1>매장 방송 시간 결제·충전 확인</h1>
<p id="status" role="status" aria-live="polite">토스 결제 승인 결과를 확인하고 매장 방송 시간을 충전하고 있습니다.</p>
<p id="balance"></p>
<p><a href="/tilo-store-plans.html">매장 방송 이용권</a> · <a href="/store-music-programming.html">매장 음악 편성</a></p>
<small>이 화면은 토스 테스트 결제를 처리합니다. 실제 현금 청구 여부는 토스 결제 환경에 따릅니다.</small></main>
<script>
(async()=>{
 const status=document.getElementById('status'),balance=document.getElementById('balance');
 const params=new URLSearchParams(location.search);
 const orderId=params.get('orderId')||'',paymentKey=params.get('paymentKey')||'',amount=Number(params.get('amount'));
 if(!/^v5store_[a-f0-9]{32}$/.test(orderId)||!paymentKey||!Number.isSafeInteger(amount)||amount<1000){status.textContent='결제 승인 정보를 확인할 수 없습니다.';return;}
 const token=localStorage.getItem('tl_token')||localStorage.getItem('token')||localStorage.getItem('access_token')||'';
 if(!token){status.textContent='로그인 정보가 없습니다. 동일한 계정으로 로그인한 뒤 결제 내역을 확인하세요.';return;}
 try{
  const response=await fetch('https://api.timelink.digital/api/payment/v5/commercial-time/toss/confirm',{
   method:'POST',headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},
   body:JSON.stringify({orderId,paymentKey,amount})
  });
  const result=await response.json().catch(()=>({}));
  if(!response.ok||!result.ok)throw Error(result.error||'결제 승인 실패');
  if(!Number.isSafeInteger(Number(result.seconds))||Number(result.seconds)<1)throw Error('충전 내역 확인 실패');
  status.textContent='토스 테스트 결제 승인 완료 · 매장 방송 시간 '+(Number(result.seconds)/3600).toLocaleString('ko-KR')+'시간 충전';
  history.replaceState(null,'',location.pathname);
  const balanceResponse=await fetch('https://api.timelink.digital/api/payment/v5/commercial-time/balance?channel_id='+encodeURIComponent(result.channelId),{headers:{'Authorization':'Bearer '+token}});
  const count=await balanceResponse.json().catch(()=>({}));
  if(balanceResponse.ok&&count.ok)balance.textContent='해당 매장 이용 가능 방송 시간: '+(Number(count.remainingSeconds)/3600).toLocaleString('ko-KR')+'시간';
 }catch(error){status.textContent='결제 승인 및 충전 확인 실패: '+(error?.message||'확인 불가')+' · 결제 내역을 확인한 후 지원을 요청해 주세요.';}
})();
</script></body></html>
