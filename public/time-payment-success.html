<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>시간 구매 결제 확인 | TimeLink</title><style>body{font-family:system-ui;background:#10101c;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0}.panel{background:#202035;border-radius:20px;padding:30px;max-width:440px;width:90%;text-align:center}a{color:#bda5ff}</style></head><body><main class="panel"><h2 id="status">토스 결제 승인 확인 중…</h2><p id="detail">잠시 기다려 주세요.</p><a href="/shareplace.html">공유플레이스로 돌아가기</a></main><script>(async()=>{const status=document.getElementById('status'),detail=document.getElementById('detail');try{const q=new URLSearchParams(location.search),orderId=q.get('orderId'),paymentKey=q.get('paymentKey'),amount=Number(q.get('amount'));const pending=JSON.parse(sessionStorage.getItem('tl_time_toss_pending')||'null');if(!pending||pending.orderId!==orderId||pending.amount!==amount||!paymentKey)throw Error('주문 정보가 일치하지 않습니다.');const token=localStorage.getItem('tl_token')||'';if(!token)throw Error('로그인 정보가 없습니다.');const response=await fetch('https://api.timelink.digital/api/payment/v5/shareplace-time/toss/confirm',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({orderId,paymentKey,amount})});const data=await response.json();if(!response.ok||!data.ok)throw Error(data.error||'결제 승인 실패');sessionStorage.removeItem('tl_time_toss_pending');status.textContent='✅ 토스 테스트 결제 승인 완료';detail.textContent='결제금액 '+Number(data.amount).toLocaleString('ko-KR')+'원 · 구매 시간 '+Number(data.seconds).toLocaleString('ko-KR')+'초. TIME FREE 이용권이 적용되었습니다. 모든 곡을 들을 수 있으며 TL 차감·보상 없이 청취 기여만 반영됩니다.';}catch(e){status.textContent='결제 확인이 필요합니다';detail.textContent=e.message+' 결제 승인이 확인되지 않았다면 재결제하지 말고 관리자에게 문의하세요.';}})();</script></body></html>
