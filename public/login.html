<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="TimeLink에 로그인하고 TL로 콘텐츠를 즐기세요.">
<meta property="og:title" content="로그인 — TimeLink">
<meta property="og:description" content="TimeLink에 로그인하고 TL로 콘텐츠를 즐기세요.">
<meta property="og:image" content="https://www.timelink.digital/og-image.png">
<meta property="og:url" content="https://www.timelink.digital/login.html">
<title>로그인 — TimeLink</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="/apple-theme.css">
<style>
body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
.card{
  width:100%;max-width:420px;
  background:var(--card);
  border:1px solid var(--bd);
  border-radius:24px;
  padding:44px 36px;
}
.card-logo{
  display:flex;align-items:center;justify-content:center;gap:10px;
  margin-bottom:36px;text-decoration:none;
}
.logo-text{
  font-size:22px;font-weight:700;letter-spacing:-.03em;
  color:var(--t1);
}
.card-title{
  font-size:26px;font-weight:700;text-align:center;
  margin-bottom:8px;letter-spacing:-.025em;
}
.card-sub{
  font-size:14px;color:var(--t2);text-align:center;
  margin-bottom:32px;line-height:1.5;
}
.form-group{margin-bottom:16px}
.form-label{
  display:block;font-size:12px;font-weight:500;
  color:var(--t2);margin-bottom:8px;
}
.forgot{
  text-align:right;margin:-8px 0 20px;
}
.forgot a{
  font-size:13px;color:var(--t3);
  text-decoration:none;transition:color .2s;
}
.forgot a:hover{color:var(--accent)}
.btn-login{
  width:100%;padding:14px;border-radius:12px;
  border:none;background:var(--accent);color:#fff;
  font-size:15px;font-weight:600;font-family:var(--fn);
  cursor:pointer;transition:all .2s;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn-login:hover{background:var(--accent-hover);transform:translateY(-1px)}
.btn-login:disabled{opacity:.5;transform:none;cursor:not-allowed}
.divider{
  display:flex;align-items:center;gap:14px;
  margin:24px 0;color:var(--t3);font-size:12px;
}
.divider::before,.divider::after{
  content:'';flex:1;height:1px;background:var(--bd);
}
.btn-ton{
  width:100%;padding:13px;border-radius:12px;
  border:1px solid var(--bd2);background:var(--card2);
  color:var(--t1);font-size:14px;font-weight:500;
  font-family:var(--fn);cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:all .2s;
}
.btn-ton:hover{background:var(--card3);border-color:var(--bd3)}
.btn-ton.connected{
  background:rgba(0,113,227,.12);
  border-color:var(--accent);color:var(--accent);
}
.card-footer{
  text-align:center;margin-top:24px;
  font-size:13px;color:var(--t3);
}
.card-footer a{
  color:var(--accent);text-decoration:none;font-weight:600;
}
.card-footer a:hover{color:var(--accent-hover)}
.spin{
  width:16px;height:16px;border:2px solid rgba(255,255,255,.3);
  border-top-color:#fff;border-radius:50%;
  animation:sp .7s linear infinite;display:inline-block;
}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="tl-toast-box" id="toast-box"></div>

<div class="card">
  <a href="/" class="card-logo">
    <span class="logo-text">TimeLink</span>
  </a>
  <div class="card-title">다시 오셨군요</div>
  <div class="card-sub">계속 Pulse를 쌓아보세요</div>

  <div class="form-group">
    <label class="form-label">이메일</label>
    <input type="email" id="email" class="tl-input" placeholder="이메일 주소 입력" autocomplete="email">
  </div>
  <div class="form-group">
    <label class="form-label">비밀번호</label>
    <input type="password" id="pw" class="tl-input" placeholder="비밀번호 입력" autocomplete="current-password">
  </div>
  <div class="forgot"><a href="#">비밀번호를 잊으셨나요?</a></div>
  <button class="btn-login" id="login-btn" onclick="doLogin()">로그인</button>
  <div class="divider">또는</div>
  <button class="btn-ton" id="ton-btn" onclick="doTonConnect()">
    <svg width="18" height="18" viewBox="0 0 56 56" fill="none"><circle cx="28" cy="28" r="28" fill="#0098EA"/><path d="M37.5603 15.6277H18.4386C14.9228 15.6277 12.6944 19.4202 14.4632 22.4861L26.2644 43.2496C27.0345 44.5793 28.9644 44.5793 29.7345 43.2496L41.5381 22.4861C43.3045 19.4251 41.0761 15.6277 37.5603 15.6277Z" fill="white"/><path d="M37.5603 15.6277H28V44.5793C28.3951 44.5793 28.7902 44.3963 29.0133 44.0278L41.5381 22.4861C43.3045 19.4251 41.0761 15.6277 37.5603 15.6277Z" fill="rgba(255,255,255,0.6)"/></svg>
    <span id="ton-btn-text">TON Wallet 연결</span>
  </button>
  <div class="card-footer">계정이 없으신가요? <a href="signup.html">무료 가입</a></div>
</div>

<script data-cfasync="false">
var API = 'https://api.timelink.digital';

function toast(msg, t) {
  t = t || 'info';
  var el = document.createElement('div');
  el.className = 'tl-toast ' + t;
  el.textContent = msg;
  document.getElementById('toast-box').prepend(el);
  setTimeout(function(){ el.remove(); }, 3200);
}

document.addEventListener('keydown', function(e){
  if(e.key === 'Enter') doLogin();
});

async function doLogin() {
  var email = document.getElementById('email').value.trim();
  var pw = document.getElementById('pw').value;
  var btn = document.getElementById('login-btn');
  if(!email || !pw){ toast('이메일과 비밀번호를 입력해주세요.','error'); return; }
  btn.disabled = true;
  btn.innerHTML = '<div class="spin"></div>';

  try {
    var r = await fetch(API + '/api/auth/login', {
      method: 'POST', mode: 'cors',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({email: email, password: pw})
    });
    var d = await r.json();

    if(r.ok && d.token && d.user) {
      localStorage.setItem('tl_token', d.token);
      localStorage.setItem('tl_user', JSON.stringify(d.user));
      toast('로그인 성공!','success');
      setTimeout(function(){
        var rd = new URLSearchParams(location.search).get('redirect');
        location.href = rd ? decodeURIComponent(rd) : 'shareplace.html';
      }, 600);
      return;
    }

    var msg = d.error || '이메일 또는 비밀번호가 올바르지 않습니다';
    toast(msg, 'error');
  } catch(err) {
    toast('로그인 실패. 잠시 후 다시 시도해주세요.','error');
    console.warn('[Login] 실패:', err.message);
  }

  btn.disabled = false;
  btn.textContent = '로그인';
}

// ── TON Wallet 연결 ──
function onTonConnected(addr) {
  var short = addr.slice(0,6) + '...' + addr.slice(-4);
  var btn = document.getElementById('ton-btn');
  var txt = document.getElementById('ton-btn-text');
  if (btn) btn.classList.add('connected');
  if (txt) txt.textContent = '✓ 연결됨 ' + short;
  toast('TON 지갑 연결 완료!', 'success');
  localStorage.setItem('tl_ton_address', addr);
  var token = localStorage.getItem('tl_token');
  if (token) {
    fetch(API + '/api/ton/connect', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ ton_address: addr })
    }).catch(function(){});
  }
}

function onTonDisconnected() {
  var btn = document.getElementById('ton-btn');
  var txt = document.getElementById('ton-btn-text');
  if (btn) btn.classList.remove('connected');
  if (txt) txt.textContent = 'TON Wallet 연결';
  localStorage.removeItem('tl_ton_address');
}

async function doTonConnect() {
  var txt = document.getElementById('ton-btn-text');
  if (localStorage.getItem('tl_ton_address')) {
    localStorage.removeItem('tl_ton_address');
    onTonDisconnected();
    return;
  }
  var addr = window.prompt('TonKeeper 앱에서 지갑 주소를 복사해서 붙여넣으세요\n(UQ 또는 EQ로 시작하는 48자리)', '');
  if (!addr) return;
  addr = addr.trim();
  if (!/^[0EU]Q[A-Za-z0-9_-]{46}$/.test(addr)) { toast('유효하지 않은 TON 주소입니다.', 'error'); return; }
  onTonConnected(addr);
}

// 로그인 성공 후 TON 주소 자동 저장
var _origDoLogin = doLogin;
doLogin = async function() {
  await _origDoLogin.apply(this, arguments);
  var token = localStorage.getItem('tl_token');
  var tonAddr = localStorage.getItem('tl_ton_address');
  if (token && tonAddr) {
    fetch(API + '/api/ton/connect', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ ton_address: tonAddr })
    }).catch(function(){});
  }
};

// TON 연결 상태 복원
if (localStorage.getItem('tl_ton_address')) {
  onTonConnected(localStorage.getItem('tl_ton_address'));
}
</script>
</body>
</html>
