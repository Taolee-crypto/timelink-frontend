<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TimeLink · TL3 플레이어</title>
<style>
  :root{
    --bg:#0d0d12; --card:#17171f; --card2:#1e1e28; --border:#2a2a36;
    --mint:#00e5a0; --purple:#8b5cf6; --txt:#f5f5f7; --t2:#9a9aa8; --t3:#6b6b78;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Malgun Gothic',sans-serif;min-height:100vh;padding:32px 20px}
  .wrap{max-width:1080px;margin:0 auto}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:12px}
  h1{font-size:1.6rem;font-weight:800;display:flex;align-items:center;gap:10px}
  h1 span{font-size:1.9rem}
  .badge{background:linear-gradient(135deg,var(--mint),var(--purple));color:#08110d;font-weight:800;font-size:.72rem;padding:4px 10px;border-radius:999px}
  .grid{display:grid;grid-template-columns:1fr;gap:24px}
  @media(min-width:900px){.grid{grid-template-columns:380px 1fr}}
  .card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:24px}
  .card h2{font-size:1.05rem;margin-bottom:16px}
  label{display:block;font-size:.78rem;color:var(--t2);margin:12px 0 6px}
  input,select{width:100%;padding:11px 14px;background:#101018;border:1px solid var(--border);border-radius:12px;color:var(--txt);font-size:.9rem;outline:none}
  input:focus,select:focus{border-color:var(--mint)}
  .row{display:flex;gap:10px}
  .btn{width:100%;margin-top:18px;padding:13px;background:linear-gradient(135deg,var(--mint),#00b8a0);color:#04120d;border:none;border-radius:12px;font-weight:800;font-size:.95rem;cursor:pointer;transition:.15s}
  .btn:hover{filter:brightness(1.08)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .drop{border:2px dashed var(--border);border-radius:16px;padding:28px;text-align:center;cursor:pointer;transition:.15s;color:var(--t2)}
  .drop:hover,.drop.drag{border-color:var(--mint);color:var(--mint);background:rgba(0,229,160,.04)}
  .drop .ic{font-size:2.4rem;margin-bottom:8px}
  .meta-line{font-size:.78rem;color:var(--t3);margin-top:8px;text-align:center}
  .track{display:flex;align-items:center;gap:14px;padding:12px;border-radius:14px;background:var(--card2);margin-bottom:10px;cursor:pointer;transition:.15s;border:1px solid transparent}
  .track:hover{background:#23232f}
  .track.active{border-color:var(--mint);background:rgba(0,229,160,.07)}
  .thumb{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,var(--purple),#4c1d95);display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0;overflow:hidden}
  .thumb img{width:100%;height:100%;object-fit:cover}
  .tinfo{flex:1;min-width:0}
  .ttitle{font-weight:700;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tmeta{font-size:.76rem;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tpill{font-size:.68rem;color:var(--mint);background:rgba(0,229,160,.12);padding:3px 8px;border-radius:999px;flex-shrink:0}
  .empty{color:var(--t3);text-align:center;padding:40px 10px;font-size:.9rem}
  .player{position:sticky;bottom:0;margin-top:20px;background:linear-gradient(145deg,#1b1b26,#141419);border:1px solid var(--border);border-radius:20px;padding:18px 20px;display:none}
  .player.show{display:block}
  .prow{display:flex;align-items:center;gap:14px}
  .prow .thumb{width:52px;height:52px}
  .ptitle{font-weight:700}
  .partist{font-size:.78rem;color:var(--t2)}
  .bar{height:6px;background:rgba(255,255,255,.1);border-radius:999px;margin:14px 0 6px;cursor:pointer;overflow:hidden}
  .fill{height:100%;width:0;background:linear-gradient(90deg,var(--mint),var(--purple))}
  .times{display:flex;justify-content:space-between;font-size:.72rem;color:var(--t3)}
  .ctrls{display:flex;gap:10px;margin-top:12px}
  .ico-btn{background:#25252f;border:none;color:var(--txt);width:44px;height:44px;border-radius:50%;font-size:1.05rem;cursor:pointer;transition:.15s}
  .ico-btn.play{background:var(--mint);color:#04120d;width:52px;height:52px;font-size:1.3rem}
  .ico-btn:hover{filter:brightness(1.15)}
  .status{font-size:.78rem;color:var(--t2);margin-top:10px;min-height:1.1em}
  .status.ok{color:var(--mint)} .status.err{color:#ff6b6b}
  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span>🎧</span> TimeLink TL3 플레이어 <span class="badge">LIVE</span></h1>
    <a href="/" style="color:var(--t2);font-size:.85rem;text-decoration:none">← 홈</a>
  </header>

  <div class="grid">
    <!-- Convert panel -->
    <div class="card">
      <h2>📤 MP3 → TL3 변환</h2>
      <div class="drop" id="drop">
        <div class="ic">🎵</div>
        <div id="dropText">MP3 파일을 선택하거나 끌어다 놓으세요</div>
        <div class="meta-line" id="fileMeta">최대 500MB · 브라우저/서버 양쪽 변환 지원</div>
      </div>
      <input type="file" id="fileInput" accept="audio/mpeg,.mp3" class="hidden">

      <div class="row">
        <div style="flex:2"><label>제목</label><input id="title" placeholder="곡 제목"></div>
      </div>
      <div class="row">
        <div style="flex:1"><label>아티스트</label><input id="artist" placeholder="아티스트"></div>
        <div style="flex:1"><label>장르</label>
          <select id="genre">
            <option>Pop</option><option>Rock</option><option>Hiphop</option><option>R&amp;B</option>
            <option>K-POP</option><option>J-POP</option><option>EDM</option><option>Jazz</option>
            <option>Classical</option><option>Ballad</option><option>Indie</option><option>Electronic</option>
          </select>
        </div>
      </div>
      <button class="btn" id="convertBtn" disabled>✨ TL3로 변환 후 등록</button>
      <div class="status" id="convertStatus"></div>
    </div>

    <!-- Library + player -->
    <div>
      <div class="card">
        <h2>🎼 TL3 라이브러리 <span id="count" style="color:var(--t3);font-weight:400;font-size:.85rem"></span></h2>
        <div id="list"><div class="empty">로딩 중…</div></div>
      </div>

      <div class="player" id="player">
        <div class="prow">
          <div class="thumb" id="pCover">🎵</div>
          <div style="flex:1;min-width:0">
            <div class="ptitle" id="pTitle">—</div>
            <div class="partist" id="pArtist">—</div>
          </div>
          <div class="tpill" id="pCodec">TL3</div>
        </div>
        <div class="bar" id="bar"><div class="fill" id="fill"></div></div>
        <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
        <div class="ctrls">
          <button class="ico-btn play" id="playBtn">▶</button>
          <button class="ico-btn" id="stopBtn">■</button>
        </div>
        <div class="status" id="playStatus"></div>
      </div>
    </div>
  </div>
</div>

<script src="/tl3.js"></script>
<script>
(function(){
  // The TL3 server base. Same-origin when served by the TL3 server itself;
  // falls back to the live TimeLink API when embedded elsewhere.
  var API = window.TL3_API_BASE || '';
  var audio = new Audio();
  var current = null;
  var file = null;

  var $ = function(id){ return document.getElementById(id); };

  // ---- library ----
  function fmt(s){ s=Math.round(s||0); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
  function esc(s){ return String(s||'').replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];}); }

  async function loadLibrary(){
    try{
      var r = await fetch(API + '/api/tracks');
      var d = await r.json();
      render(d.tracks || []);
    }catch(e){
      $('list').innerHTML = '<div class="empty">서버에 연결할 수 없습니다 ('+esc(e.message)+')</div>';
    }
  }

  function render(tracks){
    $('count').textContent = tracks.length ? '('+tracks.length+')' : '';
    if(!tracks.length){ $('list').innerHTML = '<div class="empty">아직 등록된 TL3 곡이 없습니다.<br>왼쪽에서 MP3를 변환해 보세요.</div>'; return; }
    $('list').innerHTML = tracks.map(function(t){
      var cover = t.cover_url ? '<img src="'+esc(t.cover_url)+'">' : '🎵';
      return '<div class="track" data-id="'+esc(t.id)+'">'+
        '<div class="thumb">'+cover+'</div>'+
        '<div class="tinfo"><div class="ttitle">'+esc(t.title)+'</div>'+
        '<div class="tmeta">'+esc(t.artist)+' · '+fmt(t.duration)+' · '+esc(t.genre||'')+'</div></div>'+
        '<div class="tpill">TL3</div></div>';
    }).join('');
    Array.prototype.forEach.call($('list').querySelectorAll('.track'), function(el){
      el.onclick = function(){ playTrack(el.getAttribute('data-id')); };
    });
  }

  // ---- playback ----
  async function playTrack(id){
    try{
      var r = await fetch(API + '/api/tracks/' + encodeURIComponent(id));
      var d = await r.json();
      if(!d.ok) throw new Error(d.error || 'track not found');
      var t = d.track;
      current = t;

      $('player').classList.add('show');
      $('pTitle').textContent = t.title;
      $('pArtist').textContent = t.artist + ' · ' + (t.genre||'');
      $('pCover').innerHTML = t.cover_url ? '<img src="'+esc(t.cover_url)+'">' : '🎵';
      setStatus('TL3 디코딩 중…', '');

      // Decode TL3 bytes and play the resulting mp3 via a Blob URL.
      var res = await TL3.attach(audio, API + '/api/stream/' + encodeURIComponent(id), {autoplay:false});
      await audio.play();
      setStatus(res.decoded ? '▶ TL3 디코딩 완료 — 재생 중' : '▶ 재생 중 (일반 오디오)', 'ok');
      $('playBtn').textContent = '⏸';
      highlight(id);
    }catch(e){
      setStatus('재생 실패: ' + e.message, 'err');
    }
  }

  function highlight(id){
    Array.prototype.forEach.call(document.querySelectorAll('.track'), function(el){
      el.classList.toggle('active', el.getAttribute('data-id') === id);
    });
  }

  function setStatus(msg, cls){ var s=$('playStatus'); s.textContent=msg; s.className='status '+(cls||''); }

  $('playBtn').onclick = function(){
    if(!current){ setStatus('재생할 곡을 선택하세요', ''); return; }
    if(audio.paused){ audio.play().then(function(){ $('playBtn').textContent='⏸'; }); }
    else{ audio.pause(); $('playBtn').textContent='▶'; }
  };
  $('stopBtn').onclick = function(){
    TL3.stop(audio); $('playBtn').textContent='▶'; $('fill').style.width='0';
    $('cur').textContent='0:00'; setStatus('정지됨', '');
  };
  audio.addEventListener('timeupdate', function(){
    if(!audio.duration) return;
    $('fill').style.width = (audio.currentTime/audio.duration*100)+'%';
    $('cur').textContent = fmt(audio.currentTime);
    $('dur').textContent = fmt(audio.duration);
  });
  audio.addEventListener('ended', function(){ $('playBtn').textContent='▶'; setStatus('재생 완료', ''); });
  $('bar').onclick = function(e){
    if(!audio.duration) return;
    var rect = this.getBoundingClientRect();
    audio.currentTime = (e.clientX-rect.left)/rect.width * audio.duration;
  };

  // ---- convert ----
  var drop = $('drop'), input = $('fileInput');
  drop.onclick = function(){ input.click(); };
  drop.addEventListener('dragover', function(e){ e.preventDefault(); drop.classList.add('drag'); });
  drop.addEventListener('dragleave', function(){ drop.classList.remove('drag'); });
  drop.addEventListener('drop', function(e){
    e.preventDefault(); drop.classList.remove('drag');
    if(e.dataTransfer.files[0]) onFile(e.dataTransfer.files[0]);
  });
  input.onchange = function(){ if(this.files[0]) onFile(this.files[0]); };

  function onFile(f){
    if(!/\.mp3$/i.test(f.name) && !f.type.includes('mp3')){ setConvertStatus('MP3 파일만 업로드 가능합니다', 'err'); return; }
    file = f;
    $('dropText').textContent = f.name;
    $('fileMeta').textContent = (f.size/1048576).toFixed(1)+' MB · MP3';
    if(!$('title').value) $('title').value = f.name.replace(/\.mp3$/i,'').replace(/[_-]+/g,' ');
    $('convertBtn').disabled = false;

    // read duration locally
    var probe = document.createElement('audio');
    var url = URL.createObjectURL(f);
    probe.preload = 'metadata';
    probe.onloadedmetadata = function(){ window._dur = Math.round(probe.duration)||0; URL.revokeObjectURL(url); };
    probe.src = url;
  }

  function setConvertStatus(msg, cls){ var s=$('convertStatus'); s.textContent=msg; s.className='status '+(cls||''); }

  $('convertBtn').onclick = async function(){
    if(!file) return;
    var btn = this; btn.disabled = true;
    setConvertStatus('서버에서 MP3 → TL3 변환 중…', '');
    try{
      var fd = new FormData();
      fd.append('file', file, file.name);
      fd.append('title', $('title').value.trim() || file.name);
      fd.append('artist', $('artist').value.trim() || 'Unknown Artist');
      fd.append('genre', $('genre').value);
      fd.append('duration', String(window._dur||0));
      var r = await fetch(API + '/api/convert', {method:'POST', body:fd});
      var d = await r.json();
      if(!d.ok) throw new Error(d.error || 'convert failed');
      setConvertStatus('✅ TL3 변환 완료! (' + d.track.size.toLocaleString() + ' bytes)', 'ok');
      file = null; $('dropText').textContent = 'MP3 파일을 선택하거나 끌어다 놓으세요';
      $('fileMeta').textContent = '최대 500MB · 브라우저/서버 양쪽 변환 지원';
      $('fileInput').value = '';
      loadLibrary();
    }catch(e){
      setConvertStatus('변환 실패: ' + e.message, 'err');
    }finally{
      btn.disabled = false;
    }
  };

  loadLibrary();

  // ---- self-test hook (?selftest=1): verifies real playback in headless runs ----
  if(/[?&]selftest=1/.test(location.search)){
    setTimeout(async function(){
      try{
        var r = await fetch(API + '/api/tracks');
        var d = await r.json();
        if(!d.tracks || !d.tracks.length){ console.log('SELFTEST: no tracks to play'); return; }
        var first = d.tracks[0];
        console.log('SELFTEST: playing', first.id, first.title);
        var streamUrl = API + '/api/stream/' + encodeURIComponent(first.id);
        console.log('SELFTEST: streamUrl=' + streamUrl);
        var res = await TL3.attach(audio, streamUrl, {autoplay:false});
        console.log('SELFTEST: attach decoded=' + res.decoded + ' src=' + audio.src.slice(0,30));
        try { await audio.play(); console.log('SELFTEST: play() resolved'); }
        catch(pe){ console.log('SELFTEST: play() rejected: ' + pe.name + ' ' + pe.message); }
        setTimeout(function(){
          var ok = !audio.paused && audio.currentTime > 0;
          console.log('SELFTEST RESULT: playing='+(!audio.paused)+' currentTime='+audio.currentTime.toFixed(2)+' src='+(audio.src.slice(0,24))+ ' PASS='+ok);
        }, 1500);
      }catch(e){ console.log('SELFTEST ERROR: '+e.message); }
    }, 600);
  }
})();
</script>
</body>
</html>
