</style><link rel="stylesheet" href="/renewal/activity.css?v=20261026compact1"></head><body class="activity-page"><main><section class="hero"><div><span class="eyebrow">TILO PERSONAL SPACE</span><h1>나의 차</h1><p>내 차를 소개하고, 좋아하는 음악과 함께하세요.</p></div></section><div class="grid"><section class="panel"><span class="panel-kicker">MY SPACE</span><h2>나의 차 개설 · 관리</h2><p>등록된 나의 차에는 타임링크 음원 홍보단 스티커가 표시됩니다.</p><div id="promoSticker" class="hidden"><span class="promo-sticker">🚗 TIMELINK <small>음원 홍보단</small></span></div><p id="state" role="status">개설 상태를 확인하고 있습니다.</p><div id="detail"></div><a class="btn hidden" id="create" href="/incar-channel.html">차량번호로 개설하기</a><a class="btn secondary hidden" id="manage" href="/incar-studio.html">내 공간 관리</a></section><section class="panel activity-feature" style="--feature-photo:url('/images/renewal/car-interior-card.jpg')"><span class="panel-kicker">MUSIC IN YOUR SPACE</span><h2>방송 듣기</h2><p>차에서 TILO 중앙방송을 들으세요.</p><div class="listening-actions"><a class="btn" id="centralListen" href="/radio.html?autojoin=1">중앙방송</a></div></section><section class="panel activity-feature" style="--feature-photo:url('/images/renewal/car-interior-card.jpg')"><span class="panel-kicker">EXPLORE THE WORLD</span><h2>카월드</h2><p>다른 회원의 자동차와 이야기를 만나보세요.</p><a class="btn secondary" href="/my-car-world.html">둘러보기</a></section></div></main><script>
(async function(){const token=localStorage.getItem('tl_token')||'';const state=document.getElementById('state');const create=document.getElementById('create');const manage=document.getElementById('manage');if(!token){state.textContent='로그인 후 내 공간을 개설할 수 있습니다.';create.textContent='로그인하기';create.href='/login.html';create.classList.remove('hidden');return}try{const r=await fetch((window.TL3_API_BASE||'https://api.timelink.digital')+'/api/incar/my-channel',{headers:{Authorization:'Bearer '+token},cache:'no-store'});if(!r.ok)throw Error('조회 실패 ('+r.status+')');const data=await r.json();if(data.ok===false)throw Error(data.error||'조회 실패');const entry=(data.registered?data.channel:null);if(entry){document.getElementById('promoSticker').classList.remove('hidden');state.textContent='개설된 내 공간이 있습니다.';state.className='status';const n=document.createElement('p');n.textContent=entry.name||entry.channel_name||'내 공간';document.getElementById('detail').appendChild(n);manage.classList.remove('hidden')}else{state.textContent='아직 개설된 공간이 없습니다. 차량번호를 입력해 시작하세요.';create.classList.remove('hidden')}}catch(e){state.textContent='개설 상태를 확인할 수 없습니다. 잠시 후 다시 시도해 주세요. '+e.message}})();
</script><script src="/sidebar.js?v=20261029-account-navigation-v2"></script></body></html>
